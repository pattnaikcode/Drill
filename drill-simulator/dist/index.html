<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpsPilot Drills</title>
<meta name="description" content="Incident drill simulator for production support teams: design a system, add use cases, investigate with Grafana, Splunk, SQL and Unix tools, and get scored.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one operations console. Header carries the clock and business impact; the system map
   is the centre of attention; response controls sit beside it; the inspector reads beneath. */
:root {
  --bg: #F1F3F6;
  --panel: #FFFFFF;
  --sunk: #F6F8FA;
  --ink: #18202B;
  --muted: #5A6577;
  --line: #D9DEE6;
  --accent: #1F5FBF;
  --accent-soft: #E4ECF8;
  --ok: #1D7F52; --ok-soft: #E1F2E9;
  --warn: #A86300; --warn-soft: #FBEFD9;
  --bad: #BE2F3A; --bad-soft: #FBE4E6; --on-bad: #FFFFFF;
  --term: #111821; --term-ink: #CBD5E3;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --panel: #151C26; --sunk: #1A2230; --ink: #E3E8F0; --muted: #96A1B3; --line: #283244;
    --accent: #7EA6F2; --accent-soft: #1D2A44;
    --ok: #4FC48C; --ok-soft: #12301F; --warn: #E6A645; --warn-soft: #36280F; --bad: #F06D77; --bad-soft: #3A1A1F; --on-bad: #2A0C10;
    --term: #0A0E14; --term-ink: #C3CEDD; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --panel: #151C26; --sunk: #1A2230; --ink: #E3E8F0; --muted: #96A1B3; --line: #283244;
  --accent: #7EA6F2; --accent-soft: #1D2A44;
  --ok: #4FC48C; --ok-soft: #12301F; --warn: #E6A645; --warn-soft: #36280F; --bad: #F06D77; --bad-soft: #3A1A1F; --on-bad: #2A0C10;
  --term: #0A0E14; --term-ink: #C3CEDD; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .2px; text-wrap: balance; margin: 0; }
h2 { font-size: 19px; }
h3 { font-size: 15.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--display); font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.brand b { font-family: var(--display); font-size: 20px; font-weight: 700; display: block; line-height: 1.1; }
.brand span { font-size: 12.5px; color: var(--muted); }
.clock { display: flex; flex-direction: column; }
.clock .t { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1.1; }
.kpi { display: flex; flex-direction: column; min-width: 120px; }
.kpi .v { font-family: var(--mono); font-size: 17px; font-weight: 500; }
.kpi .v.warn { color: var(--warn); } .kpi .v.bad { color: var(--bad); }
.grow { flex: 1; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.state-chip { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 12px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.state-chip.live { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.tabs { max-width: 1440px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1440px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > select { flex: 1 1 150px; max-width: 100%; }
.controls select { flex: none; }
.between { justify-content: space-between; }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 13px; border-radius: 6px; font-weight: 500; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.sm { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
select, input[type=text], textarea { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.field > select, label.field > input { color: var(--ink); width: 100%; }

.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 10px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mut { background: var(--sunk); color: var(--muted); }
.pill.info { background: var(--accent-soft); color: var(--accent); }

/* drill library */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; text-align: left; }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card:disabled { opacity: .55; }
.card h3 { font-size: 17px; }
.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; }

/* run */
.run { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.run > .wide { grid-column: 1 / -1; }
.pick { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.pick select { width: 100%; }
.pick .btn { justify-self: start; }
.map { overflow-x: auto; }
.map svg { display: block; width: 100%; min-width: 640px; height: auto; }
.node { cursor: pointer; }
.node rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.4; }
.node.ok rect.bar { fill: var(--ok); } .node.warn rect.bar { fill: var(--warn); } .node.bad rect.bar { fill: var(--bad); }
.node text { fill: var(--ink); font-family: var(--body); }
.node text.k { fill: var(--muted); font-size: 11.5px; }
.node text.m { font-family: var(--mono); font-size: 12px; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dep { stroke-dasharray: 4 4; }
.edge-l { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.pbar { fill: var(--accent); } .pbar.hot { fill: var(--bad); } .ptrack { fill: var(--sunk); }

.alerts { display: grid; gap: 6px; max-height: 250px; overflow-y: auto; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; background: var(--panel); text-align: left; width: 100%; }
.alert.resolved { opacity: .6; }
.alert .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.brief { font-size: 14px; }
.hint { border-left: 3px solid var(--accent); padding: 4px 10px; font-size: 13.5px; background: var(--accent-soft); border-radius: 0; }
.feed { display: grid; gap: 6px; font-size: 13px; max-height: 200px; overflow-y: auto; }
.feed div { border-left: 3px solid var(--line); padding-left: 8px; }
.feed div.ok { border-color: var(--ok); } .feed div.bad { border-color: var(--bad); }
.approve { border: 1px dashed var(--bad); border-radius: 6px; padding: 10px; display: grid; gap: 8px; background: var(--bad-soft); }
.approve .err { color: var(--bad); font-size: 13px; font-weight: 600; }

/* inspector */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--sunk); }
.tile .v { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.tile svg { display: block; width: 100%; height: 34px; margin-top: 4px; }
.spark-l { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark-a { fill: var(--accent-soft); stroke: none; }
.spark-d { fill: var(--accent); }
.term { background: var(--term); color: var(--term-ink); font-family: var(--mono); font-size: 12.3px; line-height: 1.55; border-radius: 6px; padding: 10px 12px; height: 240px; overflow: auto; white-space: pre; }
.term .E { color: #FF8A93; } .term .W { color: #F2BE6B; }

/* blueprint */
.bp { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
textarea.code { width: 100%; min-height: 560px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; tab-size: 2; color: var(--ink); }
.errors { color: var(--bad); font-size: 13.5px; margin: 0; padding-left: 18px; }
.okmsg { color: var(--ok); font-size: 13.5px; font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--sunk); padding: 0 4px; border-radius: 3px; }

/* debrief */
.score { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.score .big { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.parts { display: grid; gap: 8px; }
.part { display: grid; grid-template-columns: 190px 1fr 56px; gap: 10px; align-items: center; font-size: 14px; }
.part .track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.part .fill { height: 100%; background: var(--accent); }
.part .note { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.tl li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
.tl li time { font-family: var(--mono); color: var(--muted); }
.tl li.k-fault { color: var(--bad); font-weight: 600; } .tl li.k-fixed, .tl li.k-recovered { color: var(--ok); font-weight: 600; } .tl li.k-alert { color: var(--warn); }
.cls { font-size: 12px; font-weight: 600; }
.cls.accepted { color: var(--ok); } .cls.risky { color: var(--bad); } .cls.unnecessary { color: var(--warn); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
footer { max-width: 1440px; margin: 0 auto; padding: 0 16px 28px; color: var(--muted); font-size: 12.5px; }


/* system diagram (shared by live map and flow diagram) */
.grp { fill: var(--sunk); stroke: var(--line); stroke-dasharray: 5 4; }
.grp-l { fill: var(--muted); font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.arrowhead { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.edge.dep { stroke-dasharray: 5 4; }
.edge.feed { stroke-dasharray: 1.5 4; stroke-width: 1.8; }
.node.plain rect.bar { fill: var(--accent); }
.node.plain.t-source rect.bar, .node.plain.t-issuer rect.bar, .node.plain.t-external_party rect.bar { fill: var(--muted); }
.badge circle { fill: var(--accent); }
.badge text { fill: var(--panel); font-family: var(--mono); font-size: 11px; font-weight: 500; }
ol.steps { margin: 0; padding-left: 26px; display: grid; gap: 4px; font-size: 14px; max-width: 90ch; }
ol.steps li::marker { font-family: var(--mono); color: var(--accent); font-weight: 500; }

/* secondary tabs (map view, investigation tools) */
.tabs2 { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs2 button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; font-family: var(--display); font-weight: 600; font-size: 14.5px; color: var(--muted); }
.tabs2 button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunk); border-radius: 14px; padding: 2px 10px; font-family: var(--mono); font-size: 12px; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
input.grow { flex: 1 1 220px; }
textarea.code.sql { min-height: 70px; }
.err-box { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); font-family: var(--mono); font-size: 12.5px; }
.tablewrap.res { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.tablewrap.res th { position: sticky; top: 0; background: var(--panel); }

/* grafana-style panels */
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.gpanel { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 4px; background: var(--sunk); min-width: 0; }
.gpanel svg { display: block; width: 100%; height: auto; }
.gtitle { font-size: 13px; font-weight: 600; }
.gval { font-family: var(--mono); font-size: 14px; }
.gval.over { color: var(--bad); }
.gpanel .grid { stroke: var(--line); stroke-width: 1; }
.gpanel .thr { stroke: var(--bad); stroke-dasharray: 5 4; stroke-width: 1.2; }
.gpanel .area { fill: var(--accent-soft); }
.gpanel .ln { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.gpanel .dot { fill: var(--accent); }
.ax { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; }

/* splunk-style histogram */
.hist { display: block; width: 100%; max-width: 640px; height: auto; }
.hist .hb { fill: var(--accent-soft); stroke: var(--accent); stroke-width: .6; }
.hist .hbe { fill: var(--warn); opacity: .75; }
.tl li.k-tool { color: var(--accent); }

@media (max-width: 1080px) { .run, .bp { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .part { grid-template-columns: 1fr 48px; } .part .track { grid-column: 1 / -1; grid-row: 2; } .part .note { grid-column: 1 / -1; margin-top: 0; }
  .score { grid-template-columns: 1fr; }
  .clock .t { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* root cause evidence and instructor panel */
textarea.evidence { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; background: var(--sunk); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; resize: vertical; }
.panel.instr { border-style: dashed; border-color: var(--bad); }

/* follow an order */
ol.tsteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tstep { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 7px 10px; display: grid; gap: 3px; background: var(--panel); }
.tstep.ok { border-left-color: var(--ok); }
.tstep.rej { border-left-color: var(--warn); }
.tstep.stuck { border-left-color: var(--bad); background: var(--sunk); }
.tstep.now { border-left-color: var(--accent, #1F5FBF); }
.tstep.todo { opacity: .55; }
.tmsg { color: var(--muted); overflow-wrap: anywhere; }
.twrite { color: var(--ok); overflow-wrap: anywhere; }
.bad-t { color: var(--bad); }
.chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
.tracer circle { fill: var(--accent); stroke: #fff; stroke-width: 2; }
.tracer.waiting circle { fill: var(--bad); animation: tpulse 1s ease-in-out infinite; }
@keyframes tpulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .tracer.waiting circle { animation: none; } }

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>OpsPilot Drills</b><span id="sysName">Incident drills on a simulated system</span></div>
    <div class="clock"><span class="label">Simulated time</span><span class="t" id="clock">13:30:00</span><span class="small muted" id="cutoff"></span></div>
    <div class="row" id="kpis" style="gap:22px"></div>
    <div class="grow"></div>
    <div class="controls">
      <span class="state-chip" id="stateChip">Sandbox</span>
      <button class="btn sm" id="pauseBtn">Pause</button>
      <label class="small muted row" style="gap:4px">Speed
        <select id="speed" aria-label="Simulation speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="drills">Drills</button>
    <button role="tab" data-tab="run">System</button>
    <button role="tab" data-tab="design">Design</button>
    <button role="tab" data-tab="debrief">Debrief</button>
  </nav>
</header>
<main id="main"></main>
<footer>Simulated environment: synthetic orders and trades only, no real systems or client data. Systems and use cases are plain YAML.</footer>
<div id="toast" role="status" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:90vw"></div>

<script>
window.DRILL_CONTENT = {"blueprints": {"exchange": "# An equity exchange: members (brokers and market makers) trade through the exchange's\n# order entry gateway, order validation and matching engine. Listed companies (issuers) keep the instrument\n# master current through corporate actions. Trades go to the clearing corporation over\n# an internal Kafka bus; market data and drop copies go out to subscribers and members.\n\nid: exchange\nsystem: Equity exchange trading platform\ndescription: >\n  Three brokers and two market makers connect over FIX. Orders pass session and throttle\n  checks at the order entry gateway (OEGW), validation against the instrument master, and price-time\n  matching. Trades reach the clearing corporation before the clearing cut-off.\n\nclock:\n  start: \"14:30\"\n  cutoff: \"15:30\"\n  cutoff_label: Clearing cut-off\n\nbusiness:\n  currency: \"₹\"\n  unit: \"Cr\"\n  unit_name: orders\n  avg_notional: 0.04          # about ₹4 lakh per order\n  kpis:\n    - {label: \"Orders waiting to match\", at: matching}\n    - {label: \"Trades not with clearing\", at: clearing, cutoff: true}\n\ncomponents:\n  # members\n  - {id: broker_a, type: source, role: Broker, name: Kestrel Securities, session: KEST01, rate_per_min: 420}\n  - {id: broker_b, type: source, role: Broker, name: Narmada Capital, session: NRMD02, rate_per_min: 300}\n  - {id: broker_c, type: source, role: Broker, name: Bluewater Broking, session: BLUW03, rate_per_min: 230}\n  - {id: mm_1, type: source, role: Market maker, name: Arcline Markets, session: ARCL11, rate_per_min: 600}\n  - {id: mm_2, type: source, role: Market maker, name: Delta Quotes, session: DLTQ12, rate_per_min: 450}\n\n  # exchange trading system\n  - {id: fix_gateway, type: service, role: Exchange, name: Order Entry Gateway (OEGW), capacity_per_min: 2700, instances: 3}\n  - {id: risk, type: service, role: Exchange, name: Order Validation, capacity_per_min: 2800, instances: 4, uses: [instrument_master], rejects: return}\n  - {id: matching, type: service, role: Exchange, name: Matching Engine, capacity_per_min: 3000, instances: 2, uses: [orderbook_db]}\n  - {id: instrument_master, type: ref_data, name: Instrument Master, refresh_every_min: 10, stale_after_min: 30}\n  - {id: orderbook_db, type: database, name: Order Book Store, pool_size: 80, big_table: ORDER_HIST}\n\n  # listed companies\n  - {id: issuer_1, type: issuer, role: Issuer, name: Mahanadi Power Ltd, symbol: MAHPWR, feeds: instrument_master}\n  - {id: issuer_2, type: issuer, role: Issuer, name: Konark Steel Ltd, symbol: KONSTL, feeds: instrument_master}\n  - {id: issuer_3, type: issuer, role: Issuer, name: Chilika Foods Ltd, symbol: CHLKFD, feeds: instrument_master}\n\n  # post-trade\n  - {id: trade_bus, type: kafka_topic, name: trades.matched, partitions: 8, consumer_group: clearing-feed}\n  - {id: clearing_feed, type: service, role: Exchange, name: Clearing Feed Adapter, capacity_per_min: 2600, instances: 2}\n  - {id: clearing, type: external_party, role: Clearing corporation, name: Clearing Corporation, capacity_per_min: 3600}\n\n  # market surveillance: every order event and trade from matching, on its own Kafka topic\n  - {id: surv_bus, type: kafka_topic, role: \"Kafka: orders and trades\", name: matching.events, partitions: 8, consumer_group: surveillance}\n  - {id: surveillance, type: service, role: Surveillance, name: Market Surveillance, capacity_per_min: 3000, instances: 2}\n\n  # market data and drop copy\n  - {id: md_publisher, type: service, role: Exchange, name: Market Data Adaptor, capacity_per_min: 3000, instances: 2}\n  - {id: md_vendors, type: external_party, role: Subscribers, name: Market Data Vendors, capacity_per_min: 3200}\n  - {id: drop_copy, type: service, role: Exchange, name: Drop Copy Service, capacity_per_min: 3000, instances: 2}\n\nflow:\n  - broker_a -> fix_gateway\n  - broker_b -> fix_gateway\n  - broker_c -> fix_gateway\n  - mm_1 -> fix_gateway\n  - mm_2 -> fix_gateway\n  - fix_gateway -> risk -> matching -> trade_bus -> clearing_feed -> clearing\n  - matching -> md_publisher -> md_vendors\n  - matching -> drop_copy\n  - matching -> surv_bus -> surveillance\n\n# ---------------------------------------------------------------- follow an order\n# Tables written by orders as they move, and the journeys a learner can follow hop by hop.\n# Placeholders in {braces} are filled from the order (order_id, clordid, trade_id, exec_id, seq, sending_time,\n# partition, offset ...). FIX messages are shown with | in place of the SOH separator.\ntables:\n  orders: {db: orderbook_db, columns: [order_id, clordid, member, symbol, side, qty, price, filled_qty, status, reject_reason, created_at, updated_at]}\n  trades: {db: orderbook_db, columns: [trade_id, order_id, symbol, side, qty, price, counterparty, clearing_status, traded_at]}\n\njourneys:\n  - id: filled\n    name: Buy order fully filled\n    order: {member: KEST01, symbol: KONSTL, side: BUY, qty: 100, price: 1203.40}\n    steps:\n      - at: broker_a\n        does: \"Kestrel's own pre-trade risk system (RMS) has already checked the client's margin, credit limit and order size. Kestrel's FIX engine, connected to our OEGW over a TCP session (KEST01), then sends a NewOrderSingle (35=D): buy (54=1) 100 (38) KONSTL (55) limit (40=2) at 1203.40 (44), good for the day (59=0).\"\n        message: \"8=FIX.4.4|35=D|49=KEST01|56=OEGW|34={seq}|52={sending_time}|11={clordid}|55=KONSTL|54=1|38=100|40=2|44=1203.40|59=0|10=128|\"\n      - at: fix_gateway\n        does: \"OEGW checks the TCP session is logged on (35=A done at start of day), MsgSeqNum 34={seq} is the next expected number, and Kestrel is within its message throttle. Assigns exchange order id {order_id} and acknowledges with an ExecutionReport (35=8) pending new.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=KEST01|11={clordid}|37={order_id}|17={exec_id}|150=A|39=A|55=KONSTL|54=1|38=100|44=1203.40|\"\n        writes: [\"orders: insert status=PENDING_NEW filled_qty=0\"]\n      - at: risk\n        does: \"Order validation checks KONSTL is tradable, the price is inside today's band from the instrument master (1083.06 to 1323.74), and tick and lot size are valid. Client risk was the broker's job, before sending.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=KEST01|11={clordid}|37={order_id}|150=0|39=0|  (new: order accepted onto the book)\"\n        writes: [\"orders: update status=NEW\"]\n      - at: matching\n        does: \"The validated order reaches the matching engine. Arcline Markets (market maker) is quoting KONSTL 1203.10 bid / 1203.40 offer for 250. The matching rules (price, then time priority) match Kestrel's buy at 1203.40 against that quote: 100 trade at 1203.40 with trade id {trade_id}. The fill, with the trade id in tag 880 (TrdMatchID), goes back to Kestrel as an ExecutionReport.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=KEST01|11={clordid}|37={order_id}|150=F|39=2|32=100|31=1203.40|14=100|151=0|880={trade_id}|  (sent back to Kestrel over its TCP session via OEGW; Arcline gets its own 35=8 for its side)\"\n        writes: [\"orders: update status=FILLED filled_qty=100\", \"trades: insert counterparty=ARCL11 clearing_status=PENDING\"]\n      - at: trade_bus\n        does: \"Matching publishes the trade to Kafka, keyed by symbol so every KONSTL trade stays in order on one partition.\"\n        message: \"Kafka trades.matched | partition {partition} offset {offset} key=KONSTL value={trade_id}\"\n      - at: clearing_feed\n        does: \"Consumes the trade and converts it to the clearing corporation's trade report format.\"\n        message: \"Trade report {trade_id}: BUY 100 KONSTL @ 1203.40, KEST01 vs ARCL11\"\n      - at: clearing\n        does: \"The clearing corporation accepts the trade and becomes the counterparty to both sides for settlement.\"\n        writes: [\"trades: update clearing_status=ACCEPTED\"]\n      - at: surv_bus\n        from: matching\n        does: \"Matching publishes the order's events and the trade to matching.events for surveillance: the order arriving, then its fill.\"\n        message: \"Kafka matching.events | partition {partition} offset {offset} key=KONSTL | ORDER_NEW {order_id} BUY 100 @ 1203.40 · TRADE {trade_id} 100 @ 1203.40 · ORDER_FILLED {order_id}\"\n      - at: surveillance\n        does: \"Market surveillance consumes the order events and the trade, and runs its alert rules (for example wash trades, spoofing, layering, unusual price moves).\"\n        message: \"Surveillance: order {order_id} KEST01 and trade {trade_id} KEST01 vs ARCL11, KONSTL 100 @ 1203.40, checked\"\n      - at: md_publisher\n        from: matching\n        does: \"The market data adaptor receives the book change and the trade from matching.\"\n        message: \"Book update KONSTL: offer 1203.40 x 150 (was 250) · last trade 100 @ 1203.40\"\n      - at: md_vendors\n        does: \"Vendors and brokers' screens show the new best offer and the last traded price.\"\n\n\n  - id: rejected\n    name: Order rejected by the venue's price band\n    order: {member: NRMD02, symbol: MAHPWR, side: BUY, qty: 500, price: 470.00}\n    steps:\n      - at: broker_b\n        does: \"Narmada Capital's RMS passes the order (the client has enough limit), and it is sent as a NewOrderSingle (35=D) over TCP session NRMD02: buy 500 MAHPWR at 470.00, well above the market.\"\n        message: \"8=FIX.4.4|35=D|49=NRMD02|56=OEGW|34={seq}|52={sending_time}|11={clordid}|55=MAHPWR|54=1|38=500|40=2|44=470.00|59=0|10=211|\"\n      - at: fix_gateway\n        does: \"OEGW session, sequence and throttle checks pass. Assigns exchange order id {order_id}.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=NRMD02|11={clordid}|37={order_id}|150=A|39=A|\"\n        writes: [\"orders: insert status=PENDING_NEW filled_qty=0\"]\n      - at: risk\n        does: \"Order validation checks the price against today's MAHPWR band from the instrument master.\"\n        reject: \"Price 470.00 is outside today's band for MAHPWR (371.25 to 453.75)\"\n        reject_message: \"8=FIX.4.4|35=8|49=OEGW|56=NRMD02|11={clordid}|37={order_id}|150=8|39=8|58=Price outside band|  (rejected; 58 carries the reason)\"\n\n  - id: broker_blocked\n    name: Order stopped by the broker's risk checks\n    order: {member: KEST01, symbol: KONSTL, side: BUY, qty: 50000, price: 1203.40}\n    steps:\n      - at: broker_a\n        does: \"A Kestrel client keys 50,000 KONSTL instead of 500 (a fat finger): about ₹6 crore.\"\n        reject: \"Kestrel's RMS blocks it: order value ₹6.02 Cr is above the client's ₹50 lakh limit. The order is never sent, so the venue has no record of it.\"\n        on_reject: {writes: []}\n      - at: fix_gateway\n        does: \"Never reached: nothing arrives at the OEGW.\"\n\n  - id: partial\n    name: Sell order partly filled, rest stays on the book\n    order: {member: BLUW03, symbol: CHLKFD, side: SELL, qty: 1000, price: 286.10}\n    steps:\n      - at: broker_c\n        does: \"Bluewater Broking sends a NewOrderSingle (35=D) over its TCP session BLUW03: sell (54=2) 1,000 CHLKFD at 286.10.\"\n        message: \"8=FIX.4.4|35=D|49=BLUW03|56=OEGW|34={seq}|52={sending_time}|11={clordid}|55=CHLKFD|54=2|38=1000|40=2|44=286.10|59=0|10=045|\"\n      - at: fix_gateway\n        does: \"OEGW session, sequence and throttle checks pass. Assigns exchange order id {order_id}.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=BLUW03|11={clordid}|37={order_id}|150=A|39=A|\"\n        writes: [\"orders: insert status=PENDING_NEW filled_qty=0\"]\n      - at: risk\n        does: \"Price within the CHLKFD band; member limit fine.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=BLUW03|11={clordid}|37={order_id}|150=0|39=0|\"\n        writes: [\"orders: update status=NEW\"]\n      - at: matching\n        does: \"Delta Quotes (market maker) is quoting CHLKFD 286.10 bid for 600. The matching rules match 600 of Bluewater's sell against that quote; the remaining 400 rests on the book at 286.10 until it trades, is cancelled or the day ends.\"\n        message: \"8=FIX.4.4|35=8|49=OEGW|56=BLUW03|11={clordid}|37={order_id}|150=F|39=1|32=600|31=286.10|14=600|151=400|880={trade_id}|  (partially filled: 400 still open)\"\n        writes: [\"orders: update status=PARTIALLY_FILLED filled_qty=600\", \"trades: insert qty=600 counterparty=DLTQ12 clearing_status=PENDING\"]\n      - at: trade_bus\n        does: \"The trade for the 600 filled is published to Kafka, keyed by symbol.\"\n        message: \"Kafka trades.matched | partition {partition} offset {offset} key=CHLKFD value={trade_id}\"\n      - at: clearing_feed\n        does: \"Converts the trade to the clearing format.\"\n        message: \"Trade report {trade_id}: SELL 600 CHLKFD @ 286.10, BLUW03 vs DLTQ12\"\n      - at: clearing\n        does: \"Clearing accepts the 600. The resting 400 is not a trade yet, so clearing never sees it.\"\n        writes: [\"trades: update clearing_status=ACCEPTED\"]\n      - at: surv_bus\n        from: matching\n        does: \"Matching publishes the order's events and the trade to matching.events for surveillance.\"\n        message: \"Kafka matching.events | partition {partition} offset {offset} key=CHLKFD | ORDER_NEW {order_id} SELL 1000 @ 286.10 · TRADE {trade_id} 600 @ 286.10 · ORDER_PARTIALLY_FILLED {order_id} leaves 400\"\n      - at: surveillance\n        does: \"Surveillance runs its alert rules on the order and the trade; the resting 400 stays under watch as an open order (orders that never trade matter for spoofing and layering).\"\n        message: \"Surveillance: order {order_id} BLUW03 (400 open) and trade {trade_id} BLUW03 vs DLTQ12, CHLKFD 600 @ 286.10\"\n      - at: md_publisher\n        from: matching\n        does: \"The market data adaptor receives the book change and the trade.\"\n        message: \"Book update CHLKFD: bid 286.10 removed · offer 286.10 x 400 (Bluewater's rest) · last trade 600 @ 286.10\"\n      - at: md_vendors\n        does: \"Screens show the new best offer and the last traded price.\"\n\n\nalerts:\n  - {name: \"Member session disconnected\", on: fix_gateway, metric: sessions_down, above: 0, severity: P2}\n  - {name: \"Gateway inbound rate high\", on: fix_gateway, metric: in_rate, above: 2600, severity: P3}\n  - {name: \"Gateway queue building\", on: fix_gateway, metric: backlog, above: 1500, severity: P2}\n  - {name: \"Risk reject rate high\", on: risk, metric: reject_rate, above: 2, severity: P2}\n  - {name: \"Matching throughput low\", on: matching, metric: out_rate, below: 1400, severity: P2}\n  - {name: \"Order book store pool saturated\", on: orderbook_db, metric: pool_pct, above: 90, severity: P2}\n  - {name: \"Trade bus partition lag\", on: trade_bus, metric: max_partition_lag, above: 400, severity: P2}\n  - {name: \"Clearing submissions backing up\", on: clearing, metric: backlog, above: 2500, severity: P2}\n  - {name: \"Surveillance consumer lag\", on: surv_bus, metric: lag, above: 3000, severity: P3}\n\ndiagram:\n  notes: >\n    Members cannot see inside the exchange, and the exchange cannot see inside members or issuers.\n    Support works from the exchange's own gateway, risk, matching and post-trade signals.\n    The matching engine sends its output to every downstream: trades to clearing, book updates to the market\n    data adaptor, fills to drop copy, and every order event and trade to surveillance.\n  groups:\n    - {label: \"Members\", ids: [broker_a, broker_b, broker_c, mm_1, mm_2]}\n    - {label: \"Exchange trading system\", ids: [fix_gateway, risk, matching, instrument_master, orderbook_db]}\n    - {label: \"Listed companies (issuers)\", ids: [issuer_1, issuer_2, issuer_3]}\n    - {label: \"Post-trade\", ids: [trade_bus, clearing_feed, clearing]}\n    - {label: \"Market data and drop copy\", ids: [md_publisher, md_vendors, drop_copy]}\n    - {label: \"Market surveillance\", ids: [surv_bus, surveillance]}\n  place:\n    broker_a: [0, 0]\n    broker_b: [0, 1]\n    broker_c: [0, 2]\n    mm_1: [0, 3]\n    mm_2: [0, 4]\n    fix_gateway: [1, 2]\n    risk: [2, 2]\n    matching: [3, 2]\n    instrument_master: [2, 3.45]\n    orderbook_db: [3, 3.45]\n    issuer_1: [1.2, 4.9]\n    issuer_2: [2.2, 4.9]\n    issuer_3: [3.2, 4.9]\n    trade_bus: [4.3, 0.6]\n    clearing_feed: [5.3, 0.6]\n    clearing: [6.3, 0.6]\n    md_publisher: [4.3, 2.2]\n    md_vendors: [5.3, 2.2]\n    drop_copy: [4.3, 3.45]\n    surv_bus: [4.3, 4.75]\n    surveillance: [5.3, 4.75]\n  steps:\n    - {from: broker_a, to: fix_gateway, text: \"Brokers send client orders over FIX sessions, one session per member.\"}\n    - {from: mm_1, to: fix_gateway, text: \"Market makers stream two-sided quotes to meet their quoting obligations.\"}\n    - {from: fix_gateway, to: risk, text: \"The gateway checks the session (logon, sequence numbers) and each member's message throttle.\"}\n    - {from: risk, to: instrument_master, text: \"Order validation checks the instrument is tradable, the price band, tick size and lot size from the instrument master. Failed orders are rejected back to the member.\"}\n    - {from: issuer_2, to: instrument_master, text: \"Issuers announce corporate actions (splits, dividends, symbol changes) that change prices and bands.\"}\n    - {from: risk, to: matching, text: \"Accepted orders enter the order book; matching runs price-time priority.\"}\n    - {from: matching, to: orderbook_db, text: \"Order book state is persisted for recovery and audit.\"}\n    - {from: matching, to: trade_bus, text: \"Every matched trade is published on the internal Kafka trade bus.\"}\n    - {from: clearing_feed, to: clearing, text: \"Trades are submitted to the clearing corporation before the 15:30 clearing cut-off.\"}\n    - {from: matching, to: md_publisher, text: \"Prices and depth are broadcast to market data vendors.\"}\n    - {from: matching, to: drop_copy, text: \"Drop copies of every fill go back to members' risk systems.\"}\n    - {from: matching, to: surv_bus, text: \"Every order event (new, filled, partly filled, resting) and every trade goes to surveillance on its own Kafka topic, so surveillance lag never slows clearing.\"}\n", "trade-allocation-direct": "# The same trade allocation system WITHOUT Kafka: front office hands fills straight to the\n# allocation engine's queue. Compare with trade-allocation-kafka.yaml — the differences are one\n# component, the flow lines and the alerts that watch it.\n\nid: trade-allocation-direct\nsystem: Middle-office trade allocation (direct, no Kafka)\ndescription: >\n  Front office calls the allocation engine directly. Without Kafka there is no consumer lag to\n  watch: a slow allocation engine shows up as its own queue, and a stuck partition cannot happen.\n\nclock:\n  start: \"13:30\"\n  cutoff: \"15:00\"\n  cutoff_label: Affirmation cut-off\n\nbusiness:\n  currency: \"₹\"\n  unit: \"Cr\"\n  unit_name: trades\n  avg_notional: 0.6\n  kpis:\n    - {label: \"Unallocated\", at: tam}\n    - {label: \"Not yet affirmed\", at: ctm, cutoff: true}\n\ncomponents:\n  - {id: oms, type: source, role: Front office, name: Order Management (OMS), session: OMS01, rate_per_min: 200}\n  - {id: ems, type: source, role: Front office, name: Execution Desk (EMS), session: EMS01, rate_per_min: 100}\n  - {id: tam, type: service, role: Middle office, name: Allocation Engine, capacity_per_min: 420, instances: 4, uses: [ssi, tam_db]}\n  - {id: ssi, type: ref_data, name: SSI Reference Data, refresh_every_min: 15, stale_after_min: 20}\n  - {id: tam_db, type: database, name: Allocation DB, pool_size: 50, big_table: ALLOCATION_HIST}\n  - {id: ctm, type: external_party, role: Confirmation platform, name: Confirmation Platform (CTM), capacity_per_min: 520}\n  - {id: settle, type: external_party, role: Custodian network, name: Settlement (SWIFT), capacity_per_min: 600}\n\nflow:\n  - oms -> tam\n  - ems -> tam\n  - tam -> ctm -> settle\n\nalerts:\n  - {name: \"Allocation backlog high\", on: tam, metric: backlog, above: 900, severity: P2}\n  - {name: \"Allocation throughput low\", on: tam, metric: out_rate, below: 235, severity: P3}\n  - {name: \"Allocation reject rate high\", on: tam, metric: reject_rate, above: 2, severity: P2}\n  - {name: \"DB connection pool saturated\", on: tam_db, metric: pool_pct, above: 90, severity: P2}\n  - {name: \"SSI data stale\", on: ssi, metric: staleness_min, above: 25, severity: P3}\n  - {name: \"Unmatched confirmations\", on: ctm, metric: backlog, above: 900, severity: P2}\n\ndiagram:\n  groups:\n    - {label: \"Front office\", ids: [oms, ems]}\n    - {label: \"Middle office (our systems)\", ids: [tam, ssi, tam_db]}\n    - {label: \"External parties\", ids: [ctm, settle]}\n  place:\n    oms: [0, 0]\n    ems: [0, 1.15]\n    tam: [1.2, 0.55]\n    ssi: [0.7, 1.95]\n    tam_db: [1.7, 1.95]\n    ctm: [2.5, 0.55]\n    settle: [3.6, 0.55]\n  steps:\n    - {from: oms, to: tam, text: \"Executed block fills from the OMS go straight to the allocation engine's queue.\"}\n    - {from: ems, to: tam, text: \"Execution-desk fills join the same queue.\"}\n    - {from: tam, to: ssi, text: \"For each client account the engine looks up the settlement instructions (SSIs).\"}\n    - {from: tam, to: tam_db, text: \"Blocks and allocations are stored; rejected allocations wait in an exception queue.\"}\n    - {from: tam, to: ctm, text: \"Allocations go to the confirmation platform to be affirmed.\"}\n    - {from: ctm, to: settle, text: \"Affirmed trades generate settlement instructions to custodians.\"}\n", "trade-allocation-kafka": "# Middle-office trade allocation (buy side), with Kafka between front office and the allocation engine.\n# Edit this file (or use the Blueprint tab in the app) to change the system being simulated.\n\nid: trade-allocation-kafka\nsystem: Middle-office trade allocation\ndescription: >\n  Block fills arrive from the OMS and the execution desk (EMS) through a Kafka topic. The\n  allocation engine splits each block across client accounts using SSI reference data, sends\n  allocations to the confirmation platform for affirmation, and on to settlement.\n\nclock:\n  start: \"13:30\"\n  cutoff: \"15:00\"\n  cutoff_label: Affirmation cut-off\n\nbusiness:\n  currency: \"₹\"\n  unit: \"Cr\"\n  unit_name: trades\n  avg_notional: 0.6        # ₹ Cr per trade, used to show impact in money\n  kpis:\n    - {label: \"Unallocated\", at: tam}\n    - {label: \"Not yet affirmed\", at: ctm, cutoff: true}\n\ncomponents:\n  - {id: oms, type: source, role: Front office, name: Order Management (OMS), session: OMS01, rate_per_min: 200}\n  - {id: ems, type: source, role: Front office, name: Execution Desk (EMS), session: EMS01, rate_per_min: 100}\n\n  - id: trades_topic\n    type: kafka_topic\n    name: trades.executed\n    partitions: 6\n    consumer_group: tam-allocator\n\n  - id: tam\n    type: service\n    role: Middle office\n    name: Allocation Engine\n    capacity_per_min: 420\n    instances: 4\n    uses: [ssi, tam_db]\n\n  - {id: ssi, type: ref_data, name: SSI Reference Data, refresh_every_min: 15, stale_after_min: 20}\n  - {id: tam_db, type: database, name: Allocation DB, pool_size: 50, big_table: ALLOCATION_HIST}\n\n  - {id: ctm, type: external_party, role: Confirmation platform, name: Confirmation Platform (CTM), capacity_per_min: 520}\n  - {id: settle, type: external_party, role: Custodian network, name: Settlement (SWIFT), capacity_per_min: 600}\n\nflow:\n  - oms -> trades_topic\n  - ems -> trades_topic\n  - trades_topic -> tam -> ctm -> settle\n\nalerts:\n  - {name: \"Kafka consumer lag high\", on: trades_topic, metric: lag, above: 900, severity: P2}\n  - {name: \"Partition lag high\", on: trades_topic, metric: max_partition_lag, above: 300, severity: P2}\n  - {name: \"Allocation throughput low\", on: tam, metric: out_rate, below: 235, severity: P3}\n  - {name: \"Allocation reject rate high\", on: tam, metric: reject_rate, above: 2, severity: P2}\n  - {name: \"DB connection pool saturated\", on: tam_db, metric: pool_pct, above: 90, severity: P2}\n  - {name: \"SSI data stale\", on: ssi, metric: staleness_min, above: 25, severity: P3}\n  - {name: \"Unmatched confirmations\", on: ctm, metric: backlog, above: 900, severity: P2}\n\ndiagram:\n  notes: >\n    Front office books block trades. Middle office must allocate every block to client accounts and get\n    each allocation affirmed before the affirmation cut-off, or the trades fail to settle on time.\n  groups:\n    - {label: \"Front office\", ids: [oms, ems]}\n    - {label: \"Middle office (our systems)\", ids: [trades_topic, tam, ssi, tam_db]}\n    - {label: \"External parties\", ids: [ctm, settle]}\n  place:\n    oms: [0, 0]\n    ems: [0, 1.15]\n    trades_topic: [1.1, 0.55]\n    tam: [2.2, 0.55]\n    ssi: [1.7, 1.95]\n    tam_db: [2.7, 1.95]\n    ctm: [3.4, 0.55]\n    settle: [4.5, 0.55]\n  steps:\n    - {from: oms, to: trades_topic, text: \"Executed block fills from the OMS are published to Kafka.\"}\n    - {from: ems, to: trades_topic, text: \"Algo and program-desk fills arrive from the EMS on the same topic.\"}\n    - {from: trades_topic, to: tam, text: \"The allocation engine consumes fills, one consumer per partition.\"}\n    - {from: tam, to: ssi, text: \"For each client account it looks up the standing settlement instructions (SSIs).\"}\n    - {from: tam, to: tam_db, text: \"Blocks and allocations are stored; rejected allocations wait in an exception queue.\"}\n    - {from: tam, to: ctm, text: \"Allocations go to the confirmation platform to be matched and affirmed by the broker.\"}\n    - {from: ctm, to: settle, text: \"Affirmed trades generate settlement instructions to custodians (SWIFT MT541/543).\"}\n"}, "default_blueprint": "trade-allocation-kafka", "drills": ["id: aml-kyc-ratings-stale\ntitle: High-risk customers look like low-risk ones\nsystems: [fraud-aml]\nlevel: Hard\nsummary: Payments and fraud decisions are normal. AML monitoring is quietly working with missing customer risk ratings.\nbrief: >\n  18:00. The KYC periodic-updation batch re-rated several thousand customers last night. The AML\n  team is asking why a known high-risk account generated no alerts today.\nfaults:\n  - {at: \"18:05\", component: kyc_ratings, fault: feed_failed, params: {last_refresh_minutes_ago: 42}}\nroot_cause: {component: kyc_ratings, fault: feed_failed}\naccepted_fixes: [kyc_ratings.force_refresh, detection.reprocess_rejected]\nrisky_actions: [detection.restart, detection.purge_queue, watchlists.force_refresh]\nhints:\n  - {after_min: 3, text: \"The fraud side is healthy. Which data does AML monitoring need that fraud scoring does not?\"}\n  - {after_min: 6, text: \"Check when the KYC risk ratings last loaded, and what the detection log says about parked events.\"}\ndebrief:\n  what_happened: >\n    The KYC risk rating load failed after last night's re-rating batch. AML scenarios set their\n    thresholds by customer risk category, so events for customers without a current rating were\n    parked instead of monitored, including newly high-risk customers.\n  key_signal: >\n    \"No current KYC risk rating for customer ...\" in the detection log, a growing re-screening queue,\n    and a KYC load that has not succeeded for over 45 minutes, while fraud latency and throughput are normal.\n  why_not_restart: >\n    Restarting detection reloads the same old ratings. Purging the parked events means those\n    transactions are never monitored, which is a regulatory breach. Reloading the watchlists is the\n    wrong data set.\n  runbook:\n    - When AML alerts drop but payments are fine, check the data AML depends on, not just the services.\n    - Check the KYC risk rating load and why it failed.\n    - Reload the ratings with approval, then reprocess the parked events.\n    - Tell the AML team which period was monitored late so alerts can be reviewed.\n    - Problem record - alert on rating freshness and reconcile the re-rating batch with the load.\n", "id: aml-case-backlog\ntitle: AML alerts pile up unreviewed\nsystems: [fraud-aml]\nlevel: Medium\nsummary: Detection is producing alerts normally. Investigators cannot keep up because case management has slowed.\nbrief: >\n  18:00. Month-end. The AML operations team must review every alert within its service level,\n  and anything suspicious feeds the STR filed with FIU-IND.\nfaults:\n  - {at: \"18:06\", component: case_mgmt, fault: instances_lost, params: {remaining: 1}}\nroot_cause: {component: case_mgmt, fault: instances_lost}\naccepted_fixes: [case_mgmt.scale_out]\nrisky_actions: [case_mgmt.purge_queue, case_mgmt.restart, detection.restart]\nhints:\n  - {after_min: 2, text: \"Detection is fine. Where is the backlog building, and how many case management instances are running?\"}\ndebrief:\n  what_happened: >\n    One of the two case management pods was evicted because its node ran out of memory, and could not\n    be rescheduled. With half the capacity, AML alerts queued faster than they could be created as cases.\n  key_signal: Case management backlog alert with 1 of 2 instances ready and a Pending pod.\n  why_not_restart: >\n    Restarting the remaining instance halves capacity again for several minutes. Purging the queue\n    deletes AML alerts that must be reviewed: never acceptable.\n  runbook:\n    - Find where the backlog is building.\n    - Check instances and why a pod is Pending.\n    - Reschedule onto healthy nodes with approval and watch the backlog drain.\n    - Tell AML operations how many alerts were delayed and by how long.\n", "id: aml-ctr-filing-throttled\ntitle: Monthly reports crawl to FIU-IND\nsystems: [fraud-aml]\nlevel: Medium\nsummary: Filing deadline day. Some reports go through, most are refused.\nbrief: >\n  18:00. Today is the deadline for the monthly cash transaction reports to FIU-IND. Every bank is\n  filing at the same time.\nfaults:\n  - {at: \"18:06\", component: fiu, fault: api_rate_limited, params: {quota_per_min: 1500}}\nroot_cause: {component: fiu, fault: api_rate_limited}\naccepted_fixes: [fiu.enable_retry_backoff]\nrisky_actions: [fiu.restart_adapter, case_mgmt.scale_out, fiu.purge_queue]\nhints:\n  - {after_min: 2, text: \"Some filings succeed. What HTTP status do the others get?\"}\n  - {after_min: 4, text: \"What does our adapter do when it is told to slow down? Check its retry policy.\"}\ndebrief:\n  what_happened: >\n    The reporting gateway answered with 429 Too Many Requests during the filing rush. Our adapter\n    retried throttled calls immediately, so most of its quota went on retries and the queue grew.\n  key_signal: 429 with Retry-After in the FIU adapter log and retry-policy immediate in its configuration.\n  why_not_restart: >\n    A restart replays the whole queue at full speed and is throttled harder. Purging the queue means\n    reports are not filed: a compliance breach.\n  runbook:\n    - Tell \"they are down\" (5xx) from \"we are too fast\" (429).\n    - Switch the adapter to exponential back-off with approval.\n    - Track the remaining filings against the deadline and warn the compliance officer early.\n    - Problem record - file earlier in the month and respect Retry-After.\n", "id: aml-case-enrichment-timeouts\ntitle: Cases are created slowly after a quiet change\nsystems: [fraud-aml]\nlevel: Medium\nsummary: Case management is up with all instances, but it processes a fraction of its usual volume.\nbrief: >\n  18:00. The change calendar shows no deployments today. The KYC team moved their customer lookup\n  API to a new load balancer yesterday.\nfaults:\n  - {at: \"18:06\", component: case_mgmt, fault: config_change, params: {api: kyc-lookup-api, timeout_ms: 50}}\nroot_cause: {component: case_mgmt, fault: config_change}\naccepted_fixes: [case_mgmt.revert_config]\nrisky_actions: [case_mgmt.restart, case_mgmt.rollback_deployment, case_mgmt.scale_out]\nhints:\n  - {after_min: 2, text: \"All instances are up. What do the case management errors say?\"}\n  - {after_min: 5, text: \"Where did a 50 ms timeout come from? Look just before the errors started.\"}\ndebrief:\n  what_happened: >\n    While case management enriches each AML alert with customer details, it calls the KYC lookup API.\n    A configuration refresh set that call's timeout to 50 ms, so most lookups timed out and cases\n    were created at a fraction of the normal rate.\n  key_signal: >\n    SocketTimeoutException after 50ms calling kyc-lookup-api, and the config-server refresh line\n    just before. \"No deployment\" is not \"no change\".\n  why_not_restart: >\n    A restart reads the same configuration; rolling back a deployment does nothing because there was\n    none; more instances time out the same way.\n  runbook:\n    - Find the first error and what changed just before it, including configuration.\n    - Compare the running timeout with the known-good value.\n    - Revert the configuration change with approval and confirm cases are created normally.\n", "id: aml-mystery\ntitle: Mystery incident in AML operations\nsystems: [fraud-aml]\nlevel: Hard\nsummary: One of six AML-side faults, chosen at random. No hints.\nmystery: true\nbrief: >\n  18:00, month-end. The AML team reports something is off with alerts or filings today. You do not\n  know what or where.\npool:\n  - faults: [{at: \"18:07\", component: kyc_ratings, fault: feed_failed, params: {last_refresh_minutes_ago: 42}}]\n    root_cause: {component: kyc_ratings, fault: feed_failed}\n    accepted_fixes: [kyc_ratings.force_refresh, detection.reprocess_rejected]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"KYC risk ratings failed to load; events were parked.\", key_signal: \"No current KYC risk rating in the detection log.\"}\n  - faults: [{at: \"18:07\", component: watchlists, fault: feed_failed, params: {last_refresh_minutes_ago: 26}}]\n    root_cause: {component: watchlists, fault: feed_failed}\n    accepted_fixes: [watchlists.force_refresh, detection.reprocess_rejected]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"The sanctions and PEP watchlists failed to load.\", key_signal: \"Watchlists stale; events parked for re-screening.\"}\n  - faults: [{at: \"18:07\", component: case_mgmt, fault: instances_lost, params: {remaining: 1}}]\n    root_cause: {component: case_mgmt, fault: instances_lost}\n    accepted_fixes: [case_mgmt.scale_out]\n    risky_actions: [case_mgmt.purge_queue]\n    debrief: {what_happened: \"Case management lost an instance; alerts piled up.\", key_signal: \"1 of 2 instances; Pending pod.\"}\n  - faults: [{at: \"18:07\", component: fiu, fault: api_rate_limited, params: {quota_per_min: 1500}}]\n    root_cause: {component: fiu, fault: api_rate_limited}\n    accepted_fixes: [fiu.enable_retry_backoff]\n    risky_actions: [fiu.restart_adapter]\n    debrief: {what_happened: \"FIU-IND throttled our immediate retries.\", key_signal: \"429 Too Many Requests; retry-policy immediate.\"}\n  - faults: [{at: \"18:07\", component: fiu, fault: api_auth_expired}]\n    root_cause: {component: fiu, fault: api_auth_expired}\n    accepted_fixes: [fiu.rotate_api_credentials]\n    risky_actions: [fiu.restart_adapter]\n    debrief: {what_happened: \"Our FIU-IND client secret expired.\", key_signal: \"401 Unauthorized, client secret expired.\"}\n  - faults: [{at: \"18:07\", component: case_mgmt, fault: config_change, params: {api: kyc-lookup-api, timeout_ms: 50}}]\n    root_cause: {component: case_mgmt, fault: config_change}\n    accepted_fixes: [case_mgmt.revert_config]\n    risky_actions: [case_mgmt.restart]\n    debrief: {what_happened: \"A config refresh set the KYC lookup timeout to 50 ms.\", key_signal: \"SocketTimeoutException after 50ms.\"}\n", "id: exch-member-cannot-log-in\ntitle: A broker cannot log in\nsystems: [exchange]\nlevel: Easy\nsummary: A member's desk says their orders are not reaching the exchange.\nbrief: >\n  14:30, one hour before the clearing cut-off. You are on the exchange's market operations\n  support desk. Members call you when they cannot trade.\nfaults:\n  - {at: \"14:36\", component: broker_b, fault: session_down}\nroot_cause: {component: broker_b, fault: session_down}\naccepted_fixes: [broker_b.reset_sequence]\nrisky_actions: [fix_gateway.restart]\nhints:\n  - {after_min: 2, text: \"One member's order flow dropped to zero. Which session, and what does the gateway log say about its logon?\"}\n  - {after_min: 6, text: \"A sequence-number mismatch is agreed and reset with the member; it is not fixed by restarting the gateway.\"}\ndebrief:\n  what_happened: >\n    Narmada Capital's FIX engine came back after a restart with an old sequence number. The gateway\n    rejected every logon as \"MsgSeqNum too low\", so their orders queued on their side.\n  key_signal: Member session disconnected alert, zero order flow from one session, and logon-rejected lines in the gateway log.\n  why_not_restart: >\n    Restarting the gateway disconnects all five members and halves capacity, and the broken\n    session still has the wrong sequence number when it comes back.\n  runbook:\n    - Identify the session from the gateway log (session id and member).\n    - Call the member, agree the sequence numbers, and reset them for that session only.\n    - Watch the member's queued orders resend and the gateway queue drain.\n    - Note the incident for the member's monthly connectivity report.\n", "id: exch-noisy-market-maker\ntitle: A market maker floods the gateway\nsystems: [exchange]\nlevel: Medium\nsummary: Every member reports slow order acknowledgements. Nothing in the exchange is down.\nbrief: >\n  14:30. Volatile afternoon. Several brokers call to say order acknowledgements have become slow.\n  The clearing cut-off is 15:30.\nfaults:\n  - {at: \"14:35\", component: mm_1, fault: order_flood, params: {multiplier: 4}}\nroot_cause: {component: mm_1, fault: order_flood}\naccepted_fixes: [mm_1.apply_throttle]\nrisky_actions: [fix_gateway.restart]\nhints:\n  - {after_min: 2, text: \"The gateway is healthy but its queue is growing. Is the inbound rate normal?\"}\n  - {after_min: 6, text: \"Compare each member's message rate with its usual rate. Which session changed?\"}\ndebrief:\n  what_happened: >\n    Arcline Markets deployed a quoting engine with a misconfigured refresh interval and sent about\n    four times its normal message rate. The gateway's capacity was shared by everyone, so every\n    member's orders queued behind the flood.\n  key_signal: Gateway inbound rate above normal, queue growing, and throttle warnings naming one session.\n  why_not_restart: >\n    Restarting or scaling the gateway treats the symptom. The flood resumes as soon as the session\n    reconnects; the member's throttle is the control built for this.\n  runbook:\n    - Find the session above its message limit in the gateway log.\n    - Apply that member's message throttle (approval required) and tell the member why.\n    - Watch the gateway queue drain and acknowledgement times recover.\n    - Ask the member for a root cause before lifting the throttle.\n", "id: exch-corporate-action-missed\ntitle: Orders rejected in one stock\nsystems: [exchange]\nlevel: Medium\nsummary: Members complain that orders in one symbol are rejected for price, even at the last traded price.\nbrief: >\n  14:30. Konark Steel announced a stock split effective today. Trading looks normal overall.\n  The clearing cut-off is 15:30.\nfaults:\n  - {at: \"14:33\", component: issuer_2, fault: announcement_missed}\nroot_cause: {component: issuer_2, fault: announcement_missed}\naccepted_fixes: [issuer_2.reload_announcement, instrument_master.force_refresh]\nrisky_actions: [risk.restart]\nhints:\n  - {after_min: 2, text: \"Rejects are not a capacity problem. Which symbol do the rejected orders have in common?\"}\n  - {after_min: 6, text: \"Check the instrument master's load log. Was every corporate action file applied?\"}\ndebrief:\n  what_happened: >\n    Konark Steel's corporate action file used a new ISIN format and was skipped during the\n    instrument master load. Its price band still reflected the pre-split price, so order validation\n    rejected valid orders in KONSTL.\n  key_signal: Risk reject rate above 2% with normal throughput, all rejects for one symbol, and a skipped file in the instrument master log.\n  why_not_restart: Order validation is working correctly on wrong data. Restarting it changes nothing.\n  runbook:\n    - Group rejected orders by symbol and reject reason.\n    - Check the instrument master load log for skipped corporate action files.\n    - Reprocess the issuer's corporate action (or reload the instrument master) with approval.\n    - Inform members that orders in the symbol can be re-entered.\n", "id: exch-order-book-store\ntitle: Matching slows to a crawl\nsystems: [exchange]\nlevel: Hard\nsummary: Many alerts fire at once across the exchange. Find the one that is the cause.\nbrief: >\n  14:30. Month-end. The surveillance team runs heavy reports in the afternoon. The clearing\n  cut-off is 15:30.\nfaults:\n  - {at: \"14:37\", component: orderbook_db, fault: pool_exhausted}\nnoise:\n  - {at: \"14:39\", name: \"CPU 81% on gw-node-2\", severity: P4}\nroot_cause: {component: orderbook_db, fault: pool_exhausted}\naccepted_fixes: [orderbook_db.kill_blocking_session]\nrisky_actions: [matching.restart, fix_gateway.restart]\nhints:\n  - {after_min: 2, text: \"Matching throughput fell, but matching has all its instances. What does matching depend on?\"}\n  - {after_min: 6, text: \"Look at the Order Book Store's connections and who is holding them.\"}\ndebrief:\n  what_happened: >\n    A month-end surveillance report ran a full table scan on ORDER_HIST and held 76 of 80 order\n    book store connections. Matching waited for connections and processed a fifth of its normal volume.\n  key_signal: Order book store pool at 100% and connection timeouts in the matching engine log.\n  why_not_restart: >\n    Restarting matching during trading is a market-wide event, and it would come back to the same\n    exhausted pool. Free the connections first.\n  runbook:\n    - Check the pool and the longest-running sessions on the order book store.\n    - Kill the blocking report session with approval and inform its owner.\n    - Watch matching throughput and the clearing projection recover.\n    - Raise a problem: move reports to a replica.\n", "id: exch-clearing-down\ntitle: Trades not reaching clearing\nsystems: [exchange]\nlevel: Medium\nsummary: Trading is normal, but trades are not being accepted by the clearing corporation.\nbrief: >\n  14:30. Normal trading. Every trade must reach the clearing corporation before the 15:30\n  clearing cut-off.\nfaults:\n  - {at: \"14:40\", component: clearing, fault: unavailable}\nnoise:\n  - {at: \"14:43\", name: \"Disk usage 83% on md-node-1\", severity: P4}\nroot_cause: {component: clearing, fault: unavailable}\naccepted_fixes: [clearing.escalate_to_vendor]\nrisky_actions: [clearing_feed.restart, clearing.restart_adapter, matching.restart]\nhints:\n  - {after_min: 2, text: \"Follow the flow left to right. Where does the queue start?\"}\n  - {after_min: 6, text: \"Is the failure in our clearing adapter, or at the clearing corporation?\"}\ndebrief:\n  what_happened: >\n    The clearing corporation's trade submission API returned HTTP 503. Trading carried on, so the\n    exchange looked healthy while unsubmitted trades piled up against the clearing cut-off.\n  key_signal: Clearing backlog growing with 100% failed calls, while gateway, risk and matching stay green.\n  why_not_restart: >\n    The fault is outside the exchange. Restarting our adapter adds a second outage. The fix is a fast\n    escalation and a clear plan for the cut-off.\n  runbook:\n    - Confirm the errors come from the clearing corporation (HTTP 5xx), not our adapter.\n    - Raise a P1 with the clearing corporation and record the reference.\n    - Agree a cut-off extension if recovery is late.\n    - Monitor the backlog until every trade is submitted.\n", "id: exch-trade-bus-stuck\ntitle: Some trades never reach clearing\nsystems: [exchange]\nlevel: Hard\nsummary: Clearing receives trades, but a slice of them is missing. Total throughput looks almost normal.\nbrief: >\n  14:30. A new release of the matching engine went live this morning. The clearing cut-off is 15:30.\nfaults:\n  - {at: \"14:35\", component: trade_bus, fault: poison_message, params: {partition: 5}}\nroot_cause: {component: trade_bus, fault: poison_message}\naccepted_fixes: [trade_bus.skip_poison_message]\nrisky_actions: [clearing_feed.restart, matching.restart]\nhints:\n  - {after_min: 3, text: \"Throughput to clearing dropped by only one-eighth. Is the trade bus lag even across partitions?\"}\n  - {after_min: 8, text: \"The clearing feed adapter's log repeats the same offset.\"}\ndebrief:\n  what_happened: >\n    The new matching release published one trade with a field the clearing feed adapter could not\n    read. The adapter retried it forever, blocking partition 5 while the other seven kept flowing.\n  key_signal: Lag growing on a single trade bus partition and a repeating offset in the adapter log.\n  why_not_restart: Restarting the adapter re-reads the same message and gets stuck again.\n  runbook:\n    - Compare lag per partition, not just total lag.\n    - Find the offset in the adapter's error log.\n    - Park the message to the dead-letter topic with approval; repair and submit that trade manually.\n    - Raise a problem for schema compatibility checks in the release process.\n", "id: exch-mystery\ntitle: Mystery incident on the exchange\nsystems: [exchange]\nlevel: Hard\nsummary: One of ten real faults, chosen at random. No hints, no clues in the title.\nmystery: true\nbrief: >\n  14:30. Something will go wrong before the 15:30 clearing cut-off. You do not know what or where.\nnoise:\n  - {at: \"14:41\", name: \"Disk usage 83% on md-node-1\", severity: P4}\npool:\n  - faults: [{at: \"14:38\", component: broker_c, fault: session_down}]\n    root_cause: {component: broker_c, fault: session_down}\n    accepted_fixes: [broker_c.reset_sequence]\n    risky_actions: [fix_gateway.restart]\n    debrief: {what_happened: \"Bluewater Broking's session was rejected on a sequence number mismatch.\", key_signal: \"Member session disconnected; logon rejected in the gateway log.\"}\n  - faults: [{at: \"14:38\", component: mm_2, fault: order_flood, params: {multiplier: 4}}]\n    root_cause: {component: mm_2, fault: order_flood}\n    accepted_fixes: [mm_2.apply_throttle]\n    risky_actions: [fix_gateway.restart]\n    debrief: {what_happened: \"Delta Quotes flooded the gateway.\", key_signal: \"Gateway inbound rate high; throttle warnings for one session.\"}\n  - faults: [{at: \"14:38\", component: issuer_1, fault: announcement_missed}]\n    root_cause: {component: issuer_1, fault: announcement_missed}\n    accepted_fixes: [issuer_1.reload_announcement, instrument_master.force_refresh]\n    risky_actions: [risk.restart]\n    debrief: {what_happened: \"Mahanadi Power's corporate action was skipped; orders in MAHPWR were rejected.\", key_signal: \"Risk rejects for one symbol; skipped file in the instrument master log.\"}\n  - faults: [{at: \"14:38\", component: orderbook_db, fault: pool_exhausted}]\n    root_cause: {component: orderbook_db, fault: pool_exhausted}\n    accepted_fixes: [orderbook_db.kill_blocking_session]\n    risky_actions: [matching.restart]\n    debrief: {what_happened: \"A report held the order book store's connections.\", key_signal: \"Pool at 100%, timeouts in matching.\"}\n  - faults: [{at: \"14:38\", component: clearing, fault: unavailable}]\n    root_cause: {component: clearing, fault: unavailable}\n    accepted_fixes: [clearing.escalate_to_vendor]\n    risky_actions: [clearing_feed.restart, clearing.restart_adapter]\n    debrief: {what_happened: \"The clearing corporation was down.\", key_signal: \"Clearing backlog with 100% failed calls; exchange green.\"}\n  - faults: [{at: \"14:38\", component: trade_bus, fault: poison_message, params: {partition: 2}}]\n    root_cause: {component: trade_bus, fault: poison_message}\n    accepted_fixes: [trade_bus.skip_poison_message]\n    risky_actions: [clearing_feed.restart]\n    debrief: {what_happened: \"A poison message blocked one trade bus partition.\", key_signal: \"Lag on one partition; repeating offset.\"}\n  - faults: [{at: \"14:38\", component: orderbook_db, fault: disk_full}]\n    root_cause: {component: orderbook_db, fault: disk_full}\n    accepted_fixes: [orderbook_db.clear_disk_space]\n    risky_actions: [matching.restart]\n    debrief: {what_happened: \"The order book store's archive destination filled up and every commit hung.\", key_signal: \"ORA-00257 in matching; /u01/arch at 100%.\"}\n  - faults: [{at: \"14:38\", component: fix_gateway, fault: clock_skew}]\n    root_cause: {component: fix_gateway, fault: clock_skew}\n    accepted_fixes: [fix_gateway.resync_ntp]\n    risky_actions: [fix_gateway.restart]\n    debrief: {what_happened: \"The gateway host clock drifted and every member was rejected.\", key_signal: \"SendingTime accuracy problem for all sessions.\"}\n  - faults: [{at: \"14:38\", component: clearing, fault: cert_expired}]\n    root_cause: {component: clearing, fault: cert_expired}\n    accepted_fixes: [clearing.renew_certificate]\n    risky_actions: [clearing.restart_adapter]\n    debrief: {what_happened: \"Our TLS client certificate for clearing expired.\", key_signal: \"SSLHandshakeException: certificate expired.\"}\n  - faults: [{at: \"14:38\", component: risk, fault: config_change}]\n    root_cause: {component: risk, fault: config_change}\n    accepted_fixes: [risk.revert_config]\n    risky_actions: [risk.restart]\n    debrief: {what_happened: \"A config refresh set the limits API timeout to 50 ms.\", key_signal: \"SocketTimeoutException after 50ms; config refresh just before.\"}\n", "id: exch-archive-disk-full\ntitle: Matching stops committing trades\nsystems: [exchange]\nlevel: Hard\nsummary: The matching engine is up but almost nothing comes out of it. The cause is two layers down.\nbrief: >\n  14:30. A busy afternoon after a results announcement. The clearing cut-off is 15:30.\n  The matching engine shows all instances running.\nfaults:\n  - {at: \"14:37\", component: orderbook_db, fault: disk_full}\nnoise:\n  - {at: \"14:40\", name: \"CPU 79% on md-node-2\", severity: P4}\nroot_cause: {component: orderbook_db, fault: disk_full}\naccepted_fixes: [orderbook_db.clear_disk_space]\nrisky_actions: [matching.restart, orderbook_db.failover_to_dr, orderbook_db.kill_blocking_session]\nhints:\n  - {after_min: 2, text: \"Matching has all its instances, yet its throughput collapsed. What does matching depend on?\"}\n  - {after_min: 5, text: \"Read the matching log for the database error code, then check the order book store host.\"}\ndebrief:\n  what_happened: >\n    The order book store's archive log destination (/u01/arch) filled up. Oracle cannot switch redo\n    logs until the archiver can write, so every commit hung (ORA-00257). Matching looked healthy but\n    could not save trades, and the connection pool filled with sessions waiting on\n    \"log file switch (archiving needed)\".\n  key_signal: >\n    ORA-00257 in the matching log, sessions waiting on \"log file switch (archiving needed)\", and\n    /u01/arch at 100% on the database host. The pool alert is a symptom, not the cause: there is\n    no blocking session to kill.\n  why_not_restart: >\n    Restarting matching drops every member's order flow and comes back to the same stuck database.\n    Failing over to DR takes the order book store away for five minutes during trading when\n    archiving space is all it needs.\n  runbook:\n    - Read the application error, not just the alert. ORA-00257 means the archiver is stuck.\n    - Check v$session wait events and df -h on the database host.\n    - Clear or move old archive logs (after confirming they are backed up), with approval.\n    - Watch matching throughput and the clearing projection recover.\n    - Problem record - archive destination monitoring and the RMAN backup-and-delete schedule.\n", "id: exch-everyone-disconnected\ntitle: Every member is disconnected\nsystems: [exchange]\nlevel: Medium\nsummary: All brokers and market makers lose their sessions at once. The members are not the problem.\nbrief: >\n  14:30. The infrastructure team patched some hosts overnight. The clearing cut-off is 15:30.\nfaults:\n  - {at: \"14:36\", component: fix_gateway, fault: clock_skew}\nroot_cause: {component: fix_gateway, fault: clock_skew}\naccepted_fixes: [fix_gateway.resync_ntp]\nrisky_actions: [fix_gateway.restart, broker_a.reset_sequence, fix_gateway.restart_host]\nhints:\n  - {after_min: 2, text: \"When every member fails at the same moment, look at what they all have in common.\"}\n  - {after_min: 5, text: \"Read the gateway's logon reject reason. Is it sequence numbers this time?\"}\ndebrief:\n  what_happened: >\n    NTP stopped on the gateway host after the overnight patching and its clock drifted 94 seconds\n    ahead. FIX checks SendingTime on every logon, so the gateway rejected every member with\n    \"SendingTime accuracy problem\".\n  key_signal: >\n    All five sessions down at once, and the reject reason is SendingTime, not MsgSeqNum.\n    chronyc tracking on the gateway host shows it is not synchronised.\n  why_not_restart: >\n    Restarting the gateway or resetting sequence numbers does not move the clock. Rebooting the\n    host fixes it eventually but takes the whole exchange's order entry away for four minutes.\n  runbook:\n    - Many members failing together points at the shared component, not the members.\n    - Read the logon reject reason in the gateway log or the sessions table.\n    - Check the host clock (date, chronyc tracking) against a reference.\n    - Resync NTP with approval and watch members log back on and drain their queues.\n    - Problem record - NTP monitoring after patching.\n", "id: exch-clearing-handshake\ntitle: Clearing stops accepting trades again\nsystems: [exchange]\nlevel: Medium\nsummary: Looks exactly like the clearing corporation being down. It is not.\nbrief: >\n  14:30. Midnight was the start of a new certificate cycle for several internal services.\n  The clearing cut-off is 15:30.\nfaults:\n  - {at: \"14:38\", component: clearing, fault: cert_expired}\nroot_cause: {component: clearing, fault: cert_expired}\naccepted_fixes: [clearing.renew_certificate]\nrisky_actions: [clearing.restart_adapter, clearing_feed.restart, clearing.failover_to_dr]\nhints:\n  - {after_min: 2, text: \"Is the clearing corporation really down? What exactly does our adapter log?\"}\n  - {after_min: 5, text: \"Check the TLS side of our adapter: openssl on the clearing adapter host.\"}\ndebrief:\n  what_happened: >\n    Our adapter's TLS client certificate for the clearing link expired at 23:59 yesterday. The\n    clearing corporation was fine; it refused our handshakes.\n  key_signal: >\n    SSLHandshakeException with \"certificate expired\" in the adapter log, and an openssl notAfter\n    date in the past. Escalating to clearing gets \"no issues on our side\".\n  why_not_restart: >\n    Restarting the adapter or failing over reloads the same expired certificate. Escalating to the\n    clearing corporation spends time while trades pile up.\n  runbook:\n    - Read the adapter error before escalating. A handshake failure is usually our side.\n    - Check the certificate expiry on the adapter host.\n    - Install the renewed certificate with approval and confirm the handshake.\n    - Problem record - certificate expiry monitoring 30 days ahead.\n", "id: exch-risk-timeouts\ntitle: Orders slow down in order validation\nsystems: [exchange]\nlevel: Medium\nsummary: Order validation is timing out. No deployment happened today.\nbrief: >\n  14:30. The change calendar shows no deployments today. The clearing cut-off is 15:30.\nfaults:\n  - {at: \"14:36\", component: risk, fault: config_change, params: {api: instrument-api, timeout_ms: 50}}\nroot_cause: {component: risk, fault: config_change}\naccepted_fixes: [risk.revert_config]\nrisky_actions: [risk.restart, fix_gateway.restart, risk.rollback_deployment]\nhints:\n  - {after_min: 2, text: \"Order validation has all its instances but processes far less. What do its errors say?\"}\n  - {after_min: 5, text: \"A 50 ms timeout is unusual. Where did that number come from? Check the configuration.\"}\ndebrief:\n  what_happened: >\n    An automated configuration refresh set the HTTP read timeout for the instrument API to 50 ms\n    instead of 2000 ms. Most band and tick-size lookups timed out, were retried three times and\n    failed, so order validation processed a fraction of its normal volume.\n  key_signal: >\n    SocketTimeoutException after 50ms calling instrument-api in the order validation log, and the config-server\n    refresh line just before the errors started. \"No deployment\" does not mean \"no change\".\n  why_not_restart: >\n    A restart reads the same configuration. Rolling back the deployment does nothing because the\n    change was configuration, not code.\n  runbook:\n    - Find the first error and what changed just before it, including configuration.\n    - Compare the running configuration with the known-good value.\n    - Revert the configuration change with approval and watch the timeouts stop.\n    - Problem record - config-server changes go through change control.\n", "id: fraud-decision-latency\ntitle: Payments slow down across every channel\nsystems: [fraud-aml]\nlevel: Medium\nsummary: Fraud decisions breach the SLA for UPI, cards and core banking at once.\nbrief: >\n  18:00, start of the evening UPI peak. The analytics team said they would run a month-end\n  customer behaviour report today. Payment channels must get a fraud decision within the SLA.\nfaults:\n  - {at: \"18:06\", component: customer_db, fault: pool_exhausted}\nnoise:\n  - {at: \"18:09\", name: \"CPU 78% on case-mgmt-node-2\", severity: P4}\nroot_cause: {component: customer_db, fault: pool_exhausted}\naccepted_fixes: [customer_db.kill_blocking_session]\nrisky_actions: [detection.restart, ingest_gw.restart, events_topic.purge_queue]\nhints:\n  - {after_min: 2, text: \"The detection engine has all its instances. What does it wait on for every transaction?\"}\n  - {after_min: 5, text: \"Look at who holds the customer profile store's connections.\"}\ndebrief:\n  what_happened: >\n    A month-end analytics report ran a full scan on CUSTOMER_TXN_HIST and held almost every\n    connection to the customer profile store. The detection engine waits for a profile lookup on every\n    transaction, so decisions slowed down on every channel and the Kafka backlog grew.\n  key_signal: >\n    Decision latency above the SLA together with the profile store pool at 100% and connection\n    timeouts in the detection log. One shared dependency, every channel affected.\n  why_not_restart: >\n    Restarting detection drops in-flight decisions and comes back to the same exhausted pool. Purging\n    the topic would mean transactions were never screened, a regulatory problem.\n  runbook:\n    - Check what detection depends on before touching detection itself.\n    - Find the session holding the profile store's connections.\n    - Kill it with approval and tell the report owner.\n    - Watch latency return under the SLA and the backlog drain.\n    - Problem record - run analytics on a replica, never on the real-time store.\n", "id: fraud-watchlists-stale\ntitle: Sanctions screening on yesterday's list\nsystems: [fraud-aml]\nlevel: Hard\nsummary: Payments flow normally. The quiet problem is what they are being screened against.\nbrief: >\n  18:00. A new sanctions designation was published this afternoon and compliance expects it to be\n  live in screening. Everything looks green.\nfaults:\n  - {at: \"18:05\", component: watchlists, fault: feed_failed, params: {last_refre
