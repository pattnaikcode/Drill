sh_minutes_ago: 26}}\nroot_cause: {component: watchlists, fault: feed_failed}\naccepted_fixes: [watchlists.force_refresh, detection.reprocess_rejected]\nrisky_actions: [detection.restart, detection.purge_queue]\nhints:\n  - {after_min: 2, text: \"Payments are fine. When did the watchlists last load successfully?\"}\n  - {after_min: 5, text: \"Look at the watchlist load log and the events parked for re-screening.\"}\ndebrief:\n  what_happened: >\n    The sanctions and PEP watchlist feed failed to load (the vendor's SFTP refused connections), so\n    screening ran against an old list and events needing a fresh check were parked for re-screening.\n  key_signal: >\n    \"Watchlists stale\" and a growing re-screening queue, while throughput and latency look normal.\n    Nothing is down; the data is out of date.\n  why_not_restart: >\n    Restarting detection reloads the same old list. Purging the parked events means they are never\n    screened against the new designation.\n  runbook:\n    - Check when the watchlists last loaded, not just whether services are up.\n    - Re-run the load from the secondary source with approval.\n    - Re-screen the parked events against the fresh list.\n    - Tell compliance the window during which screening used the old list.\n    - Problem record - alert on watchlist freshness well before it goes stale.\n", "id: fraud-upi-feed-down\ntitle: UPI transactions stop reaching fraud screening\nsystems: [fraud-aml]\nlevel: Easy\nsummary: Card and core banking events flow. UPI has gone quiet.\nbrief: >\n  18:00. The UPI switch team patched their connector to the platform this afternoon.\nfaults:\n  - {at: \"18:06\", component: upi_switch, fault: session_down}\nroot_cause: {component: upi_switch, fault: session_down}\naccepted_fixes: [upi_switch.reset_sequence]\nrisky_actions: [ingest_gw.restart, upi_switch.disconnect_participant]\nhints:\n  - {after_min: 2, text: \"Only one channel stopped. What does the ingestion gateway say about that channel's logon?\"}\ndebrief:\n  what_happened: >\n    After the patch, the UPI switch reconnected with a sequence number lower than the gateway\n    expected, and its logon was rejected. UPI events queued on the switch side.\n  key_signal: One channel's events dropped to zero; logon rejected for UPI01 in the gateway log.\n  why_not_restart: Restarting the gateway disconnects the card switch and core banking too, and UPI still fails.\n  runbook:\n    - Identify which channel stopped and read the logon reject reason.\n    - Reset sequence numbers with the UPI switch team, with approval.\n    - Confirm the queued UPI events are screened.\n", "id: fraud-detection-crashloop\ntitle: Detection engine keeps restarting\nsystems: [fraud-aml]\nlevel: Medium\nsummary: Festival sale traffic. Fraud decisions come in bursts and then stop.\nbrief: >\n  18:00. A festival sale has pushed UPI and card volumes well above normal since the afternoon.\nfaults:\n  - {at: \"18:06\", component: detection, fault: memory_oom}\nroot_cause: {component: detection, fault: memory_oom}\naccepted_fixes: [detection.increase_memory_limit]\nrisky_actions: [detection.restart, detection.scale_out, events_topic.purge_queue]\nhints:\n  - {after_min: 2, text: \"Throughput goes up and down in a regular pattern. What is happening to the pods?\"}\n  - {after_min: 5, text: \"kubectl describe pod shows why the container last stopped.\"}\ndebrief:\n  what_happened: >\n    Larger customer profiles cached during the sale pushed the detection engine past its memory limit.\n    It was OOMKilled, restarted, and died again: a crash loop.\n  key_signal: CrashLoopBackOff, OOMKilled with exit code 137, and Java heap errors in the log.\n  why_not_restart: More restarts or more pods with the same limit fail the same way. Purging loses unscreened transactions.\n  runbook:\n    - A regular up-and-down pattern means something is restarting; check pod status.\n    - Read the termination reason.\n    - Raise the memory limit with approval and confirm the pods stay up.\n    - Problem record - capacity test for festival peaks.\n", "id: fraud-card-format-change\ntitle: Some transactions never get scored\nsystems: [fraud-aml]\nlevel: Medium\nsummary: Most events flow, but one slice of transactions is stuck and the backlog keeps growing.\nbrief: >\n  18:00. The card switch rolled out a new message format with an extra field this afternoon.\nfaults:\n  - {at: \"18:06\", component: events_topic, fault: poison_message, params: {partition: 3}}\nroot_cause: {component: events_topic, fault: poison_message}\naccepted_fixes: [events_topic.skip_poison_message]\nrisky_actions: [detection.restart, events_topic.purge_queue]\nhints:\n  - {after_min: 2, text: \"Is the lag on all partitions or one? Is the same offset failing again and again?\"}\ndebrief:\n  what_happened: >\n    One event in the new card format could not be read by the detection engine, which retried it\n    forever. Every event behind it on partition 3 waited unscreened.\n  key_signal: Lag on one partition only and the same offset repeating in the detection errors.\n  why_not_restart: The restarted consumer reads the same event again. Purging deletes every transaction behind it.\n  runbook:\n    - Find the stuck partition and offset.\n    - Park the event to the dead-letter topic with approval and let the backlog drain.\n    - Raise the format change with the card switch team and get it fixed before more arrive.\n", "id: fraud-fiu-unauthorised\ntitle: Reports to FIU-IND are failing\nsystems: [fraud-aml]\nlevel: Easy\nsummary: Payments and screening are fine. Regulatory filing is not.\nbrief: >\n  18:00. Today is the deadline for this month's reports to FIU-IND.\nfaults:\n  - {at: \"18:06\", component: fiu, fault: api_auth_expired}\nroot_cause: {component: fiu, fault: api_auth_expired}\naccepted_fixes: [fiu.rotate_api_credentials]\nrisky_actions: [fiu.restart_adapter, case_mgmt.restart]\nhints:\n  - {after_min: 2, text: \"Read the exact HTTP status in the reporting log.\"}\ndebrief:\n  what_happened: The client secret used to file reports with FIU-IND expired at midnight; every call came back 401.\n  key_signal: 401 Unauthorized with \"client secret expired\" in the FIU adapter log, while everything else is green.\n  why_not_restart: The adapter reloads the same expired secret. Case management was never the problem.\n  runbook:\n    - Severity comes from business impact: payments are fine, but a regulatory deadline is at risk.\n    - Rotate the client secret from the vault with approval.\n    - Confirm the queued reports are filed before the deadline.\n    - Problem record - alert on credential expiry dates.\n", "id: fraud-mystery\ntitle: Mystery incident on the fraud platform\nsystems: [fraud-aml]\nlevel: Hard\nsummary: One of six real faults, chosen at random. No hints.\nmystery: true\nbrief: >\n  18:00, evening UPI peak. Something will go wrong before 19:00. You do not know what or where.\nnoise:\n  - {at: \"18:10\", name: \"Disk usage 81% on report-01\", severity: P4}\npool:\n  - faults: [{at: \"18:07\", component: customer_db, fault: pool_exhausted}]\n    root_cause: {component: customer_db, fault: pool_exhausted}\n    accepted_fixes: [customer_db.kill_blocking_session]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"A report held the profile store's connections.\", key_signal: \"Pool at 100%; decision latency above SLA.\"}\n  - faults: [{at: \"18:07\", component: upi_switch, fault: session_down}]\n    root_cause: {component: upi_switch, fault: session_down}\n    accepted_fixes: [upi_switch.reset_sequence]\n    risky_actions: [ingest_gw.restart]\n    debrief: {what_happened: \"UPI's logon was rejected on a sequence number mismatch.\", key_signal: \"One channel at zero; logon rejected.\"}\n  - faults: [{at: \"18:07\", component: detection, fault: memory_oom}]\n    root_cause: {component: detection, fault: memory_oom}\n    accepted_fixes: [detection.increase_memory_limit]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"Detection ran out of memory and crash-looped.\", key_signal: \"OOMKilled, exit 137.\"}\n  - faults: [{at: \"18:07\", component: events_topic, fault: poison_message, params: {partition: 5}}]\n    root_cause: {component: events_topic, fault: poison_message}\n    accepted_fixes: [events_topic.skip_poison_message]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"One unreadable event blocked a partition.\", key_signal: \"Lag on one partition; repeating offset.\"}\n  - faults: [{at: \"18:07\", component: customer_db, fault: disk_full}]\n    root_cause: {component: customer_db, fault: disk_full}\n    accepted_fixes: [customer_db.clear_disk_space]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"The profile store's archive destination filled up and every commit hung.\", key_signal: \"ORA-00257 in detection; archive disk at 100%.\"}\n  - faults: [{at: \"18:07\", component: detection, fault: config_change}]\n    root_cause: {component: detection, fault: config_change}\n    accepted_fixes: [detection.revert_config]\n    risky_actions: [detection.restart]\n    debrief: {what_happened: \"A config refresh set an API timeout to 50 ms.\", key_signal: \"SocketTimeoutException after 50ms; config refresh just before.\"}\n", "id: shop-flash-sale-prices\ntitle: Flash sale items fail at checkout\nsystems: [online-shop]\nlevel: Medium\nsummary: The sale went live at 15:00. Some customers get an error at checkout; most orders go through.\nbrief: >\n  15:00. A flash sale with new prices on 2,000 products has just started. Marketing reports\n  customers posting screenshots of checkout errors.\nfaults:\n  - {at: \"15:05\", component: catalog, fault: feed_failed, params: {last_refresh_minutes_ago: 26}}\nroot_cause: {component: catalog, fault: feed_failed}\naccepted_fixes: [catalog.force_refresh]\nrisky_actions: [checkout.restart, api_gw.restart, checkout.scale_out]\nhints:\n  - {after_min: 2, text: \"Checkout is fast and has all its instances. Why does it reject some carts?\"}\n  - {after_min: 4, text: \"When did the product catalogue last load?\"}\ndebrief:\n  what_happened: >\n    The catalogue load with the flash sale prices failed (the feed's SFTP refused connections), so\n    checkout had no current price for the sale items and rejected those carts.\n  key_signal: >\n    \"No current price for SKU ...\" in the checkout log, checkout failures above 2%, and a catalogue\n    load that failed. Capacity and latency are normal.\n  why_not_restart: Restarting or scaling checkout keeps the same stale catalogue. The data is the problem, not the service.\n  runbook:\n    - When failures are partial and capacity is fine, look at the data being used.\n    - Check the catalogue load log.\n    - Re-run the load from the secondary source with approval.\n    - Tell marketing which window was affected; customers who saw errors may need a coupon.\n", "id: shop-inventory-pool\ntitle: Checkout slows down for everyone\nsystems: [online-shop]\nlevel: Medium\nsummary: Every customer on every channel waits at checkout.\nbrief: >\n  15:00. The warehouse team is running its quarterly stock reconciliation report today.\nfaults:\n  - {at: \"15:06\", component: inventory_db, fault: pool_exhausted}\nroot_cause: {component: inventory_db, fault: pool_exhausted}\naccepted_fixes: [inventory_db.kill_blocking_session]\nrisky_actions: [checkout.restart, checkout.scale_out, inventory_db.increase_pool_size]\nhints:\n  - {after_min: 2, text: \"Checkout has all its instances. What does it wait on for every order?\"}\n  - {after_min: 5, text: \"Who is holding the inventory database's connections?\"}\ndebrief:\n  what_happened: >\n    The stock reconciliation report ran a full scan on STOCK_MOVEMENTS and held almost every inventory\n    database connection. Checkout reserves stock on every order, so it waited for connections.\n  key_signal: Inventory DB pool at 100%, connection timeouts in the checkout log, and one long-running session.\n  why_not_restart: >\n    Restarting or adding checkout instances adds more waiters for the same exhausted pool. A bigger\n    pool fills up too while the report keeps running.\n  runbook:\n    - Check what checkout depends on.\n    - Find the session holding the connections and kill it with approval.\n    - Move reporting to a read replica.\n", "id: shop-payment-gateway-down\ntitle: Customers cannot pay\nsystems: [online-shop]\nlevel: Easy\nsummary: Carts reach payment, then fail. Everything on our side looks healthy.\nbrief: >\n  15:00. Peak afternoon traffic.\nfaults:\n  - {at: \"15:06\", component: payment_gw, fault: unavailable}\nroot_cause: {component: payment_gw, fault: unavailable}\naccepted_fixes: [payment_gw.escalate_to_vendor]\nrisky_actions: [payment_gw.restart_adapter, checkout.restart, payment_gw.purge_queue]\nhints:\n  - {after_min: 2, text: \"Read the exact HTTP status the payment gateway returns.\"}\ndebrief:\n  what_happened: The payment gateway provider had an outage; every call returned 503 Service Unavailable.\n  key_signal: 503 from the payment gateway with every internal service green.\n  why_not_restart: >\n    Restarting our adapter or checkout cannot fix the provider. Purging the queue drops orders\n    customers already submitted.\n  runbook:\n    - Confirm the failure is on the provider's side (503, their status page).\n    - Raise a P1 with the provider and post a status message for customers.\n    - If the business has a second gateway, discuss switching over with the business owner.\n", "id: shop-courier-unauthorised\ntitle: Paid orders are not getting shipped\nsystems: [online-shop]\nlevel: Easy\nsummary: Orders and payments are fine. Shipments are not being booked before the dispatch cut-off.\nbrief: >\n  15:00. The delivery partner emailed last month about rotating API credentials.\nfaults:\n  - {at: \"15:06\", component: courier, fault: api_auth_expired}\nroot_cause: {component: courier, fault: api_auth_expired}\naccepted_fixes: [courier.rotate_api_credentials]\nrisky_actions: [courier.restart_adapter, wms.restart]\nhints:\n  - {after_min: 2, text: \"What HTTP status does the delivery partner's API return?\"}\ndebrief:\n  what_happened: Our client secret for the delivery partner's API expired at midnight; every booking came back 401.\n  key_signal: 401 Unauthorized with \"client secret expired\" in the delivery adapter log; warehouse healthy.\n  why_not_restart: The adapter reloads the same expired secret.\n  runbook:\n    - Read the status code: 401 is our credentials, not their outage.\n    - Rotate the client secret from the vault with approval.\n    - Confirm the backlog of shipments is booked before the dispatch cut-off.\n", "id: shop-checkout-crashloop\ntitle: Checkout keeps falling over during the sale\nsystems: [online-shop]\nlevel: Medium\nsummary: Festival sale traffic. Checkout works for a minute, then stops, then works again.\nbrief: >\n  15:00. A big festival sale is running and traffic is three times a normal day.\nfaults:\n  - {at: \"15:06\", component: checkout, fault: memory_oom}\nroot_cause: {component: checkout, fault: memory_oom}\naccepted_fixes: [checkout.increase_memory_limit]\nrisky_actions: [checkout.restart, checkout.scale_out]\nhints:\n  - {after_min: 2, text: \"A regular up-and-down pattern means something keeps restarting. Check the pods.\"}\ndebrief:\n  what_happened: Larger carts during the sale pushed checkout past its memory limit; it was OOMKilled and crash-looped.\n  key_signal: CrashLoopBackOff and OOMKilled (exit 137) in kubectl; Java heap errors in the log.\n  why_not_restart: More restarts or pods with the same limit die the same way.\n  runbook:\n    - Check pod status and the last termination reason.\n    - Raise the memory limit with approval and confirm the pods stay up.\n    - Problem record - load-test checkout at sale volumes before the sale.\n", "id: shop-app-release-poison\ntitle: Some paid orders never reach the warehouse\nsystems: [online-shop]\nlevel: Medium\nsummary: Since this afternoon's app release, a slice of paid orders is stuck before fulfilment.\nbrief: >\n  15:00. A new Android app version with gift-wrap options was released at 14:30.\nfaults:\n  - {at: \"15:06\", component: orders_topic, fault: poison_message, params: {partition: 2}}\nroot_cause: {component: orders_topic, fault: poison_message}\naccepted_fixes: [orders_topic.skip_poison_message]\nrisky_actions: [fulfilment.restart, orders_topic.purge_queue]\nhints:\n  - {after_min: 2, text: \"Is the lag on every partition or one? Is the same offset failing repeatedly?\"}\ndebrief:\n  what_happened: >\n    An order from the new app version carried a field fulfilment could not read. Fulfilment retried\n    it forever, and every paid order behind it on partition 2 waited.\n  key_signal: Lag on one partition only and the same offset repeating in the fulfilment errors.\n  why_not_restart: The restarted consumer reads the same order again. Purging deletes paid orders.\n  runbook:\n    - Find the stuck partition and offset.\n    - Park the order to the dead-letter topic with approval and let the backlog drain.\n    - Fix that one order by hand and get the app team to handle the new field.\n", "id: shop-mystery\ntitle: Mystery incident on the shopping platform\nsystems: [online-shop]\nlevel: Hard\nsummary: One of six real faults, chosen at random. No hints.\nmystery: true\nbrief: >\n  15:00, peak afternoon. Something will go wrong before the 16:00 dispatch cut-off.\nnoise:\n  - {at: \"15:10\", name: \"Disk usage 82% on search-node-3\", severity: P4}\npool:\n  - faults: [{at: \"15:07\", component: catalog, fault: feed_failed, params: {last_refresh_minutes_ago: 26}}]\n    root_cause: {component: catalog, fault: feed_failed}\n    accepted_fixes: [catalog.force_refresh]\n    risky_actions: [checkout.restart]\n    debrief: {what_happened: \"The catalogue load failed; sale prices were missing.\", key_signal: \"No current price for SKU in checkout.\"}\n  - faults: [{at: \"15:07\", component: inventory_db, fault: pool_exhausted}]\n    root_cause: {component: inventory_db, fault: pool_exhausted}\n    accepted_fixes: [inventory_db.kill_blocking_session]\n    risky_actions: [checkout.restart]\n    debrief: {what_happened: \"A report held the inventory DB's connections.\", key_signal: \"Pool at 100%; checkout slow.\"}\n  - faults: [{at: \"15:07\", component: payment_gw, fault: unavailable}]\n    root_cause: {component: payment_gw, fault: unavailable}\n    accepted_fixes: [payment_gw.escalate_to_vendor]\n    risky_actions: [payment_gw.restart_adapter]\n    debrief: {what_happened: \"The payment provider was down.\", key_signal: \"503 from the gateway.\"}\n  - faults: [{at: \"15:07\", component: courier, fault: api_auth_expired}]\n    root_cause: {component: courier, fault: api_auth_expired}\n    accepted_fixes: [courier.rotate_api_credentials]\n    risky_actions: [courier.restart_adapter]\n    debrief: {what_happened: \"Our delivery partner API secret expired.\", key_signal: \"401 Unauthorized.\"}\n  - faults: [{at: \"15:07\", component: checkout, fault: memory_oom}]\n    root_cause: {component: checkout, fault: memory_oom}\n    accepted_fixes: [checkout.increase_memory_limit]\n    risky_actions: [checkout.restart]\n    debrief: {what_happened: \"Checkout ran out of memory and crash-looped.\", key_signal: \"OOMKilled, exit 137.\"}\n  - faults: [{at: \"15:07\", component: orders_topic, fault: poison_message, params: {partition: 4}}]\n    root_cause: {component: orders_topic, fault: poison_message}\n    accepted_fixes: [orders_topic.skip_poison_message]\n    risky_actions: [fulfilment.restart]\n    debrief: {what_happened: \"An unreadable order blocked a partition.\", key_signal: \"Lag on one partition; repeating offset.\"}\n", "id: allocations-falling-behind\ntitle: Allocations falling behind\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Easy\nsummary: Allocations slow down mid-afternoon. Find out why before the affirmation cut-off.\nbrief: >\n  13:30 on a busy trading day. You are the on-call support engineer for middle-office\n  allocations. The affirmation cut-off is 15:00. The ops desk has asked you to keep an eye\n  on today's flow.\nfaults:\n  - {at: \"13:36\", component: tam, fault: instances_lost, params: {remaining: 2}}\nroot_cause: {component: tam, fault: instances_lost}\naccepted_fixes: [tam.scale_out]\nrisky_actions: [tam.restart]\nhints:\n  - {after_min: 3, text: \"Which component's output dropped first? Compare what goes in with what comes out.\"}\n  - {after_min: 7, text: \"Open the Allocation Engine and look at its healthy instance count and logs.\"}\ndebrief:\n  what_happened: >\n    Two of the four Allocation Engine pods were evicted by node memory pressure. Throughput\n    halved to about 210 trades/min while 300/min kept arriving, so the backlog grew steadily.\n  key_signal: Throughput dropped while the input rate stayed flat; the logs show pods Pending.\n  why_not_restart: >\n    A rolling restart halves capacity even further for three minutes and does not bring\n    evicted pods back. The problem is node capacity, not the process.\n  runbook:\n    - Check the healthy instance count and pod status.\n    - Reschedule the instances on healthy nodes (scale out) with approval.\n    - Watch the backlog drain and confirm the cut-off projection.\n    - Raise a problem record for node memory pressure.\n", "id: stuck-partition\ntitle: One partition stuck\nsystems: [trade-allocation-kafka]\nlevel: Medium\nsummary: Overall flow looks almost normal, but part of the book is not being allocated.\nbrief: >\n  13:30. Everything looked fine at the start of the afternoon. Watch the allocation flow\n  through to the 15:00 affirmation cut-off.\nfaults:\n  - {at: \"13:35\", component: trades_topic, fault: poison_message, params: {partition: 3}}\nroot_cause: {component: trades_topic, fault: poison_message}\naccepted_fixes: [trades_topic.skip_poison_message]\nrisky_actions: [tam.restart]\nhints:\n  - {after_min: 4, text: \"Total throughput is only slightly lower. Is the lag spread evenly across partitions?\"}\n  - {after_min: 9, text: \"Search the Allocation Engine logs for errors that repeat the same offset.\"}\ndebrief:\n  what_happened: >\n    A message with a new field (allocRatioV2) could not be deserialised. The consumer retried\n    it forever, so partition 3 stopped while the other five partitions kept flowing. Throughput\n    fell by only one-sixth, which is easy to miss.\n  key_signal: Lag growing on one partition only, and the same offset repeating in the error log.\n  why_not_restart: >\n    Restarting the consumer re-reads the same message and gets stuck again. The message must be\n    parked to a dead-letter topic and repaired separately.\n  runbook:\n    - Compare lag per partition, not just total lag.\n    - Find the offset in the consumer error log.\n    - Park the message to the DLQ with approval, then repair and replay it.\n    - Raise a problem record for schema compatibility between OMS and the allocator.\n", "id: missing-ssis\ntitle: Missing settlement instructions\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Medium\nsummary: Some allocations are being rejected. The allocation engine itself looks healthy.\nbrief: >\n  13:30. Allocations are flowing. The 15:00 affirmation cut-off applies. A handful of clients\n  have onboarded new accounts this week.\nfaults:\n  - {at: \"13:32\", component: ssi, fault: feed_failed, params: {last_refresh_minutes_ago: 19}}\nroot_cause: {component: ssi, fault: feed_failed}\naccepted_fixes: [ssi.force_refresh, tam.reprocess_rejected]\nrisky_actions: [tam.restart]\nhints:\n  - {after_min: 3, text: \"Rejects are not a capacity problem. What data does the allocator need for each account?\"}\n  - {after_min: 8, text: \"Check when the SSI reference data last loaded successfully.\"}\n  - {after_min: 12, text: \"After fixing the data, the trades already rejected are still waiting in the exception queue.\"}\ndebrief:\n  what_happened: >\n    The SSI feed job failed (vendor SFTP refused connections). Once the data was older than\n    20 minutes, allocations for recently changed accounts were rejected and parked in the\n    exception queue.\n  key_signal: Reject rate above 2% with normal throughput, plus SSI staleness growing and feed errors.\n  why_not_restart: Restarting the allocator changes nothing; it still reads the same stale SSI data.\n  runbook:\n    - Check the reject reason in the allocator log.\n    - Check reference data freshness and the feed job log.\n    - Re-run the feed from the secondary source with approval.\n    - Reprocess the exception queue, then confirm it is empty.\n", "id: confirmation-platform-down\ntitle: Confirmations not matching\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Medium\nsummary: Allocations are fine, yet nothing is getting affirmed. Decide what is in your control.\nbrief: >\n  13:30. Normal afternoon flow. The 15:00 affirmation cut-off applies and client service has\n  three large institutional clients waiting for confirmations.\nfaults:\n  - {at: \"13:40\", component: ctm, fault: unavailable}\nnoise:\n  - {at: \"13:43\", name: \"Disk usage 82% on report-01\", severity: P4}\nroot_cause: {component: ctm, fault: unavailable}\naccepted_fixes: [ctm.escalate_to_vendor]\nrisky_actions: [tam.restart, ctm.restart_adapter]\nhints:\n  - {after_min: 3, text: \"Follow the flow left to right. Where does the backlog start?\"}\n  - {after_min: 7, text: \"Is the failure inside our systems, or at the third party?\"}\ndebrief:\n  what_happened: >\n    The confirmation platform returned HTTP 503 for every call. Our allocations kept flowing,\n    so everything looked healthy until confirmations piled up.\n  key_signal: Unmatched confirmations growing with 100% failed calls, while internal components stay green.\n  why_not_restart: >\n    The fault was on the vendor's side. Restarting our adapter or the allocator only adds a\n    second outage. The right move is a fast, clear vendor escalation and client updates.\n  runbook:\n    - Confirm the error is coming from the vendor (HTTP 5xx), not our adapter.\n    - Raise a P1 with the vendor and record the reference.\n    - Inform client service about the confirmation delay.\n    - Monitor recovery and the cut-off projection.\n", "id: database-pool-exhausted\ntitle: Allocation engine choking\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Hard\nsummary: Several alerts fire at once. Separate the cause from the symptoms.\nbrief: >\n  13:30. Month-end week. Finance has been running reconciliation reports today. The 15:00\n  affirmation cut-off applies.\nfaults:\n  - {at: \"13:37\", component: tam_db, fault: pool_exhausted}\nnoise:\n  - {at: \"13:39\", name: \"CPU 78% on tam-allocator-2\", severity: P4}\nroot_cause: {component: tam_db, fault: pool_exhausted}\naccepted_fixes: [tam_db.kill_blocking_session]\nrisky_actions: [tam.restart, tam.scale_out]\nhints:\n  - {after_min: 3, text: \"Throughput, lag and the cut-off are all symptoms. Which alert is closest to the cause?\"}\n  - {after_min: 7, text: \"Look at the Allocation DB logs: who is holding the connections?\"}\ndebrief:\n  what_happened: >\n    A month-end reconciliation report ran a full table scan and held 46 of 50 database\n    connections. The allocator waited for connections and processed only a fifth of its\n    normal volume.\n  key_signal: DB pool at 100% and connection timeouts in the allocator logs.\n  why_not_restart: >\n    Restarting or scaling out the allocator adds more clients competing for the same\n    exhausted pool. Free the connections first.\n  runbook:\n    - Check pool usage and connection wait time.\n    - Identify the blocking session and its owner.\n    - Kill it with approval and inform the report owner.\n    - Raise a problem: move heavy reports to a replica.\n", "id: mystery\ntitle: Mystery incident\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Hard\nsummary: One of nine real faults, chosen at random. No hints, no clues in the title.\nmystery: true\nbrief: >\n  13:30. Something will go wrong this afternoon. You do not know what or where.\n  The 15:00 affirmation cut-off applies.\nnoise:\n  - {at: \"13:41\", name: \"Disk usage 82% on report-01\", severity: P4}\npool:\n  - faults: [{at: \"13:38\", component: tam, fault: instances_lost, params: {remaining: 2}}]\n    root_cause: {component: tam, fault: instances_lost}\n    accepted_fixes: [tam.scale_out]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"Two allocator pods were evicted; throughput halved.\", key_signal: \"Healthy instances 2/4.\"}\n  - faults: [{at: \"13:38\", component: trades_topic, fault: poison_message, params: {partition: 1}}]\n    root_cause: {component: trades_topic, fault: poison_message}\n    accepted_fixes: [trades_topic.skip_poison_message]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"A poison message blocked one partition.\", key_signal: \"Lag on a single partition and a repeating offset in the logs.\"}\n  - faults: [{at: \"13:38\", component: ssi, fault: feed_failed, params: {last_refresh_minutes_ago: 19}}]\n    root_cause: {component: ssi, fault: feed_failed}\n    accepted_fixes: [ssi.force_refresh, tam.reprocess_rejected]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"The SSI feed failed; allocations for changed accounts were rejected.\", key_signal: \"Reject rate up, SSI staleness growing.\"}\n  - faults: [{at: \"13:38\", component: tam_db, fault: pool_exhausted}]\n    root_cause: {component: tam_db, fault: pool_exhausted}\n    accepted_fixes: [tam_db.kill_blocking_session]\n    risky_actions: [tam.restart, tam.scale_out]\n    debrief: {what_happened: \"A report query held the DB connection pool.\", key_signal: \"Pool at 100%, connection timeouts.\"}\n  - faults: [{at: \"13:38\", component: ctm, fault: unavailable}]\n    root_cause: {component: ctm, fault: unavailable}\n    accepted_fixes: [ctm.escalate_to_vendor]\n    risky_actions: [tam.restart, ctm.restart_adapter]\n    debrief: {what_happened: \"The confirmation platform was down on the vendor side.\", key_signal: \"100% failed calls to CTM; internal systems green.\"}\n  - faults: [{at: \"13:38\", component: tam, fault: memory_oom}]\n    root_cause: {component: tam, fault: memory_oom}\n    accepted_fixes: [tam.increase_memory_limit]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"The allocation engine ran out of memory and crash-looped.\", key_signal: \"CrashLoopBackOff; OOMKilled exit 137.\"}\n  - faults: [{at: \"13:38\", component: tam, fault: cpu_runaway}]\n    root_cause: {component: tam, fault: cpu_runaway}\n    accepted_fixes: [tam.kill_runaway_process]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"A rescheduled backup job took the allocation host's CPU.\", key_signal: \"backup_agent at 98% CPU in top; load average 15.\"}\n  - faults: [{at: \"13:38\", component: tam, fault: disk_full}]\n    root_cause: {component: tam, fault: disk_full}\n    accepted_fixes: [tam.clear_disk_space]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"The allocation host's log volume filled up and the application failed on every write.\", key_signal: \"No space left on device; /var/log at 100%.\"}\n  - faults: [{at: \"13:38\", component: ctm, fault: api_rate_limited}]\n    root_cause: {component: ctm, fault: api_rate_limited}\n    accepted_fixes: [ctm.enable_retry_backoff]\n    risky_actions: [ctm.restart_adapter]\n    debrief: {what_happened: \"The confirmation API throttled our immediate retries.\", key_signal: \"429 Too Many Requests; retry-policy immediate.\"}\n", "id: tam-allocation-crashloop\ntitle: Allocation engine keeps restarting\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Medium\nsummary: Allocations come in bursts and then stop. The engine is restarting by itself.\nbrief: >\n  13:30. Large block trades from a pension fund are being allocated across 300 accounts this\n  afternoon. The affirmation cut-off is 15:00.\nfaults:\n  - {at: \"13:36\", component: tam, fault: memory_oom}\nroot_cause: {component: tam, fault: memory_oom}\naccepted_fixes: [tam.increase_memory_limit]\nrisky_actions: [tam.restart, tam.scale_out, tam.purge_queue]\nhints:\n  - {after_min: 2, text: \"Throughput rises and falls in a regular pattern. What happens to the pods?\"}\n  - {after_min: 5, text: \"kubectl get pods and kubectl describe pod show why a container last stopped.\"}\ndebrief:\n  what_happened: >\n    Very large block allocations pushed the allocation engine past its 6 GiB memory limit. The\n    kernel killed it (OOMKilled, exit 137), Kubernetes restarted it, and it died again: a crash loop.\n  key_signal: >\n    CrashLoopBackOff with rising restarts, OOMKilled with exit code 137 in kubectl describe, and\n    \"OutOfMemoryError: Java heap space\" in the log.\n  why_not_restart: >\n    A restart or extra pods with the same limit run out of memory the same way. Purging the queue\n    throws away trades that then need manual reconciliation.\n  runbook:\n    - A regular up-and-down pattern means something keeps restarting. Check pod status and restarts.\n    - Read the last termination reason (OOMKilled, exit 137).\n    - Raise the memory limit with approval and confirm the pods stay up.\n    - Problem record - sizing for large block allocations.\n", "id: tam-confirmation-throttled\ntitle: Confirmations crawl through\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Medium\nsummary: The confirmation platform is up, but only part of the flow gets through.\nbrief: >\n  13:30. A new connection pool for the confirmation adapter was rolled out last week. The\n  affirmation cut-off is 15:00.\nfaults:\n  - {at: \"13:37\", component: ctm, fault: api_rate_limited}\nroot_cause: {component: ctm, fault: api_rate_limited}\naccepted_fixes: [ctm.enable_retry_backoff]\nrisky_actions: [ctm.restart_adapter, tam.scale_out, ctm.purge_queue]\nhints:\n  - {after_min: 2, text: \"Some confirmations still go through. What HTTP status do the others get?\"}\n  - {after_min: 5, text: \"What does our adapter do when it is told to slow down? Check its retry policy.\"}\ndebrief:\n  what_happened: >\n    The confirmation platform's API started returning 429 Too Many Requests. Our adapter retried\n    throttled calls immediately, so most of its quota went on retries and the backlog grew.\n  key_signal: >\n    429 with Retry-After in the adapter log, about 64% failed calls, and retry-policy: immediate in\n    the adapter configuration.\n  why_not_restart: >\n    Restarting the adapter replays the queue at full speed and gets throttled harder. More\n    allocation pods push more traffic into the same limit.\n  runbook:\n    - Distinguish \"they are down\" (5xx) from \"we are too fast\" (429).\n    - Check the retry policy; immediate retries make throttling worse.\n    - Switch to exponential back-off with approval and watch the backlog drain.\n    - Problem record - respect Retry-After and agree quotas with the provider.\n", "id: tam-confirmation-unauthorised\ntitle: Confirmation platform rejects everything\nsystems: [trade-allocation-kafka, trade-allocation-direct]\nlevel: Easy\nsummary: Every call to the confirmation platform fails. Is it them or us?\nbrief: >\n  13:30. The vendor sent a notice last month about credential rotation. The affirmation cut-off is 15:00.\nfaults:\n  - {at: \"13:36\", component: ctm, fault: api_auth_expired}\nroot_cause: {component: ctm, fault: api_auth_expired}\naccepted_fixes: [ctm.rotate_api_credentials]\nrisky_actions: [ctm.restart_adapter, ctm.failover_to_dr]\nhints:\n  - {after_min: 2, text: \"Read the exact HTTP status in the adapter log. 401 and 503 mean very different things.\"}\ndebrief:\n  what_happened: >\n    Our API client secret for the confirmation platform expired at midnight. Every call came back\n    401 Unauthorized with \"invalid_client\".\n  key_signal: 401 Unauthorized and \"client secret expired\" in the adapter log, not 503.\n  why_not_restart: The adapter reloads the same expired secret after a restart, and DR uses it too.\n  runbook:\n    - Read the status code before escalating; 401 is almost always our credentials.\n    - Rotate the client secret from the vault with approval.\n    - Watch confirmations drain before the affirmation cut-off.\n    - Problem record - alert on credential expiry dates.\n"]};

<script>
/*
 * OpsPilot Drill Simulator — simulation engine.
 *
 * Pure logic, no screen code. The same file runs in the browser and in Node tests.
 *
 * Layers:
 *   1. Component TYPES: how a kind of thing behaves, what it measures, how it can fail.
 *   2. HOSTS: services, databases, adapters and loaders run on hosts, and hosts fail too
 *      (disk full, out of memory, runaway CPU, open files, clock drift, expired certificates).
 *      A host fault shows up as an application symptom one layer up: nested failures.
 *   3. ACTIONS: one runbook catalogue per kind of component. It contains fixes, heavy-handed
 *      options and harmful ones; nothing tells the responder which is which.
 *   4. A BLUEPRINT (YAML): which components a system has and how they connect (a flow graph).
 *   5. A DRILL / use case (YAML, see session.js): which fault hits where, and how it is scored.
 *
 * Every simulated tick, work flows through the graph in dependency order. Faults only change
 * one component's (or host's) rules. Backlogs, lag, alerts and missed cut-offs follow from the flow.
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- helpers
  function rng(seed) { // mulberry32: deterministic random numbers, so drills are repeatable
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pad = n => String(n).padStart(2, '0');
  function parseClock(s) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim());
    if (!m) return null;
    return (+m[1]) * 3600 + (+m[2]) * 60;
  }
  function clockStr(t, withSeconds) {
    t = Math.max(0, Math.floor(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return pad(h) + ':' + pad(m) + (withSeconds ? ':' + pad(s) : '');
  }
  const fmtInt = n => Math.round(n).toLocaleString('en-IN');
  const hash = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

  // ---------------------------------------------------------------- 1. component types
  const HOST_METRICS = { host_cpu_pct: 'Host CPU (%)', host_mem_pct: 'Host memory (%)', host_disk_pct: 'Host disk, busiest mount (%)' };
  const TYPES = {
    source: {
      label: 'Participant', flow: true, required: ['rate_per_min'],
      metrics: { out_rate: 'Orders/trades sent per minute', held: 'Waiting at participant (not delivered)' },
      faults: {
        session_down: { label: 'Session rejected: sequence number mismatch', params: {} },
        order_flood: { label: 'Message flood from the participant', params: { multiplier: 4 } },
      },
    },
    kafka_topic: {
      label: 'Kafka topic', flow: true, required: ['partitions'],
      metrics: { lag: 'Total consumer lag (messages)', max_partition_lag: 'Largest single-partition lag', in_rate: 'Messages produced per minute', out_rate: 'Messages consumed per minute', rebalances: 'Consumer group rebalances' },
      faults: {
        poison_message: { label: 'Poison message blocking a partition', params: { partition: 3 } },
        rebalance_storm: { label: 'Consumer group rebalance storm', params: {} },
        partition_skew: { label: 'Hot key: one partition overloads its assigned consumer', params: { partition: 0, multiplier: 3 } },
      },
    },
    service: {
      label: 'Service', flow: true, required: ['capacity_per_min'],
      metrics: {
        in_rate: 'Received per minute', out_rate: 'Processed per minute', backlog: 'Waiting in queue',
        reject_rate: 'Rejected (%)', error_rate: 'Errors and timeouts (%)', instances: 'Healthy instances',
        latency_ms: 'Processing time (ms)', rejected: 'In exception queue', sessions_down: 'Participant sessions down', consumer_lag: 'Kafka lag on its partitions', ...HOST_METRICS,
      },
      faults: {
        instances_lost: { label: 'Instances lost (pods evicted)', params: { remaining: 2 } },
        config_change: { label: 'Bad configuration change', params: { api: 'limits-api', timeout_ms: 50 } },
      },
    },
    external_party: {
      label: 'External party', flow: true, required: ['capacity_per_min'],
      metrics: { in_rate: 'Received per minute', out_rate: 'Completed per minute', backlog: 'Waiting / unmatched', error_rate: 'Failed calls (%)', ...HOST_METRICS },
      faults: {
        unavailable: { label: 'External platform down (their side)', params: {} },
        api_rate_limited: { label: 'API rate limit exceeded (HTTP 429)', params: { quota_per_min: 600 } },
        api_auth_expired: { label: 'API credentials expired (HTTP 401)', params: {} },
      },
    },
    ref_data: {
      label: 'Reference data', flow: false, required: ['refresh_every_min', 'stale_after_min'],
      metrics: { staleness_min: 'Minutes since last successful load', ...HOST_METRICS },
      faults: { feed_failed: { label: 'Upstream feed job failing', params: { last_refresh_minutes_ago: 18 } } },
    },
    database: {
      label: 'Database', flow: false, required: ['pool_size'],
      metrics: { pool_used: 'Connections in use', pool_pct: 'Pool used (%)', wait_ms: 'Connection wait (ms)', ...HOST_METRICS },
      faults: { pool_exhausted: { label: 'Connection pool exhausted by a long-running query', params: {} } },
    },
    issuer: {
      label: 'Issuer', flow: false, required: [],
      metrics: { pending_announcements: 'Announcements not yet applied' },
      faults: { announcement_missed: { label: 'Corporate action not applied', params: { reject_share: 0.06 } } },
    },
  };

  // ---------------------------------------------------------------- 2. hosts and host faults
  // In the simulator the adapter host of an external party is OURS (our side of the connection).
  const HOST_TYPES = ['service', 'database', 'external_party', 'ref_data'];
  const MOUNT = { service: '/var/log', database: '/u01/arch', external_party: '/var/spool/adapter', ref_data: '/data/feeds' };
  const HOST_FAULTS = {
    disk_full: { label: 'Disk full on the host', types: HOST_TYPES, params: {} },
    memory_oom: { label: 'Out of memory: process killed and crash-looping', types: ['service'], params: {} },
    cpu_runaway: { label: 'CPU saturated by another process on the host', types: ['service', 'database'], params: {} },
    fd_exhausted: { label: 'Too many open files (file descriptor limit)', types: ['service', 'external_party'], params: {} },
    clock_skew: { label: 'Host clock drift (NTP stopped)', types: ['service'], params: { seconds: 94 } },
    cert_expired: { label: 'TLS client certificate expired', types: ['external_party'], params: {} },
  };
  const hasHost = type => HOST_TYPES.includes(type);
  // databases default to Oracle; "engine: postgres" changes error messages, mounts and SQL views
  const isPg = s => !!(s && s.def && s.def.engine === 'postgres');
  const mountOf = s => s.def.mount || (isPg(s) ? '/var/lib/pgsql/data' : MOUNT[s.type]);
  function faultsFor(type) { // every fault a component of this type can have, application and host
    const out = { ...(TYPES[type] ? TYPES[type].faults : {}) };
    Object.entries(HOST_FAULTS).forEach(([k, f]) => { if (f.types.includes(type)) out[k] = { ...f, host: true }; });
    return out;
  }

  // ---------------------------------------------------------------- 3. runbook action catalogue
  // Shown for every component of a type. Fixes, heavy-handed options and harmful ones sit side by side.
  const SVC = ['service'], EXT = ['external_party'], DB = ['database'], REF = ['ref_data'], SRC = ['source'], KAF = ['kafka_topic'], ISS = ['issuer'];
  const ACTIONS = {
    restart: { label: 'Rolling restart of the application', types: SVC },
    scale_out: { label: 'Scale out / reschedule instances', types: SVC, fixes: ['instances_lost'] },
    rollback_deployment: { label: 'Roll back the last deployment', types: SVC },
    revert_config: { label: 'Revert the last configuration change', types: SVC, fixes: ['config_change'] },
    reprocess_rejected: { label: 'Reprocess the exception queue', types: SVC },
    increase_memory_limit: { label: 'Increase memory limit and redeploy', types: SVC, fixes: ['memory_oom'] },
    raise_fd_limit: { label: 'Raise open-files limit and restart', types: [...SVC, ...EXT], fixes: ['fd_exhausted'] },
    purge_queue: { label: 'Purge the queue (drop waiting messages)', types: [...SVC, ...KAF, ...EXT] },
    clear_disk_space: { label: 'Archive and clear old files on the host', types: HOST_TYPES, fixes: ['disk_full'] },
    kill_runaway_process: { label: 'Kill the runaway process on the host', types: ['service', 'database'], fixes: ['cpu_runaway'] },
    resync_ntp: { label: 'Restart NTP and resync the host clock', types: HOST_TYPES, fixes: ['clock_skew'] },
    restart_host: { label: 'Reboot the host', types: HOST_TYPES, fixes: ['clock_skew', 'cpu_runaway'] },
    failover_to_dr: { label: 'Fail over to the DR site', types: ['service', 'database', 'external_party'], fixes: ['disk_full', 'memory_oom', 'cpu_runaway', 'fd_exhausted', 'clock_skew'] },
    renew_certificate: { label: 'Install the renewed TLS certificate', types: EXT, fixes: ['cert_expired'] },
    escalate_to_vendor: { label: 'Raise a P1 with the external party', types: EXT, fixes: ['unavailable'], delay_min: 8 },
    restart_adapter: { label: 'Restart our adapter', types: EXT },
    enable_retry_backoff: { label: 'Switch API retries to exponential back-off', types: EXT, fixes: ['api_rate_limited'] },
    rotate_api_credentials: { label: 'Rotate the API client secret from the vault', types: EXT, fixes: ['api_auth_expired'] },
    skip_poison_message: { label: 'Park the stuck message to a dead-letter topic', types: KAF, fixes: ['poison_message'] },
    tune_consumer_timeout: { label: 'Raise consumer session timeout and rejoin', types: KAF, fixes: ['rebalance_storm'] },
    rebalance_partitions: { label: 'Rebalance partition assignment across consumers (config change + consumer restart)', types: KAF, fixes: ['partition_skew'] },
    kill_blocking_session: { label: 'Kill the blocking database session', types: DB, fixes: ['pool_exhausted'] },
    increase_pool_size: { label: 'Increase the connection pool size', types: DB },
    force_refresh: { label: 'Re-run the reference data load', types: REF, fixes: ['feed_failed'] },
    reset_sequence: { label: 'Reset session sequence numbers with the participant', types: SRC, fixes: ['session_down'] },
    apply_throttle: { label: 'Apply message throttle to the participant', types: SRC, fixes: ['order_flood'] },
    disconnect_participant: { label: 'Disconnect the participant', types: SRC },
    reload_announcement: { label: 'Reprocess the issuer’s corporate action file', types: ISS, fixes: ['announcement_missed'] },
  };
  function actionsFor(type) { return Object.fromEntries(Object.entries(ACTIONS).filter(([, a]) => a.types.includes(type))); }

  // ---------------------------------------------------------------- 4. root causes a responder can declare
  // Same list for every component. Real faults sit among plausible causes that never happen here.
  const CAUSES = [
    { group: 'Application', key: 'instances_lost', label: 'Instances lost (pods evicted)' },
    { group: 'Application', key: 'bad_deployment', label: 'Faulty code deployment' },
    { group: 'Application', key: 'config_change', label: 'Bad configuration change' },
    { group: 'Application', key: 'gc_pauses', label: 'Long garbage-collection pauses' },
    { group: 'Application', key: 'thread_deadlock', label: 'Thread deadlock in the application' },
    { group: 'Messaging', key: 'poison_message', label: 'Poison message blocking a partition' },
    { group: 'Messaging', key: 'rebalance_storm', label: 'Consumer group rebalance storm' },
    { group: 'Messaging', key: 'partition_skew', label: 'Hot key: partition assignment out of balance' },
    { group: 'Data', key: 'pool_exhausted', label: 'Connection pool exhausted by a long-running query' },
    { group: 'Data', key: 'db_deadlock', label: 'Database deadlocks' },
    { group: 'Data', key: 'feed_failed', label: 'Reference data feed failing (stale data)' },
    { group: 'Data', key: 'announcement_missed', label: 'Corporate action not applied' },
    { group: 'Infrastructure', key: 'disk_full', label: 'Disk full on the host' },
    { group: 'Infrastructure', key: 'memory_oom', label: 'Out of memory: process killed and crash-looping' },
    { group: 'Infrastructure', key: 'cpu_runaway', label: 'CPU saturated by another process on the host' },
    { group: 'Infrastructure', key: 'fd_exhausted', label: 'Too many open files (file descriptor limit)' },
    { group: 'Infrastructure', key: 'clock_skew', label: 'Host clock drift (NTP stopped)' },
    { group: 'Infrastructure', key: 'cert_expired', label: 'TLS client certificate expired' },
    { group: 'Infrastructure', key: 'network_loss', label: 'Network packet loss' },
    { group: 'Infrastructure', key: 'dns_failure', label: 'DNS resolution failure' },
    { group: 'APIs', key: 'api_rate_limited', label: 'API rate limit exceeded (HTTP 429)' },
    { group: 'APIs', key: 'api_auth_expired', label: 'API credentials expired (HTTP 401)' },
    { group: 'APIs', key: 'api_schema_change', label: 'API contract changed by the provider' },
    { group: 'APIs', key: 'api_dependency_down', label: 'Internal API dependency down' },
    { group: 'Participants and vendors', key: 'session_down', label: 'Session rejected: sequence number mismatch' },
    { group: 'Participants and vendors', key: 'order_flood', label: 'Message flood from the participant' },
    { group: 'Participants and vendors', key: 'unavailable', label: 'External platform down (their side)' },
    { group: 'Participants and vendors', key: 'market_volume', label: 'Unusually high market volume' },
  ];
  const causeLabel = k => (CAUSES.find(c => c.key === k) || {}).label || k;

  // ---------------------------------------------------------------- 5. blueprint parsing + validation
  function parseBlueprint(text, yaml) {
    let bp;
    try { bp = yaml.load(text); } catch (e) { return { errors: ['YAML syntax: ' + (e.reason || e.message) + (e.mark ? ` (line ${e.mark.line + 1})` : '')] }; }
    if (!bp || typeof bp !== 'object') return { errors: ['The blueprint is empty.'] };
    return validateBlueprint(bp);
  }

  function validateBlueprint(bp) {
    const errors = [];
    const comps = Array.isArray(bp.components) ? bp.components : [];
    if (!bp.system) errors.push('Missing "system" (the system name).');
    if (!comps.length) errors.push('Missing "components" list.');
    const ids = new Map();
    comps.forEach((c, i) => {
      const where = `components[${i}]` + (c && c.id ? ` (${c.id})` : '');
      if (!c || typeof c !== 'object') { errors.push(`${where}: must be an object.`); return; }
      if (!c.id || !/^[a-z][a-z0-9_]*$/.test(c.id)) errors.push(`${where}: "id" must be lowercase letters, digits or _ and start with a letter.`);
      else if (ids.has(c.id)) errors.push(`${where}: duplicate id "${c.id}".`);
      else ids.set(c.id, c);
      if (!c.name) errors.push(`${where}: needs a "name".`);
      const T = TYPES[c.type];
      if (!T) { errors.push(`${where}: unknown type "${c.type}". Known types: ${Object.keys(TYPES).join(', ')}.`); return; }
      T.required.forEach(k => {
        if (typeof c[k] !== 'number' || !(c[k] > 0)) errors.push(`${where}: "${k}" is required and must be a positive number for type ${c.type}.`);
      });
      if (c.type === 'kafka_topic' && c.partitions > 64) errors.push(`${where}: at most 64 partitions.`);
      if (c.type === 'service' && c.instances !== undefined && !(Number.isInteger(c.instances) && c.instances > 0)) errors.push(`${where}: "instances" must be a positive whole number.`);
      if (c.type === 'service' && c.rejects !== undefined && !['queue', 'return'].includes(c.rejects)) errors.push(`${where}: "rejects" must be "queue" (held for reprocessing) or "return" (sent back to the sender).`);
      if (c.host !== undefined && (!hasHost(c.type) || !/^[a-z0-9][a-z0-9-]*$/.test(String(c.host)))) errors.push(`${where}: "host" names the server it runs on (lowercase letters, digits, dashes) and only applies to services, databases, adapters and loaders.`);
      if (c.mount !== undefined && (!hasHost(c.type) || !String(c.mount).startsWith('/'))) errors.push(`${where}: "mount" must be an absolute path such as /data/app.`);
      if (c.type === 'kafka_topic' && c.weights !== undefined && (!Array.isArray(c.weights) || c.weights.length !== c.partitions || c.weights.some(w => !(w > 0)))) errors.push(`${where}: "weights" needs one positive number per partition (${c.partitions}).`);
      if (c.type === 'kafka_topic' && c.keys !== undefined && (!Array.isArray(c.keys) || c.keys.length !== c.partitions)) errors.push(`${where}: "keys" needs one label per partition (${c.partitions}).`);
      if (c.engine !== undefined && (c.type !== 'database' || !['oracle', 'postgres'].includes(c.engine))) errors.push(`${where}: "engine" is only for databases and must be oracle or postgres.`);
      if (c.uses !== undefined && !Array.isArray(c.uses)) errors.push(`${where}: "uses" must be a list of component ids.`);
    });
    comps.forEach(c => (c && Array.isArray(c.uses) ? c.uses : []).forEach(u => {
      const d = ids.get(u);
      if (!d) errors.push(`${c.id}: uses unknown component "${u}".`);
      else if (!['ref_data', 'database'].includes(d.type)) errors.push(`${c.id}: can only "use" reference data or databases, not ${d.type} "${u}".`);
      else if (c.type !== 'service') errors.push(`${c.id}: only services can "use" other components.`);
    }));
    comps.filter(c => c && c.type === 'issuer').forEach(c => {
      const d = ids.get(c.feeds);
      if (!d || d.type !== 'ref_data') errors.push(`${c.id}: issuers need "feeds" naming a reference data component.`);
    });

    const edges = [], edgeSet = new Set(), inFlow = new Set();
    (Array.isArray(bp.flow) ? bp.flow : []).forEach((line, i) => {
      const parts = String(line).split('->').map(s => s.trim()).filter(Boolean);
      if (parts.length < 2) { errors.push(`flow[${i}]: needs at least two components joined by "->".`); return; }
      let ok = true;
      parts.forEach(p => {
        const c = ids.get(p);
        if (!c) { errors.push(`flow[${i}]: unknown component "${p}".`); ok = false; return; }
        if (!TYPES[c.type] || !TYPES[c.type].flow) { errors.push(`flow[${i}]: ${c.type} "${p}" cannot be in the flow; attach it with "uses" or "feeds".`); ok = false; }
      });
      if (!ok) return;
      for (let j = 0; j < parts.length - 1; j++) {
        const k = parts[j] + '>' + parts[j + 1];
        if (parts[j] === parts[j + 1]) { errors.push(`flow[${i}]: "${parts[j]}" cannot feed itself.`); continue; }
        if (!edgeSet.has(k)) { edgeSet.add(k); edges.push([parts[j], parts[j + 1]]); }
      }
      parts.forEach(p => inFlow.add(p));
    });
    if (!edges.length) errors.push('Missing "flow" (for example: - oms -> trades_topic -> tam).');
    const ups = {}, downs = {};
    comps.forEach(c => { if (c && c.id) { ups[c.id] = []; downs[c.id] = []; } });
    edges.forEach(([a, b]) => { if (downs[a] && ups[b]) { downs[a].push(b); ups[b].push(a); } });
    comps.forEach(c => {
      if (!c || !c.id || !TYPES[c.type] || !TYPES[c.type].flow) return;
      if (!inFlow.has(c.id)) { errors.push(`${c.id}: is not connected in any flow.`); return; }
      if (c.type === 'source' && ups[c.id].length) errors.push(`${c.id}: a participant (source) cannot receive flow; it only sends.`);
      if (c.type !== 'source' && !ups[c.id].length) errors.push(`${c.id}: nothing flows into it. Every flow starts at a participant (type source).`);
      if (c.type === 'kafka_topic') {
        const ds = downs[c.id];
        if (ds.some(d => ids.get(d).type !== 'service')) errors.push(`${c.id}: the consumers after a Kafka topic must be services.`);
        else if (!c.assign && ds.length !== 1) errors.push(`${c.id}: a Kafka topic needs exactly one consumer after it (it has ${ds.length}), or an "assign" map giving each consumer its partitions.`);
        else if (c.assign) {
          const a = c.assign, seen = new Set();
          if (typeof a !== 'object' || Array.isArray(a)) errors.push(`${c.id}: "assign" maps each consumer to a list of partitions, e.g. {consumer_1: [0, 1]}.`);
          else {
            Object.entries(a).forEach(([k, v]) => {
              if (!ds.includes(k)) errors.push(`${c.id}: assign names "${k}", which is not a consumer after this topic.`);
              (Array.isArray(v) ? v : []).forEach(n => { if (!Number.isInteger(n) || n < 0 || n >= c.partitions) errors.push(`${c.id}: partition ${n} for ${k} does not exist.`); else if (seen.has(n)) errors.push(`${c.id}: partition ${n} is assigned twice.`); else seen.add(n); });
            });
            ds.forEach(d => { if (!a[d]) errors.push(`${c.id}: consumer ${d} has no partitions in "assign".`); });
            if (seen.size !== c.partitions) errors.push(`${c.id}: every partition must be assigned to a consumer (${seen.size} of ${c.partitions} are).`);
          }
        }
      }
      if (c.type === 'service' && ups[c.id].some(u => ids.get(u).type === 'kafka_topic') && ups[c.id].length > 1)
        errors.push(`${c.id}: a service that consumes a Kafka topic can have only that topic as its input.`);
    });
    const order = [], state = {};
    let cycle = false;
    const visit = id => {
      if (state[id] === 2) return; if (state[id] === 1) { cycle = true; return; }
      state[id] = 1; (ups[id] || []).forEach(visit); state[id] = 2; order.push(id);
    };
    [...inFlow].forEach(visit);
    if (cycle) errors.push('The flow contains a loop. Flows must run one way, from participants to the end of the chain.');

    const clock = bp.clock || {};
    const start = parseClock(clock.start || '13:30'), cutoff = parseClock(clock.cutoff || '15:00');
    if (start === null) errors.push('clock.start must look like "13:30".');
    if (cutoff === null) errors.push('clock.cutoff must look like "15:00".');
    if (start !== null && cutoff !== null && cutoff <= start + 600) errors.push('clock.cutoff must be at least 10 minutes after clock.start.');
    const biz = bp.business || {};
    const kpis = Array.isArray(biz.kpis) ? biz.kpis : [];
    kpis.forEach((k, i) => {
      if (!k || !k.label) errors.push(`business.kpis[${i}]: needs a "label".`);
      if (!k || !ids.has(k.at)) errors.push(`business.kpis[${i}]: "at" must be a component id.`);
    });
    if (kpis.filter(k => k && k.cutoff).length > 1) errors.push('Only one business KPI can be marked "cutoff: true".');

    const alerts = Array.isArray(bp.alerts) ? bp.alerts : [];
    alerts.forEach((a, i) => {
      const where = `alerts[${i}]` + (a && a.name ? ` (${a.name})` : '');
      if (!a || !a.name) { errors.push(`${where}: needs a "name".`); return; }
      const c = ids.get(a.on);
      if (!c) { errors.push(`${where}: "on" must be a component id.`); return; }
      const T = TYPES[c.type];
      if (T && !T.metrics[a.metric]) errors.push(`${where}: ${c.type} has no metric "${a.metric}". Available: ${Object.keys(T.metrics).join(', ')}.`);
      if (typeof a.above !== 'number' && typeof a.below !== 'number') errors.push(`${where}: needs "above" or "below" as a number.`);
      if (a.severity && !/^P[1-4]$/.test(a.severity)) errors.push(`${where}: severity must be P1–P4.`);
    });

    const dg = bp.diagram || {};
    const linked = (a, b) => edgeSet.has(a + '>' + b) || (ids.get(a) && (ids.get(a).uses || []).includes(b)) || (ids.get(a) && ids.get(a).feeds === b);
    (Array.isArray(dg.groups) ? dg.groups : []).forEach((g, i) => {
      if (!g || !g.label || !Array.isArray(g.ids)) { errors.push(`diagram.groups[${i}]: needs "label" and a list of "ids".`); return; }
      g.ids.forEach(id => { if (!ids.has(id)) errors.push(`diagram.groups[${i}] (${g.label}): unknown component "${id}".`); });
    });
    (Array.isArray(dg.steps) ? dg.steps : []).forEach((s, i) => {
      if (!s || !s.text) { errors.push(`diagram.steps[${i}]: needs "text".`); return; }
      if (!ids.has(s.from) || !ids.has(s.to)) errors.push(`diagram.steps[${i}]: "from" and "to" must be component ids.`);
      else if (!linked(s.from, s.to)) errors.push(`diagram.steps[${i}]: ${s.from} and ${s.to} are not connected (use a flow, "uses" or "feeds" link).`);
    });
    Object.entries(dg.place || {}).forEach(([id, p]) => {
      if (!ids.has(id)) errors.push(`diagram.place: unknown component "${id}".`);
      else if (!Array.isArray(p) || p.length !== 2 || p.some(v => typeof v !== 'number' || v < 0)) errors.push(`diagram.place.${id}: must be [column, row], for example [2, 0.5].`);
    });

    // tables written by traced orders, and the journeys those orders follow (see trace.js)
    const tables = bp.tables && typeof bp.tables === 'object' ? bp.tables : {};
    Object.entries(tables).forEach(([t, d]) => {
      if (!/^[a-z][a-z0-9_]*$/.test(t)) errors.push(`tables.${t}: table names must be lowercase letters, digits or _.`);
      if (!d || !ids.has(d.db) || ids.get(d.db).type !== 'database') errors.push(`tables.${t}: "db" must name a database component.`);
      if (!d || !Array.isArray(d.columns) || !d.columns.length) errors.push(`tables.${t}: needs a list of "columns".`);
    });
    const journeys = Array.isArray(bp.journeys) ? bp.journeys : [];
    const WRITE = /^(\w+)\s*:\s*(insert|update)\b\s*(.*)$/i;
    journeys.forEach((j, i) => {
      const where = `journeys[${i}]` + (j && j.id ? ` (${j.id})` : '');
      if (!j || !j.id || !j.name) { errors.push(`${where}: needs an "id" and a "name".`); return; }
      if (!j.order || typeof j.order !== 'object') errors.push(`${where}: needs an "order" (the fields of the order, e.g. symbol, side, qty, price).`);
      const steps = Array.isArray(j.steps) ? j.steps : [];
      if (!steps.length) errors.push(`${where}: needs "steps".`);
      let prev = null;
      steps.forEach((st, k) => {
        const w = `${where} step ${k + 1}`;
        const c = st && ids.get(st.at);
        if (!c) { errors.push(`${w}: "at" must be a component id.`); return; }
        if (!TYPES[c.type] || !TYPES[c.type].flow) { errors.push(`${w}: ${st.at} is not in the flow; record its work as "writes" on the step that uses it.`); return; }
        if (st.from !== undefined && !steps.slice(0, k).some(x => x && x.at === st.from)) errors.push(`${w}: "from: ${st.from}" must name an earlier step's component (it starts a branch from there).`);
        const parent = st.from !== undefined ? st.from : prev;
        if (parent && !edgeSet.has(parent + '>' + st.at)) errors.push(`${w}: ${parent} does not send to ${st.at} in the flow.`);
        prev = st.at;
        (st.writes || []).forEach(x => {
          const m = WRITE.exec(String(x));
          if (!m) errors.push(`${w}: write "${x}" must look like "orders: insert status=NEW" or "orders: update status=FILLED".`);
          else if (!tables[m[1]]) errors.push(`${w}: write to unknown table "${m[1]}" (add it under "tables").`);
        });
      });
    });

    if (errors.length) return { errors };
    const sourceRate = comps.filter(c => c.type === 'source').reduce((s, c) => s + c.rate_per_min, 0);
    const model = {
      id: bp.id || 'blueprint', system: bp.system, description: bp.description || '',
      start, cutoff, components: comps, byId: Object.fromEntries(comps.map(c => [c.id, c])),
      edges, ups, downs, order, sourceRate,
      alerts: alerts.map((a, i) => ({ id: 'rule' + i, severity: 'P3', ...a })),
      business: {
        currency: biz.currency || '₹', unit: biz.unit || 'Cr', avg_notional: typeof biz.avg_notional === 'number' ? biz.avg_notional : 0.5,
        unit_name: biz.unit_name || 'trades',
        kpis, tolerance_trades: typeof biz.tolerance_trades === 'number' ? biz.tolerance_trades : sourceRate * 0.5,
      },
      diagram: { groups: dg.groups || [], steps: dg.steps || [], place: dg.place || {}, notes: dg.notes || '' },
      tables, journeys,
      clockLabel: clock.cutoff_label || 'Cut-off',
      raw: bp,
    };
    return { errors: [], blueprint: model };
  }

  // ---------------------------------------------------------------- 6. the simulator
  function Simulator(bp, opts) {
    opts = opts || {};
    this.bp = bp;
    this.rand = rng(opts.seed || 42);
    this.t = bp.start - 30 * 60;       // warm up for 30 simulated minutes
    this.alerts = []; this.alertSeq = 1000; this.events = [];
    this.history = { t: [] }; this.lastSample = -Infinity;
    this.c = {};
    bp.components.forEach(def => { this.c[def.id] = this._initState(def); });
    bp.components.forEach(def => { this.c[def.id].ups = bp.ups[def.id] || []; this.c[def.id].downs = bp.downs[def.id] || []; });
    // processes on the same named server share one host: one full disk or reboot hits all of them
    const shared = {};
    Object.values(this.c).forEach(s => { if (s.host && s.def.host) { if (shared[s.def.host]) s.host = shared[s.def.host]; else shared[s.def.host] = s.host; } });
    // which sources each component's work comes from (for business KPIs)
    this._srcs = {};
    const srcOf = id => { if (this._srcs[id]) return this._srcs[id]; const out = new Set(); (bp.ups[id] || []).forEach(u => { if (this.c[u].type === 'source') out.add(u); srcOf(u).forEach(x => out.add(x)); }); this._srcs[id] = out; return out; };
    Object.keys(this.c).forEach(srcOf);
    this.ruleState = {};
    this.biz = { produced: 0, prevCut: 0, netRate: 0, lost: 0 };
    this.warmup(bp.start - this.t);
  }

  Simulator.prototype._initState = function (def) {
    const s = { def, type: def.type, fault: null, logs: [], hist: {}, rates: {}, tot: { in: 0, out: 0, rej: 0, err: 0 }, win: { in: 0, out: 0, rej: 0, err: 0, n: 0 } };
    if (def.type === 'source') { s.produced = 0; s.held = 0; s.seqOut = 10000 + Math.floor(this.rand() * 500); }
    if (def.type === 'kafka_topic') { s.weights = (def.weights || new Array(def.partitions).fill(1)).slice(); s.assign = def.assign ? JSON.parse(JSON.stringify(def.assign)) : null; s.parts = new Array(def.partitions).fill(0); s.blocked = -1; s.rebalances = 0; s.offsets = new Array(def.partitions).fill(0).map((_, i) => 884000 + i * 3121); s.dlq = 0; }
    if (def.type === 'service') { s.inbox = 0; s.retry = 0; s.rejected = 0; s.configured = def.instances || 4; s.instances = s.configured; s.restartUntil = -1; s.rejectLog = []; s.oomRestarts = 0; }
    if (def.type === 'external_party') { s.inbox = 0; s.recoverAt = -1; s.adapterDownUntil = -1; }
    if (def.type === 'ref_data') { s.lastRefresh = this.t; s.records = 48210; }
    if (def.type === 'database') { s.used = Math.round(def.pool_size * 0.28); }
    if (hasHost(def.type)) { const h = hash(def.id); s.host = { fault: null, outageUntil: -1, disk: 34 + h % 27, cpu: 18 + h % 17, mem: 52 + h % 14 }; }
    return s;
  };

  Simulator.prototype.now = function () { return this.t; };
  Simulator.prototype.time = function (sec) { return clockStr(this.t, sec); };
  Simulator.prototype.log = function (id, level, msg) {
    const s = this.c[id];
    s.logs.push({ t: this.t, level, msg, id, line: `${clockStr(this.t, true)} ${level.padEnd(5)} [${id}] ${msg}` });
    if (s.logs.length > 600) s.logs.splice(0, s.logs.length - 600);
  };
  Simulator.prototype.chance = function (p) { return this.rand() < p; };
  Simulator.prototype.sessionId = function (s) { return s.def.session || s.def.id.toUpperCase().slice(0, 6); };

  // host helpers
  Simulator.prototype.hostFault = function (s) { return s && s.host && s.host.fault ? s.host.fault.type : null; };
  Simulator.prototype.inOutage = function (s) { return !!(s && s.host && this.t < s.host.outageUntil); };
  Simulator.prototype.oomUp = function (s) { // crash loop: about 45 s up, 135 s down while Kubernetes backs off
    const ph = (this.t - s.host.fault.since) % 180; return ph < 45;
  };
  Simulator.prototype.hostFactor = function (s) {
    if (!s.host) return 1;
    if (this.inOutage(s)) return 0;
    switch (this.hostFault(s)) {
      case 'disk_full': return 0;
      case 'memory_oom': return this.oomUp(s) ? 1 : 0;
      case 'cpu_runaway': return 0.45;
      case 'fd_exhausted': return 0.4;
      default: return 1;
    }
  };
  Simulator.prototype.dbFactor = function (d) { // how a database's state slows the services that use it
    if (this.inOutage(d)) return 0;
    const hf = this.hostFault(d);
    if (hf === 'disk_full') return 0; // archiver stuck: no commits
    let f = 1;
    if (hf === 'cpu_runaway') f *= 0.5;
    if (d.fault && d.fault.type === 'pool_exhausted') f *= 0.2;
    return f;
  };
  Simulator.prototype.extDown = function (s) { // external connection unusable, and why
    if (s.fault && s.fault.type === 'unavailable') return 'vendor';
    if (s.fault && s.fault.type === 'api_auth_expired') return 'auth';
    if (this.t < s.adapterDownUntil || this.inOutage(s)) return 'restart';
    const hf = this.hostFault(s);
    if (hf === 'cert_expired') return 'cert';
    if (hf === 'disk_full') return 'disk';
    return null;
  };
  // why a participant's session is down: its own sequence mismatch, or the gateway host's clock
  Simulator.prototype.sourceDown = function (s) {
    if (s.fault && s.fault.type === 'session_down') return 'seq';
    if (s.downs.some(d => this.hostFault(this.c[d]) === 'clock_skew')) return 'clock';
    return null;
  };

  Simulator.prototype.serviceFactor = function (s) {
    let f = s.instances / s.configured;
    if (this.t < s.restartUntil) f *= 0.5;
    f *= this.hostFactor(s);
    if (s.fault && s.fault.type === 'config_change') f *= 0.4;
    (s.def.uses || []).forEach(u => { const d = this.c[u]; if (d.type === 'database') f *= this.dbFactor(d); });
    s.ups.forEach(u => { const up = this.c[u]; if (up.type === 'kafka_topic' && up.fault && up.fault.type === 'rebalance_storm') f *= 0.35; });
    return f;
  };
  Simulator.prototype.staleness = function (d) { return (this.t - d.lastRefresh) / 60; };
  Simulator.prototype.staleRefs = function (s) {
    return (s.def.uses || []).map(u => this.c[u]).filter(d => d.type === 'ref_data' && this.staleness(d) > d.def.stale_after_min);
  };
  Simulator.prototype.issuersOf = function (refId) { return Object.values(this.c).filter(x => x.type === 'issuer' && x.def.feeds === refId); };
  Simulator.prototype.rejectCauses = function (s) {
    const out = [];
    this.staleRefs(s).forEach(r => out.push({ share: typeof r.def.stale_reject_share === 'number' ? r.def.stale_reject_share : 0.08, ref: r, kind: 'stale' }));
    (s.def.uses || []).forEach(u => this.issuersOf(u).forEach(is => {
      if (is.fault && is.fault.type === 'announcement_missed') out.push({ share: is.fault.params.reject_share, ref: this.c[u], issuer: is, kind: 'issuer' });
    }));
    return out;
  };

  Simulator.prototype.accept = function (id, n) {
    const s = this.c[id];
    s.tot.in += n; s.win.in += n;
    if (s.type === 'kafka_topic') {
      const w = this.partWeights(s), tw = w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < s.parts.length; i++) { const x = n * w[i] / tw; s.parts[i] += x; s.offsets[i] += x; }
    } else if (s.type === 'service' || s.type === 'external_party') s.inbox += n;
  };
  // share of a topic's messages per partition: keys hash to partitions, so some partitions are busier
  Simulator.prototype.partWeights = function (k) {
    const w = k.weights.slice();
    const hot = k.hot || (k.fault && k.fault.type === 'partition_skew' ? k.fault.params : null);
    if (hot) w[hot.partition] *= hot.multiplier;
    return w;
  };
  Simulator.prototype.partitionsOf = function (k, consumerId) { // partitions a consumer reads
    return k.assign ? (k.assign[consumerId] || []) : k.parts.map((_, i) => i);
  };
  Simulator.prototype.kafkaIn = function (s) { const u = s.ups.length === 1 && this.c[s.ups[0]]; return u && u.type === 'kafka_topic' ? u : null; };
  Simulator.prototype.emit = function (s, n) { s.downs.forEach(d => this.accept(d, n)); };

  Simulator.prototype.step = function (dt) {
    this.t += dt;
    Object.values(this.c).filter(s => s.type === 'ref_data').forEach(s => {
      if (this.t - s.lastRefresh < s.def.refresh_every_min * 60) return;
      const hostBad = this.hostFault(s) === 'disk_full' || this.inOutage(s);
      if ((s.fault && s.fault.type === 'feed_failed') || hostBad) {
        if (!s.lastFailLog || this.t - s.lastFailLog >= 300) {
          s.lastFailLog = this.t;
          if (hostBad) this.log(s.def.id, 'ERROR', `${s.def.name} load FAILED: No space left on device writing ${MOUNT.ref_data}/ssi_${clockStr(this.t).replace(':', '')}.csv`);
          else this.log(s.def.id, 'ERROR', `${s.def.name} feed job FAILED: sftp://feeds.vendor.example:22 connection refused`);
        }
      } else {
        s.lastRefresh = this.t; s.records += Math.floor(this.rand() * 40);
        const missed = this.issuersOf(s.def.id).filter(is => is.fault && is.fault.type === 'announcement_missed');
        if (missed.length) this.log(s.def.id, 'WARN', `${s.def.name} loaded ${fmtInt(s.records)} records; corporate action file ${missed.map(m => m.fault.ca).join(', ')} skipped: unknown ISIN format`);
        else this.log(s.def.id, 'INFO', `${s.def.name} loaded: ${fmtInt(s.records)} records`);
      }
    });
    Object.values(this.c).filter(s => s.type === 'database').forEach(s => {
      const P = s.def.pool_size;
      if ((s.fault && s.fault.type === 'pool_exhausted') || this.hostFault(s) === 'disk_full') s.used = P;
      else s.used = Math.max(2, Math.min(P, Math.round(P * (0.24 + this.rand() * 0.1))));
    });
    this.bp.order.forEach(id => this._process(id, dt));
    Object.values(this.c).forEach(s => {
      if (s.type === 'external_party' && s.recoverAt > 0 && this.t >= s.recoverAt) {
        s.recoverAt = -1; this.clearFault(s.def.id, 'External party reports platform restored');
        this.log(s.def.id, 'INFO', `${s.def.name} responding normally again (incident closed by the external party)`);
      }
      if (s.type === 'service' && this.hostFault(s) === 'memory_oom') {
        const ph = (this.t - s.host.fault.since) % 180;
        if (ph < dt) { s.oomRestarts++; this.log(s.def.id, 'ERROR', `java.lang.OutOfMemoryError: Java heap space (heap 6144 MB)`); this.log(s.def.id, 'WARN', `Container ${s.def.id}-7f9c-1 OOMKilled (exit 137); restart #${s.oomRestarts}, back-off ${Math.min(300, 10 * 2 ** s.oomRestarts)}s`); }
        if (ph >= 45 && ph - dt < 45) this.log(s.def.id, 'INFO', `Starting ${s.def.name} (heap 6144 MB)... CrashLoopBackOff wait`);
      }
    });
    if (this._advanceTraces) this._advanceTraces(dt); // traced orders (trace.js), if loaded
    this._chatter(dt);
    this._rates(dt);
    this._business(dt);
    this._evalAlerts();
    if (this.t - this.lastSample >= 60) { this.lastSample = this.t; this._sample(); }
  };

  const x429 = (s, min) => s.def.capacity_per_min * min * 0.6; // throttled calls that come back 429 and are retried at once
  Simulator.prototype._process = function (id, dt) {
    const s = this.c[id], def = s.def, min = dt / 60;
    if (s.type === 'source') {
      const mult = s.fault && s.fault.type === 'order_flood' ? (s.fault.params.multiplier || 4) : 1;
      const n = def.rate_per_min * mult * min * (0.94 + this.rand() * 0.12);
      this.biz.produced += n; s.produced += n;
      if (this.sourceDown(s)) { s.held += n; return; }
      let send = n;
      if (s.held > 0) { const r = Math.min(s.held, def.rate_per_min * 2 * min); s.held -= r; send += r; }
      s.tot.out += send; s.win.out += send; s.seqOut += Math.round(send);
      this.emit(s, send);
      return;
    }
    if (s.type === 'kafka_topic') return;
    if (s.type === 'service') {
      const kafkaUp = this.kafkaIn(s);
      let cap = def.capacity_per_min * this.serviceFactor(s) * min;
      const r = Math.min(s.retry, cap); s.retry -= r; cap -= r;
      let got = r;
      if (kafkaUp) {
        const up = kafkaUp;
        const mine = new Set(this.partitionsOf(up, id));
        const open = up.parts.map((v, i) => i === up.blocked || !mine.has(i) ? 0 : v);

        for (let pass = 0; pass < 3 && remaining > 1e-9; pass++) {
          const active = open.map((v, i) => [v, i]).filter(([v]) => v > 1e-9);
          if (!active.length) break;
          const share = remaining / active.length;
          active.forEach(([v, i]) => { const x = Math.min(v, share); open[i] -= x; up.parts[i] -= x; remaining -= x; got += x; });
        }

      }

      }

      const ok = got - rej;
      s.tot.out += ok; s.win.out += ok;

      if (s.fault && s.fault.type === 'config_change') s.win.err += got * 0.8 + 1;
      if (hf === 'disk_full' || (hf === 'memory_oom' && !this.oomUp(s)) || this.inOutage(s)) s.win.err += 2;

      s.tot.out += x; s.win.out += x;
      if (down) s.win.err += 3;
