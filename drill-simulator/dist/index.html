<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpsPilot Drills</title>
<meta name="description" content="Incident drill simulator for production support teams: configurable system blueprints, real fault propagation, scoring and debriefs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one operations console. Header carries the clock and business impact; the system map
   is the centre of attention; response controls sit beside it; the inspector reads beneath. */
:root {
  --bg: #F1F3F6;
  --panel: #FFFFFF;
  --sunk: #F6F8FA;
  --ink: #18202B;
  --muted: #5A6577;
  --line: #D9DEE6;
  --accent: #1F5FBF;
  --accent-soft: #E4ECF8;
  --ok: #1D7F52; --ok-soft: #E1F2E9;
  --warn: #A86300; --warn-soft: #FBEFD9;
  --bad: #BE2F3A; --bad-soft: #FBE4E6; --on-bad: #FFFFFF;
  --term: #111821; --term-ink: #CBD5E3;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --panel: #151C26; --sunk: #1A2230; --ink: #E3E8F0; --muted: #96A1B3; --line: #283244;
    --accent: #7EA6F2; --accent-soft: #1D2A44;
    --ok: #4FC48C; --ok-soft: #12301F; --warn: #E6A645; --warn-soft: #36280F; --bad: #F06D77; --bad-soft: #3A1A1F; --on-bad: #2A0C10;
    --term: #0A0E14; --term-ink: #C3CEDD; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --panel: #151C26; --sunk: #1A2230; --ink: #E3E8F0; --muted: #96A1B3; --line: #283244;
  --accent: #7EA6F2; --accent-soft: #1D2A44;
  --ok: #4FC48C; --ok-soft: #12301F; --warn: #E6A645; --warn-soft: #36280F; --bad: #F06D77; --bad-soft: #3A1A1F; --on-bad: #2A0C10;
  --term: #0A0E14; --term-ink: #C3CEDD; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .2px; text-wrap: balance; margin: 0; }
h2 { font-size: 19px; }
h3 { font-size: 15.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--display); font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.brand b { font-family: var(--display); font-size: 20px; font-weight: 700; display: block; line-height: 1.1; }
.brand span { font-size: 12.5px; color: var(--muted); }
.clock { display: flex; flex-direction: column; }
.clock .t { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1.1; }
.kpi { display: flex; flex-direction: column; min-width: 120px; }
.kpi .v { font-family: var(--mono); font-size: 17px; font-weight: 500; }
.kpi .v.warn { color: var(--warn); } .kpi .v.bad { color: var(--bad); }
.grow { flex: 1; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.state-chip { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 12px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.state-chip.live { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.tabs { max-width: 1440px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1440px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > select { flex: 1 1 150px; max-width: 100%; }
.controls select { flex: none; }
.between { justify-content: space-between; }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 13px; border-radius: 6px; font-weight: 500; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.sm { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
select, input[type=text], textarea { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.field > select, label.field > input { color: var(--ink); width: 100%; }

.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 10px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mut { background: var(--sunk); color: var(--muted); }
.pill.info { background: var(--accent-soft); color: var(--accent); }

/* drill library */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; text-align: left; }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card:disabled { opacity: .55; }
.card h3 { font-size: 17px; }
.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; }

/* run */
.run { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.map { overflow-x: auto; }
.map svg { display: block; width: 100%; min-width: 640px; height: auto; }
.node { cursor: pointer; }
.node rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.4; }
.node.ok rect.bar { fill: var(--ok); } .node.warn rect.bar { fill: var(--warn); } .node.bad rect.bar { fill: var(--bad); }
.node text { fill: var(--ink); font-family: var(--body); }
.node text.k { fill: var(--muted); font-size: 11.5px; }
.node text.m { font-family: var(--mono); font-size: 12px; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dep { stroke-dasharray: 4 4; }
.edge-l { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.pbar { fill: var(--accent); } .pbar.hot { fill: var(--bad); } .ptrack { fill: var(--sunk); }

.alerts { display: grid; gap: 6px; max-height: 250px; overflow-y: auto; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; background: var(--panel); text-align: left; width: 100%; }
.alert.resolved { opacity: .6; }
.alert .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.brief { font-size: 14px; }
.hint { border-left: 3px solid var(--accent); padding: 4px 10px; font-size: 13.5px; background: var(--accent-soft); border-radius: 0; }
.feed { display: grid; gap: 6px; font-size: 13px; max-height: 200px; overflow-y: auto; }
.feed div { border-left: 3px solid var(--line); padding-left: 8px; }
.feed div.ok { border-color: var(--ok); } .feed div.bad { border-color: var(--bad); }
.approve { border: 1px dashed var(--bad); border-radius: 6px; padding: 10px; display: grid; gap: 8px; background: var(--bad-soft); }
.approve .err { color: var(--bad); font-size: 13px; font-weight: 600; }

/* inspector */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--sunk); }
.tile .v { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.tile svg { display: block; width: 100%; height: 34px; margin-top: 4px; }
.spark-l { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark-a { fill: var(--accent-soft); stroke: none; }
.spark-d { fill: var(--accent); }
.term { background: var(--term); color: var(--term-ink); font-family: var(--mono); font-size: 12.3px; line-height: 1.55; border-radius: 6px; padding: 10px 12px; height: 240px; overflow: auto; white-space: pre; }
.term .E { color: #FF8A93; } .term .W { color: #F2BE6B; }

/* blueprint */
.bp { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
textarea.code { width: 100%; min-height: 560px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; tab-size: 2; color: var(--ink); }
.errors { color: var(--bad); font-size: 13.5px; margin: 0; padding-left: 18px; }
.okmsg { color: var(--ok); font-size: 13.5px; font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--sunk); padding: 0 4px; border-radius: 3px; }

/* debrief */
.score { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.score .big { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.parts { display: grid; gap: 8px; }
.part { display: grid; grid-template-columns: 190px 1fr 56px; gap: 10px; align-items: center; font-size: 14px; }
.part .track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.part .fill { height: 100%; background: var(--accent); }
.part .note { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.tl li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
.tl li time { font-family: var(--mono); color: var(--muted); }
.tl li.k-fault { color: var(--bad); font-weight: 600; } .tl li.k-fixed, .tl li.k-recovered { color: var(--ok); font-weight: 600; } .tl li.k-alert { color: var(--warn); }
.cls { font-size: 12px; font-weight: 600; }
.cls.accepted { color: var(--ok); } .cls.risky { color: var(--bad); } .cls.unnecessary { color: var(--warn); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
footer { max-width: 1440px; margin: 0 auto; padding: 0 16px 28px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 1080px) { .run, .bp { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .part { grid-template-columns: 1fr 48px; } .part .track { grid-column: 1 / -1; grid-row: 2; } .part .note { grid-column: 1 / -1; margin-top: 0; }
  .score { grid-template-columns: 1fr; }
  .clock .t { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>OpsPilot Drills</b><span>Incident drills on a simulated system</span></div>
    <div class="clock"><span class="label">Simulated time</span><span class="t" id="clock">13:30:00</span><span class="small muted" id="cutoff"></span></div>
    <div class="row" id="kpis" style="gap:22px"></div>
    <div class="grow"></div>
    <div class="controls">
      <span class="state-chip" id="stateChip">Sandbox</span>
      <button class="btn sm" id="pauseBtn">Pause</button>
      <label class="small muted row" style="gap:4px">Speed
        <select id="speed" aria-label="Simulation speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="drills">Drills</button>
    <button role="tab" data-tab="run">System</button>
    <button role="tab" data-tab="blueprint">Blueprint</button>
    <button role="tab" data-tab="debrief">Debrief</button>
  </nav>
</header>
<main id="main"></main>
<footer>Simulated environment: synthetic trades only, no real systems or client data. Blueprints and drills are plain YAML.</footer>
<div id="toast" role="status" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:90vw"></div>

<script>
window.DRILL_CONTENT = {"blueprints": {"trade-allocation-direct": "# The same system WITHOUT Kafka: the OMS calls the allocation engine directly.\n# Compare with trade-allocation-kafka.yaml — the only differences are one component,\n# one flow line and the alerts that watch it.\n\nid: trade-allocation-direct\nsystem: Middle-office trade allocation (direct, no Kafka)\ndescription: >\n  The OMS hands fills straight to the allocation engine's queue. Without Kafka there is\n  no consumer lag to watch: a slow allocation engine shows up as its own backlog.\n\nclock:\n  start: \"13:30\"\n  cutoff: \"15:00\"\n\nbusiness:\n  currency: \"₹\"\n  unit: \"Cr\"\n  avg_notional: 0.6\n  produced_at: oms\n  kpis:\n    - {label: \"Unallocated\", at: tam}\n    - {label: \"Not yet affirmed\", at: ctm, cutoff: true}\n\ncomponents:\n  - {id: oms, type: source, name: Order Management, rate_per_min: 300}\n  - {id: tam, type: service, name: Allocation Engine, capacity_per_min: 420, instances: 4, uses: [ssi, tam_db]}\n  - {id: ssi, type: ref_data, name: SSI Reference Data, refresh_every_min: 15, stale_after_min: 20}\n  - {id: tam_db, type: database, name: Allocation DB, pool_size: 50}\n  - {id: ctm, type: external_party, name: Confirmation Platform (CTM), capacity_per_min: 520}\n  - {id: settle, type: external_party, name: Settlement (SWIFT), capacity_per_min: 600}\n\nflow:\n  - oms -> tam -> ctm -> settle\n\nalerts:\n  - {name: \"Allocation backlog high\", on: tam, metric: backlog, above: 900, severity: P2}\n  - {name: \"Allocation throughput low\", on: tam, metric: out_rate, below: 235, severity: P3}\n  - {name: \"Allocation reject rate high\", on: tam, metric: reject_rate, above: 2, severity: P2}\n  - {name: \"DB connection pool saturated\", on: tam_db, metric: pool_pct, above: 90, severity: P2}\n  - {name: \"SSI data stale\", on: ssi, metric: staleness_min, above: 25, severity: P3}\n  - {name: \"Unmatched confirmations\", on: ctm, metric: backlog, above: 900, severity: P2}\n", "trade-allocation-kafka": "# Middle-office trade allocation, with Kafka between the OMS and the allocation engine.\n# Edit this file (or the Blueprint tab in the app) to change the system being simulated.\n\nid: trade-allocation-kafka\nsystem: Middle-office trade allocation\ndescription: >\n  Executed fills flow from the OMS through a Kafka topic to the allocation engine,\n  which splits block trades across client accounts using SSI reference data,\n  then sends allocations to the confirmation platform and on to settlement.\n\nclock:\n  start: \"13:30\"\n  cutoff: \"15:00\"          # affirmation cut-off for today's trades\n\nbusiness:\n  currency: \"₹\"\n  unit: \"Cr\"\n  avg_notional: 0.6        # ₹ Cr per trade, used to show impact in money\n  produced_at: oms\n  kpis:\n    - {label: \"Unallocated\", at: tam}\n    - {label: \"Not yet affirmed\", at: ctm, cutoff: true}\n\ncomponents:\n  - id: oms\n    type: source\n    name: Order Management\n    rate_per_min: 300\n\n  - id: trades_topic\n    type: kafka_topic\n    name: trades.executed\n    partitions: 6\n    consumer_group: tam-allocator\n\n  - id: tam\n    type: service\n    name: Allocation Engine\n    capacity_per_min: 420\n    instances: 4\n    uses: [ssi, tam_db]\n\n  - id: ssi\n    type: ref_data\n    name: SSI Reference Data\n    refresh_every_min: 15\n    stale_after_min: 20\n\n  - id: tam_db\n    type: database\n    name: Allocation DB\n    pool_size: 50\n\n  - id: ctm\n    type: external_party\n    name: Confirmation Platform (CTM)\n    capacity_per_min: 520\n\n  - id: settle\n    type: external_party\n    name: Settlement (SWIFT)\n    capacity_per_min: 600\n\nflow:\n  - oms -> trades_topic -> tam -> ctm -> settle\n\nalerts:\n  - {name: \"Kafka consumer lag high\", on: trades_topic, metric: lag, above: 900, severity: P2}\n  - {name: \"Partition lag high\", on: trades_topic, metric: max_partition_lag, above: 300, severity: P2}\n  - {name: \"Allocation throughput low\", on: tam, metric: out_rate, below: 235, severity: P3}\n  - {name: \"Allocation reject rate high\", on: tam, metric: reject_rate, above: 2, severity: P2}\n  - {name: \"DB connection pool saturated\", on: tam_db, metric: pool_pct, above: 90, severity: P2}\n  - {name: \"SSI data stale\", on: ssi, metric: staleness_min, above: 25, severity: P3}\n  - {name: \"Unmatched confirmations\", on: ctm, metric: backlog, above: 900, severity: P2}\n"}, "default_blueprint": "trade-allocation-kafka", "drills": ["id: allocations-falling-behind\ntitle: Allocations falling behind\nlevel: Easy\nsummary: Allocations slow down mid-afternoon. Find out why before the affirmation cut-off.\nbrief: >\n  13:30 on a busy trading day. You are the on-call support engineer for middle-office\n  allocations. The affirmation cut-off is 15:00. The ops desk has asked you to keep an eye\n  on today's flow.\nfaults:\n  - {at: \"13:36\", component: tam, fault: instances_lost, params: {remaining: 2}}\nroot_cause: {component: tam, fault: instances_lost}\naccepted_fixes: [tam.scale_out]\nrisky_actions: [tam.restart]\nhints:\n  - {after_min: 3, text: \"Which component's output dropped first? Compare what goes in with what comes out.\"}\n  - {after_min: 7, text: \"Open the Allocation Engine and look at its healthy instance count and logs.\"}\ndebrief:\n  what_happened: >\n    Two of the four Allocation Engine pods were evicted by node memory pressure. Throughput\n    halved to about 210 trades/min while 300/min kept arriving, so the backlog grew steadily.\n  key_signal: Throughput dropped while the input rate stayed flat; the logs show pods Pending.\n  why_not_restart: >\n    A rolling restart halves capacity even further for three minutes and does not bring\n    evicted pods back. The problem is node capacity, not the process.\n  runbook:\n    - Check the healthy instance count and pod status.\n    - Reschedule the instances on healthy nodes (scale out) with approval.\n    - Watch the backlog drain and confirm the cut-off projection.\n    - Raise a problem record for node memory pressure.\n", "id: stuck-partition\ntitle: One partition stuck\nlevel: Medium\nsummary: Overall flow looks almost normal, but part of the book is not being allocated.\nbrief: >\n  13:30. Everything looked fine at the start of the afternoon. Watch the allocation flow\n  through to the 15:00 affirmation cut-off.\nfaults:\n  - {at: \"13:35\", component: trades_topic, fault: poison_message, params: {partition: 3}}\nroot_cause: {component: trades_topic, fault: poison_message}\naccepted_fixes: [trades_topic.skip_poison_message]\nrisky_actions: [tam.restart]\nhints:\n  - {after_min: 4, text: \"Total throughput is only slightly lower. Is the lag spread evenly across partitions?\"}\n  - {after_min: 9, text: \"Search the Allocation Engine logs for errors that repeat the same offset.\"}\ndebrief:\n  what_happened: >\n    A message with a new field (allocRatioV2) could not be deserialised. The consumer retried\n    it forever, so partition 3 stopped while the other five partitions kept flowing. Throughput\n    fell by only one-sixth, which is easy to miss.\n  key_signal: Lag growing on one partition only, and the same offset repeating in the error log.\n  why_not_restart: >\n    Restarting the consumer re-reads the same message and gets stuck again. The message must be\n    parked to a dead-letter topic and repaired separately.\n  runbook:\n    - Compare lag per partition, not just total lag.\n    - Find the offset in the consumer error log.\n    - Park the message to the DLQ with approval, then repair and replay it.\n    - Raise a problem record for schema compatibility between OMS and the allocator.\n", "id: missing-ssis\ntitle: Missing settlement instructions\nlevel: Medium\nsummary: Some allocations are being rejected. The allocation engine itself looks healthy.\nbrief: >\n  13:30. Allocations are flowing. The 15:00 affirmation cut-off applies. A handful of clients\n  have onboarded new accounts this week.\nfaults:\n  - {at: \"13:32\", component: ssi, fault: feed_failed, params: {last_refresh_minutes_ago: 19}}\nroot_cause: {component: ssi, fault: feed_failed}\naccepted_fixes: [ssi.force_refresh, tam.reprocess_rejected]\nrisky_actions: [tam.restart]\nhints:\n  - {after_min: 3, text: \"Rejects are not a capacity problem. What data does the allocator need for each account?\"}\n  - {after_min: 8, text: \"Check when the SSI reference data last loaded successfully.\"}\n  - {after_min: 12, text: \"After fixing the data, the trades already rejected are still waiting in the exception queue.\"}\ndebrief:\n  what_happened: >\n    The SSI feed job failed (vendor SFTP refused connections). Once the data was older than\n    20 minutes, allocations for recently changed accounts were rejected and parked in the\n    exception queue.\n  key_signal: Reject rate above 2% with normal throughput, plus SSI staleness growing and feed errors.\n  why_not_restart: Restarting the allocator changes nothing; it still reads the same stale SSI data.\n  runbook:\n    - Check the reject reason in the allocator log.\n    - Check reference data freshness and the feed job log.\n    - Re-run the feed from the secondary source with approval.\n    - Reprocess the exception queue, then confirm it is empty.\n", "id: confirmation-platform-down\ntitle: Confirmations not matching\nlevel: Medium\nsummary: Allocations are fine, yet nothing is getting affirmed. Decide what is in your control.\nbrief: >\n  13:30. Normal afternoon flow. The 15:00 affirmation cut-off applies and client service has\n  three large institutional clients waiting for confirmations.\nfaults:\n  - {at: \"13:40\", component: ctm, fault: unavailable}\nnoise:\n  - {at: \"13:43\", name: \"Disk usage 82% on report-01\", severity: P4}\nroot_cause: {component: ctm, fault: unavailable}\naccepted_fixes: [ctm.escalate_to_vendor]\nrisky_actions: [tam.restart, ctm.restart_adapter]\nhints:\n  - {after_min: 3, text: \"Follow the flow left to right. Where does the backlog start?\"}\n  - {after_min: 7, text: \"Is the failure inside our systems, or at the third party?\"}\ndebrief:\n  what_happened: >\n    The confirmation platform returned HTTP 503 for every call. Our allocations kept flowing,\n    so everything looked healthy until confirmations piled up.\n  key_signal: Unmatched confirmations growing with 100% failed calls, while internal components stay green.\n  why_not_restart: >\n    The fault was on the vendor's side. Restarting our adapter or the allocator only adds a\n    second outage. The right move is a fast, clear vendor escalation and client updates.\n  runbook:\n    - Confirm the error is coming from the vendor (HTTP 5xx), not our adapter.\n    - Raise a P1 with the vendor and record the reference.\n    - Inform client service about the confirmation delay.\n    - Monitor recovery and the cut-off projection.\n", "id: database-pool-exhausted\ntitle: Allocation engine choking\nlevel: Hard\nsummary: Several alerts fire at once. Separate the cause from the symptoms.\nbrief: >\n  13:30. Month-end week. Finance has been running reconciliation reports today. The 15:00\n  affirmation cut-off applies.\nfaults:\n  - {at: \"13:37\", component: tam_db, fault: pool_exhausted}\nnoise:\n  - {at: \"13:39\", name: \"CPU 78% on tam-allocator-2\", severity: P4}\nroot_cause: {component: tam_db, fault: pool_exhausted}\naccepted_fixes: [tam_db.kill_blocking_session]\nrisky_actions: [tam.restart, tam.scale_out]\nhints:\n  - {after_min: 3, text: \"Throughput, lag and the cut-off are all symptoms. Which alert is closest to the cause?\"}\n  - {after_min: 7, text: \"Look at the Allocation DB logs: who is holding the connections?\"}\ndebrief:\n  what_happened: >\n    A month-end reconciliation report ran a full table scan and held 46 of 50 database\n    connections. The allocator waited for connections and processed only a fifth of its\n    normal volume.\n  key_signal: DB pool at 100% and connection timeouts in the allocator logs.\n  why_not_restart: >\n    Restarting or scaling out the allocator adds more clients competing for the same\n    exhausted pool. Free the connections first.\n  runbook:\n    - Check pool usage and connection wait time.\n    - Identify the blocking session and its owner.\n    - Kill it with approval and inform the report owner.\n    - Raise a problem: move heavy reports to a replica.\n", "id: mystery\ntitle: Mystery incident\nlevel: Hard\nsummary: One of five real faults, chosen at random. No hints, no clues in the title.\nmystery: true\nbrief: >\n  13:30. Something will go wrong this afternoon. You do not know what or where.\n  The 15:00 affirmation cut-off applies.\nnoise:\n  - {at: \"13:41\", name: \"Disk usage 82% on report-01\", severity: P4}\npool:\n  - faults: [{at: \"13:38\", component: tam, fault: instances_lost, params: {remaining: 2}}]\n    root_cause: {component: tam, fault: instances_lost}\n    accepted_fixes: [tam.scale_out]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"Two allocator pods were evicted; throughput halved.\", key_signal: \"Healthy instances 2/4.\"}\n  - faults: [{at: \"13:38\", component: trades_topic, fault: poison_message, params: {partition: 1}}]\n    root_cause: {component: trades_topic, fault: poison_message}\n    accepted_fixes: [trades_topic.skip_poison_message]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"A poison message blocked one partition.\", key_signal: \"Lag on a single partition and a repeating offset in the logs.\"}\n  - faults: [{at: \"13:38\", component: ssi, fault: feed_failed, params: {last_refresh_minutes_ago: 19}}]\n    root_cause: {component: ssi, fault: feed_failed}\n    accepted_fixes: [ssi.force_refresh, tam.reprocess_rejected]\n    risky_actions: [tam.restart]\n    debrief: {what_happened: \"The SSI feed failed; allocations for changed accounts were rejected.\", key_signal: \"Reject rate up, SSI staleness growing.\"}\n  - faults: [{at: \"13:38\", component: tam_db, fault: pool_exhausted}]\n    root_cause: {component: tam_db, fault: pool_exhausted}\n    accepted_fixes: [tam_db.kill_blocking_session]\n    risky_actions: [tam.restart, tam.scale_out]\n    debrief: {what_happened: \"A report query held the DB connection pool.\", key_signal: \"Pool at 100%, connection timeouts.\"}\n  - faults: [{at: \"13:38\", component: ctm, fault: unavailable}]\n    root_cause: {component: ctm, fault: unavailable}\n    accepted_fixes: [ctm.escalate_to_vendor]\n    risky_actions: [tam.restart, ctm.restart_adapter]\n    debrief: {what_happened: \"The confirmation platform was down on the vendor side.\", key_signal: \"100% failed calls to CTM; internal systems green.\"}\n"]};
</script>
<script>
/*
 * OpsPilot Drill Simulator — simulation engine.
 *
 * Pure logic, no screen code. The same file runs in the browser and in Node tests.
 *
 * Three layers:
 *   1. Component TYPES (this file): how a kind of thing behaves, what it measures,
 *      how it can fail and how it can be fixed.
 *   2. A BLUEPRINT (YAML): which components a system has and how they connect.
 *   3. A DRILL (YAML, see session.js): which fault hits which component, and how
 *      the responder is scored.
 *
 * Every simulated tick, work flows along the blueprint's chain: the source produces
 * trades, each component takes what its capacity allows and passes it on. Faults only
 * change a component's rules (capacity, rejects, availability). Backlogs, lag, alerts
 * and missed cut-offs are not scripted — they follow from the flow.
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- helpers
  function rng(seed) { // mulberry32: deterministic random numbers, so drills are repeatable
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pad = n => String(n).padStart(2, '0');
  function parseClock(s) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim());
    if (!m) return null;
    return (+m[1]) * 3600 + (+m[2]) * 60;
  }
  function clockStr(t, withSeconds) {
    t = Math.max(0, Math.floor(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return pad(h) + ':' + pad(m) + (withSeconds ? ':' + pad(s) : '');
  }
  const fmtInt = n => Math.round(n).toLocaleString('en-IN');

  // ---------------------------------------------------------------- 1. component types
  const TYPES = {
    source: {
      label: 'Source', flow: true, required: ['rate_per_min'],
      metrics: { out_rate: 'Trades produced per minute' },
      faults: {}, actions: {},
    },
    kafka_topic: {
      label: 'Kafka topic', flow: true, required: ['partitions'],
      metrics: {
        lag: 'Total consumer lag (messages)', max_partition_lag: 'Largest single-partition lag',
        in_rate: 'Messages produced per minute', out_rate: 'Messages consumed per minute', rebalances: 'Consumer group rebalances',
      },
      faults: {
        poison_message: { label: 'Poison message blocking a partition', params: { partition: 3 } },
        rebalance_storm: { label: 'Consumer group rebalance storm', params: {} },
      },
      actions: {
        skip_poison_message: { label: 'Park stuck message to dead-letter topic', fixes: ['poison_message'] },
        tune_consumer_timeout: { label: 'Raise consumer session timeout and rejoin group', fixes: ['rebalance_storm'] },
      },
    },
    service: {
      label: 'Service', flow: true, required: ['capacity_per_min'],
      metrics: {
        in_rate: 'Trades received per minute', out_rate: 'Trades processed per minute', backlog: 'Trades waiting',
        reject_rate: 'Rejected (%)', error_rate: 'Errors and timeouts (%)', instances: 'Healthy instances',
        latency_ms: 'Processing time (ms)', rejected: 'Trades in exception queue',
      },
      faults: {
        instances_lost: { label: 'Instances lost (pods evicted)', params: { remaining: 2 } },
      },
      actions: {
        scale_out: { label: 'Scale out (reschedule instances on healthy nodes)', fixes: ['instances_lost'] },
        restart: { label: 'Rolling restart', fixes: [] },
        reprocess_rejected: { label: 'Reprocess exception queue', fixes: [] },
      },
    },
    external_party: {
      label: 'External party', flow: true, required: ['capacity_per_min'],
      metrics: { in_rate: 'Received per minute', out_rate: 'Completed per minute', backlog: 'Waiting / unmatched', error_rate: 'Failed calls (%)' },
      faults: {
        unavailable: { label: 'Vendor platform unavailable', params: {} },
      },
      actions: {
        escalate_to_vendor: { label: 'Raise P1 with vendor', fixes: ['unavailable'], delay_min: 8 },
        restart_adapter: { label: 'Restart our adapter', fixes: [] },
      },
    },
    ref_data: {
      label: 'Reference data', flow: false, required: ['refresh_every_min', 'stale_after_min'],
      metrics: { staleness_min: 'Minutes since last successful load' },
      faults: {
        feed_failed: { label: 'Upstream feed job failing', params: { last_refresh_minutes_ago: 18 } },
      },
      actions: {
        force_refresh: { label: 'Re-run feed from secondary source', fixes: ['feed_failed'] },
      },
    },
    database: {
      label: 'Database', flow: false, required: ['pool_size'],
      metrics: { pool_used: 'Connections in use', pool_pct: 'Pool used (%)', wait_ms: 'Connection wait (ms)' },
      faults: {
        pool_exhausted: { label: 'Connection pool exhausted by a long-running query', params: {} },
      },
      actions: {
        kill_blocking_session: { label: 'Kill blocking session', fixes: ['pool_exhausted'] },
      },
    },
  };

  // ---------------------------------------------------------------- 2. blueprint parsing + validation
  function parseBlueprint(text, yaml) {
    const errors = [];
    let bp;
    try { bp = yaml.load(text); } catch (e) { return { errors: ['YAML syntax: ' + (e.reason || e.message) + (e.mark ? ` (line ${e.mark.line + 1})` : '')] }; }
    if (!bp || typeof bp !== 'object') return { errors: ['The blueprint is empty.'] };
    return validateBlueprint(bp);
  }

  function validateBlueprint(bp) {
    const errors = [];
    const comps = Array.isArray(bp.components) ? bp.components : [];
    if (!bp.system) errors.push('Missing "system" (the system name).');
    if (!comps.length) errors.push('Missing "components" list.');
    const ids = new Map();
    comps.forEach((c, i) => {
      const where = `components[${i}]` + (c && c.id ? ` (${c.id})` : '');
      if (!c || typeof c !== 'object') { errors.push(`${where}: must be an object.`); return; }
      if (!c.id || !/^[a-z][a-z0-9_]*$/.test(c.id)) errors.push(`${where}: "id" must be lowercase letters, digits or _ and start with a letter.`);
      else if (ids.has(c.id)) errors.push(`${where}: duplicate id "${c.id}".`);
      else ids.set(c.id, c);
      const T = TYPES[c.type];
      if (!T) { errors.push(`${where}: unknown type "${c.type}". Known types: ${Object.keys(TYPES).join(', ')}.`); return; }
      T.required.forEach(k => {
        if (typeof c[k] !== 'number' || !(c[k] > 0)) errors.push(`${where}: "${k}" is required and must be a positive number for type ${c.type}.`);
      });
      if (c.type === 'kafka_topic' && c.partitions > 64) errors.push(`${where}: at most 64 partitions.`);
      if (c.type === 'service' && c.instances !== undefined && !(Number.isInteger(c.instances) && c.instances > 0)) errors.push(`${where}: "instances" must be a positive whole number.`);
      if (c.uses !== undefined && !Array.isArray(c.uses)) errors.push(`${where}: "uses" must be a list of component ids.`);
    });
    comps.forEach(c => (c && Array.isArray(c.uses) ? c.uses : []).forEach(u => {
      const d = ids.get(u);
      if (!d) errors.push(`${c.id}: uses unknown component "${u}".`);
      else if (TYPES[d.type] && TYPES[d.type].flow) errors.push(`${c.id}: can only "use" reference data or databases, not ${d.type} "${u}".`);
      else if (c.type !== 'service') errors.push(`${c.id}: only services can "use" other components.`);
    }));

    // flow chains: "a -> b -> c"
    const chains = [];
    const seen = new Set();
    (Array.isArray(bp.flow) ? bp.flow : []).forEach((line, i) => {
      const parts = String(line).split('->').map(s => s.trim()).filter(Boolean);
      if (parts.length < 2) { errors.push(`flow[${i}]: needs at least two components joined by "->".`); return; }
      const chain = [];
      parts.forEach((p, j) => {
        const c = ids.get(p);
        if (!c) { errors.push(`flow[${i}]: unknown component "${p}".`); return; }
        if (!TYPES[c.type] || !TYPES[c.type].flow) { errors.push(`flow[${i}]: ${c.type} "${p}" cannot be in the flow; attach it to a service with "uses".`); return; }
        if (seen.has(p)) { errors.push(`flow[${i}]: "${p}" appears more than once (only straight chains are supported in this version).`); return; }
        if (j === 0 && c.type !== 'source') errors.push(`flow[${i}]: a chain must start with a source, not ${c.type} "${p}".`);
        if (j > 0 && c.type === 'source') errors.push(`flow[${i}]: source "${p}" can only be first in a chain.`);
        if (c.type === 'kafka_topic' && j === parts.length - 1) errors.push(`flow[${i}]: Kafka topic "${p}" needs a consumer after it.`);
        if (c.type === 'kafka_topic' && j > 0 && ids.get(parts[j - 1]) && ids.get(parts[j - 1]).type === 'kafka_topic') errors.push(`flow[${i}]: two Kafka topics in a row need a service between them.`);
        seen.add(p); chain.push(p);
      });
      chains.push(chain);
    });
    if (!chains.length) errors.push('Missing "flow" (for example: - oms -> trades_topic -> tam).');
    comps.forEach(c => { if (c && TYPES[c.type] && TYPES[c.type].flow && c.id && !seen.has(c.id)) errors.push(`${c.id}: is not connected in any flow.`); });

    // clock + business
    const clock = bp.clock || {};
    const start = parseClock(clock.start || '13:30'), cutoff = parseClock(clock.cutoff || '15:00');
    if (start === null) errors.push('clock.start must look like "13:30".');
    if (cutoff === null) errors.push('clock.cutoff must look like "15:00".');
    if (start !== null && cutoff !== null && cutoff <= start + 600) errors.push('clock.cutoff must be at least 10 minutes after clock.start.');
    const biz = bp.business || {};
    const kpis = Array.isArray(biz.kpis) ? biz.kpis : [];
    kpis.forEach((k, i) => {
      if (!k || !k.label) errors.push(`business.kpis[${i}]: needs a "label".`);
      if (!k || !ids.has(k.at)) errors.push(`business.kpis[${i}]: "at" must be a component id.`);
    });
    if (kpis.filter(k => k && k.cutoff).length > 1) errors.push('Only one business KPI can be marked "cutoff: true".');

    // alert rules
    const alerts = Array.isArray(bp.alerts) ? bp.alerts : [];
    alerts.forEach((a, i) => {
      const where = `alerts[${i}]` + (a && a.name ? ` (${a.name})` : '');
      if (!a || !a.name) { errors.push(`${where}: needs a "name".`); return; }
      const c = ids.get(a.on);
      if (!c) { errors.push(`${where}: "on" must be a component id.`); return; }
      const T = TYPES[c.type];
      if (T && !T.metrics[a.metric]) errors.push(`${where}: ${c.type} has no metric "${a.metric}". Available: ${Object.keys(T.metrics).join(', ')}.`);
      if (typeof a.above !== 'number' && typeof a.below !== 'number') errors.push(`${where}: needs "above" or "below" as a number.`);
      if (a.severity && !/^P[1-4]$/.test(a.severity)) errors.push(`${where}: severity must be P1–P4.`);
    });

    if (errors.length) return { errors };
    const sourceRate = comps.filter(c => c.type === 'source').reduce((s, c) => s + c.rate_per_min, 0);
    const model = {
      id: bp.id || 'blueprint', system: bp.system, description: bp.description || '',
      start, cutoff, components: comps, byId: Object.fromEntries(comps.map(c => [c.id, c])), chains,
      alerts: alerts.map((a, i) => ({ id: 'rule' + i, severity: 'P3', ...a })),
      business: {
        currency: biz.currency || '₹', unit: biz.unit || 'Cr', avg_notional: typeof biz.avg_notional === 'number' ? biz.avg_notional : 0.5,
        produced_at: biz.produced_at || (comps.find(c => c.type === 'source') || {}).id,
        kpis, tolerance_trades: typeof biz.tolerance_trades === 'number' ? biz.tolerance_trades : sourceRate * 0.5,
      },
      raw: bp,
    };
    return { errors: [], blueprint: model };
  }

  // ---------------------------------------------------------------- 3. the simulator
  function Simulator(bp, opts) {
    opts = opts || {};
    this.bp = bp;
    this.rand = rng(opts.seed || 42);
    this.t = bp.start - 30 * 60;       // warm up for 30 simulated minutes
    this.alerts = []; this.alertSeq = 1000; this.events = [];
    this.history = { t: [] }; this.lastSample = -Infinity;
    this.c = {};
    bp.components.forEach(def => { this.c[def.id] = this._initState(def); });
    bp.chains.forEach(chain => chain.forEach((id, i) => {
      this.c[id].up = i > 0 ? chain[i - 1] : null;
      this.c[id].down = i < chain.length - 1 ? chain[i + 1] : null;
    }));
    this.ruleState = {};
    this.biz = { produced: 0, prevCut: 0, netRate: 0 };
    this.warmup(bp.start - this.t);
  }

  Simulator.prototype._initState = function (def) {
    const s = { def, type: def.type, fault: null, logs: [], hist: {}, rates: {}, tot: { in: 0, out: 0, rej: 0, err: 0 }, win: { in: 0, out: 0, rej: 0, err: 0, n: 0 } };
    if (def.type === 'kafka_topic') { s.parts = new Array(def.partitions).fill(0); s.blocked = -1; s.rebalances = 0; s.offsets = new Array(def.partitions).fill(0).map((_, i) => 884000 + i * 3121); s.dlq = 0; }
    if (def.type === 'service') { s.inbox = 0; s.retry = 0; s.rejected = 0; s.configured = def.instances || 4; s.instances = s.configured; s.restartUntil = -1; }
    if (def.type === 'external_party') { s.inbox = 0; s.recoverAt = -1; s.adapterDownUntil = -1; }
    if (def.type === 'ref_data') { s.lastRefresh = this.t; s.records = 48210; }
    if (def.type === 'database') { s.used = Math.round(def.pool_size * 0.28); }
    return s;
  };

  Simulator.prototype.now = function () { return this.t; };
  Simulator.prototype.time = function (sec) { return clockStr(this.t, sec); };

  Simulator.prototype.log = function (id, level, msg) {
    const s = this.c[id];
    s.logs.push({ t: this.t, level, msg, line: `${clockStr(this.t, true)} ${level.padEnd(5)} [${id}] ${msg}` });
    if (s.logs.length > 400) s.logs.splice(0, s.logs.length - 400);
  };
  Simulator.prototype.chance = function (p) { return this.rand() < p; };

  // capacity of a service after faults and dependencies are applied
  Simulator.prototype.serviceFactor = function (s) {
    let f = s.instances / s.configured;
    if (this.t < s.restartUntil) f *= 0.5;
    (s.def.uses || []).forEach(u => { const d = this.c[u]; if (d.type === 'database' && d.fault && d.fault.type === 'pool_exhausted') f *= 0.2; });
    const up = s.up && this.c[s.up];
    if (up && up.type === 'kafka_topic' && up.fault && up.fault.type === 'rebalance_storm') f *= 0.35;
    return f;
  };
  Simulator.prototype.staleRefs = function (s) {
    return (s.def.uses || []).map(u => this.c[u]).filter(d => d.type === 'ref_data' && this.staleness(d) > d.def.stale_after_min);
  };
  Simulator.prototype.staleness = function (d) { return (this.t - d.lastRefresh) / 60; };

  Simulator.prototype.accept = function (id, n) {
    const s = this.c[id];
    s.tot.in += n; s.win.in += n;
    if (s.type === 'kafka_topic') {
      const per = n / s.parts.length;
      for (let i = 0; i < s.parts.length; i++) { s.parts[i] += per; s.offsets[i] += per; }
    } else if (s.type === 'service' || s.type === 'external_party') s.inbox += n;
  };

  Simulator.prototype.step = function (dt) {
    const bp = this.bp;
    this.t += dt;
    // reference data refresh schedule
    Object.values(this.c).filter(s => s.type === 'ref_data').forEach(s => {
      const due = this.t - s.lastRefresh >= s.def.refresh_every_min * 60;
      if (!due) return;
      if (s.fault && s.fault.type === 'feed_failed') {
        if (!s.lastFailLog || this.t - s.lastFailLog >= 300) {
          s.lastFailLog = this.t;
          this.log(s.def.id, 'ERROR', `${s.def.name} feed job FAILED: sftp://feeds.vendor.example:22 connection refused (attempt ${Math.floor((this.t - s.fault.since) / 300) + 1})`);
        }
      } else {
        s.lastRefresh = this.t; s.records += Math.floor(this.rand() * 40);
        this.log(s.def.id, 'INFO', `${s.def.name} loaded: ${fmtInt(s.records)} records`);
      }
    });
    // databases
    Object.values(this.c).filter(s => s.type === 'database').forEach(s => {
      const P = s.def.pool_size;
      if (s.fault && s.fault.type === 'pool_exhausted') s.used = P;
      else s.used = Math.max(2, Math.min(P, Math.round(P * (0.24 + this.rand() * 0.1))));
    });
    // work flows along each chain
    bp.chains.forEach(chain => chain.forEach(id => this._process(id, dt)));
    // vendor recovery after escalation
    Object.values(this.c).forEach(s => {
      if (s.type === 'external_party' && s.recoverAt > 0 && this.t >= s.recoverAt) {
        s.recoverAt = -1; this.clearFault(s.def.id, 'Vendor reports platform restored');
        this.log(s.def.id, 'INFO', `${s.def.name} responding normally again (vendor incident closed)`);
      }
    });
    this._chatter(dt);
    this._rates(dt);
    this._business(dt);
    this._evalAlerts();
    if (this.t - this.lastSample >= 60) { this.lastSample = this.t; this._sample(); }
  };

  Simulator.prototype._process = function (id, dt) {
    const s = this.c[id], def = s.def, min = dt / 60;
    if (s.type === 'source') {
      const n = def.rate_per_min * min * (0.94 + this.rand() * 0.12);
      this.biz.produced += n; s.tot.out += n; s.win.out += n;
      if (s.down) this.accept(s.down, n);
      return;
    }
    if (s.type === 'kafka_topic') return; // the consumer pulls from the topic
    if (s.type === 'service') {
      const up = s.up && this.c[s.up];
      const fromKafka = up && up.type === 'kafka_topic';
      let cap = def.capacity_per_min * this.serviceFactor(s) * min;
      const take = [];
      // retries from the exception queue are processed first
      const r = Math.min(s.retry, cap); s.retry -= r; cap -= r; take.push(r);
      let got = r;
      if (fromKafka) {
        // equal share per partition; a blocked partition gives nothing
        const open = up.parts.map((v, i) => i === up.blocked ? 0 : v);
        let remaining = cap;
        for (let pass = 0; pass < 3 && remaining > 1e-9; pass++) {
          const active = open.map((v, i) => [v, i]).filter(([v]) => v > 1e-9);
          if (!active.length) break;
          const share = remaining / active.length;
          active.forEach(([v, i]) => { const x = Math.min(v, share); open[i] -= x; up.parts[i] -= x; remaining -= x; got += x; });
        }
        const used = got - r; up.tot.out += used; up.win.out += used;
      } else {
        const x = Math.min(s.inbox, cap); s.inbox -= x; got += x;
      }
      const stale = this.staleRefs(s).length > 0;
      const rejFrac = stale ? 0.08 : 0;
      const rej = got * rejFrac;
      s.rejected += rej; s.tot.rej += rej; s.win.rej += rej;
      const ok = got - rej;
      s.tot.out += ok; s.win.out += ok;
      const dbBad = (def.uses || []).some(u => this.c[u].fault && this.c[u].fault.type === 'pool_exhausted');
      const errs = dbBad ? got * 0.06 + 0.5 : 0; s.win.err += errs;
      if (s.down) this.accept(s.down, ok);
      return;
    }
    if (s.type === 'external_party') {
      const unavailable = (s.fault && s.fault.type === 'unavailable') || this.t < s.adapterDownUntil;
      const cap = unavailable ? 0 : def.capacity_per_min * min;
      const x = Math.min(s.inbox, cap); s.inbox -= x;
      s.tot.out += x; s.win.out += x;
      if (unavailable) s.win.err += Math.max(1, s.inbox > 0 ? 3 : 1);
      if (s.down) this.accept(s.down, x);
    }
  };

  // realistic log lines, driven by the current state (never by the drill script)
  Simulator.prototype._chatter = function (dt) {
    const p = dt / 30; // ~one routine line per component every 30 simulated seconds
    Object.values(this.c).forEach(s => {
      const id = s.def.id, name = s.def.name, f = s.fault && s.fault.type;
      if (s.type === 'source' && this.chance(p)) {
        const tgt = s.down ? this.c[s.down].def.name : 'downstream';
        this.log(id, 'INFO', `Published ${Math.round(this.rates(id).out_rate / 2)} fills to ${tgt} (batch ${88000 + Math.floor(this.t / 30)})`);
      }
      if (s.type === 'kafka_topic') {
        if (s.blocked >= 0 && this.chance(p * 0.6)) this.log(id, 'WARN', `Consumer offset for ${name}-${s.blocked} not advancing at ${Math.floor(s.stuckOffset)} (lag ${fmtInt(s.parts[s.blocked])})`);
        if (f === 'rebalance_storm' && this.chance(p * 1.4)) { s.rebalances++; this.log(id, 'WARN', `Group ${s.def.consumer_group || 'consumers'} rebalancing (generation ${400 + s.rebalances}): member left, session timeout 10000ms`); }
        if (!f && this.chance(p * 0.3)) this.log(id, 'INFO', `Group ${s.def.consumer_group || 'consumers'} stable: ${this._consumerCount(s)} members, ${s.parts.length} partitions`);
      }
      if (s.type === 'service') {
        const up = s.up && this.c[s.up];
        if (up && up.type === 'kafka_topic' && up.blocked >= 0 && this.chance(p * 1.5))
          this.log(id, 'ERROR', `Failed to deserialize record ${up.def.name}-${up.blocked}@${Math.floor(up.stuckOffset)}: Unrecognized field "allocRatioV2" (class TradeEvent) — retrying`);
        if (up && up.type === 'kafka_topic' && up.fault && up.fault.type === 'rebalance_storm' && this.chance(p))
          this.log(id, 'WARN', `Partitions revoked [${[0, 1, 2].join(', ')}]; rejoining group ${up.def.consumer_group || ''}`.trim());
        if (f === 'instances_lost' && this.chance(p * 0.8))
          this.log(id, 'WARN', `Only ${s.instances}/${s.configured} ${name} instances ready; pods ${id}-${s.instances + 1}, ${id}-${s.configured} Pending (node memory pressure)`);
        if ((s.def.uses || []).some(u => this.c[u].fault && this.c[u].fault.type === 'pool_exhausted') && this.chance(p * 1.6))
          this.log(id, 'ERROR', `HikariPool-1 - Connection is not available, request timed out after 30000ms (block BLK-${71000 + Math.floor(this.rand() * 900)})`);
        this.staleRefs(s).forEach(r => { if (this.chance(p * 1.4)) this.log(id, 'ERROR', `Allocation rejected for block BLK-${71000 + Math.floor(this.rand() * 900)}: no SSI for account ACC-${48000 + Math.floor(this.rand() * 900)} in ${r.def.name}`); });
        if (this.t < s.restartUntil && this.chance(p)) this.log(id, 'INFO', `Rolling restart in progress: instance ${1 + Math.floor(this.rand() * s.configured)}/${s.configured} restarting`);
        if (this.chance(p * 0.7)) {
          const r = this.rates(id);
          this.log(id, 'INFO', `Processed ${Math.round(r.out_rate / 2)} trades in last 30s (backlog ${fmtInt(this.metric(id, 'backlog'))})`);
        }
      }
      if (s.type === 'external_party') {
        if ((f === 'unavailable' || this.t < s.adapterDownUntil) && this.chance(p * 1.6)) this.log(id, 'ERROR', `${name} API POST /v1/messages returned 503 Service Unavailable (retry ${1 + Math.floor(this.rand() * 5)}/5)`);
        else if (!f && this.chance(p * 0.6)) this.log(id, 'INFO', `${name}: ${Math.round(this.rates(id).out_rate / 2)} messages acknowledged in last 30s`);
      }
      if (s.type === 'database') {
        if (f === 'pool_exhausted' && this.chance(p)) this.log(id, 'WARN', `Session 482 (month_end_recon_report) running ${Math.round((this.t - s.fault.since) / 60) + 14} min, holding ${s.def.pool_size - 4} connections`);
        else if (this.chance(p * 0.25)) this.log(id, 'INFO', `Pool active ${s.used}/${s.def.pool_size}, idle ${s.def.pool_size - s.used}`);
      }
    });
  };
  Simulator.prototype._consumerCount = function (k) {
    const svc = k.down && this.c[k.down];
    return svc && svc.type === 'service' ? svc.instances : 1;
  };

  Simulator.prototype._rates = function (dt) {
    Object.values(this.c).forEach(s => {
      const w = s.win; w.n += dt;
      if (w.n < 30) return; // rates over a rolling 30-second window
      const k = 60 / w.n, a = 0.5;
      const prev = s.rates;
      const nr = { in_rate: w.in * k, out_rate: w.out * k, rej_rate: w.rej * k, err_rate: w.err * k };
      s.rates = prev.n ? Object.fromEntries(Object.keys(nr).map(x => [x, prev[x] * (1 - a) + nr[x] * a])) : nr;
      s.rates.n = 1;
      s.win = { in: 0, out: 0, rej: 0, err: 0, n: 0 };
    });
  };
  Simulator.prototype.rates = function (id) { const r = this.c[id].rates; return r.n ? r : { in_rate: 0, out_rate: 0, rej_rate: 0, err_rate: 0 }; };

  Simulator.prototype.metric = function (id, m) {
    const s = this.c[id], r = this.rates(id);
    switch (s.type) {
      case 'source': return m === 'out_rate' ? r.out_rate : 0;
      case 'kafka_topic':
        if (m === 'lag') return s.parts.reduce((a, b) => a + b, 0);
        if (m === 'max_partition_lag') return Math.max(...s.parts);
        if (m === 'in_rate') return r.in_rate;
        if (m === 'out_rate') return r.out_rate;
        if (m === 'rebalances') return s.rebalances;
        return 0;
      case 'service': {
        const up = s.up && this.c[s.up];
        const backlog = (up && up.type === 'kafka_topic' ? 0 : s.inbox) + s.retry;
        const processed = r.out_rate + r.rej_rate;
        if (m === 'backlog') return backlog;
        if (m === 'in_rate') return up && up.type === 'kafka_topic' ? r.out_rate + r.rej_rate : r.in_rate;
        if (m === 'out_rate') return r.out_rate;
        if (m === 'reject_rate') return processed > 1 ? 100 * r.rej_rate / processed : 0;
        if (m === 'error_rate') return processed > 1 ? Math.min(100, 100 * r.err_rate / processed) : (r.err_rate > 0 ? 100 : 0);
        if (m === 'instances') return s.instances;
        if (m === 'rejected') return s.rejected;
        if (m === 'latency_ms') { const f = this.serviceFactor(s); return Math.round(140 / Math.max(f, 0.05) * (0.95 + this.rand() * 0.1)); }
        return 0;
      }
      case 'external_party':
        if (m === 'backlog') return s.inbox;
        if (m === 'in_rate') return r.in_rate;
        if (m === 'out_rate') return r.out_rate;
        if (m === 'error_rate') return (s.fault && s.fault.type === 'unavailable') || this.t < s.adapterDownUntil ? 100 : 0;
        return 0;
      case 'ref_data': return m === 'staleness_min' ? this.staleness(s) : 0;
      case 'database':
        if (m === 'pool_used') return s.used;
        if (m === 'pool_pct') return 100 * s.used / s.def.pool_size;
        if (m === 'wait_ms') return s.fault && s.fault.type === 'pool_exhausted' ? 30000 : 2 + Math.round(this.rand() * 6);
        return 0;
    }
    return 0;
  };

  // business KPIs: trades produced but not yet past a stage
  Simulator.prototype.kpi = function (k) {
    const s = this.c[k.at];
    const passed = s.type === 'source' ? s.tot.out : s.tot.out;
    const trades = Math.max(0, this.biz.produced - passed);
    return { label: k.label, trades, notional: trades * this.bp.business.avg_notional, cutoff: !!k.cutoff };
  };
  Simulator.prototype.kpis = function () { return this.bp.business.kpis.map(k => this.kpi(k)); };
  Simulator.prototype.cutoffKpi = function () { const k = this.bp.business.kpis.find(x => x.cutoff); return k ? this.kpi(k) : null; };
  Simulator.prototype._business = function (dt) {
    const k = this.cutoffKpi(); if (!k) return;
    const net = (k.trades - this.biz.prevCut) / (dt / 60);
    this.biz.prevCut = k.trades;
    this.biz.netRate = this.biz.netRate * 0.9 + net * 0.1;
  };
  // will the cut-off KPI be back to normal before the cut-off?
  Simulator.prototype.cutoffRisk = function () {
    const k = this.cutoffKpi(); if (!k) return { atRisk: false };
    const tol = this.bp.business.tolerance_trades, left = (this.bp.cutoff - this.t) / 60;
    if (k.trades <= tol) return { atRisk: false, eta: null };
    if (this.biz.netRate >= -1) return { atRisk: true, eta: null };
    const eta = (k.trades - tol) / -this.biz.netRate;
    return { atRisk: eta > left, eta };
  };

  Simulator.prototype._evalAlerts = function () {
    if (this.t < this.bp.start) return; // no paging during warm-up
    const rules = this.bp.alerts.slice();
    const k = this.cutoffKpi();
    if (k) rules.push({ id: 'cutoff', name: `${k.label} — cut-off at risk`, on: this.bp.business.kpis.find(x => x.cutoff).at, severity: 'P1', builtin: true });
    rules.forEach(rule => {
      let val, firing;
      if (rule.builtin) { val = k.trades; firing = this.cutoffRisk().atRisk && this.t < this.bp.cutoff; }
      else {
        val = this.metric(rule.on, rule.metric);
        firing = typeof rule.above === 'number' ? val > rule.above : val < rule.below;
      }
      const st = this.ruleState[rule.id] || (this.ruleState[rule.id] = { since: null, clearSince: null, alert: null });
      if (firing) {
        st.clearSince = null;
        if (st.since === null) st.since = this.t;
        if (!st.alert && this.t - st.since >= 60) { // sustained for 1 simulated minute
          const a = { id: 'ALRT-' + (++this.alertSeq), rule: rule.id, name: rule.name, severity: rule.severity || 'P3', on: rule.on, metric: rule.metric || 'business', threshold: rule.builtin ? 'projected past cut-off' : (typeof rule.above === 'number' ? '> ' + rule.above : '< ' + rule.below), value: val, firedAt: this.t, resolvedAt: null, status: 'FIRING' };
          st.alert = a; this.alerts.unshift(a);
          this.events.push({ t: this.t, kind: 'alert', text: `${a.id} ${a.severity} ${a.name} fired` });
        }
        if (st.alert) st.alert.value = val;
      } else {
        st.since = null;
        if (st.alert) {
          if (st.clearSince === null) st.clearSince = this.t;
          if (this.t - st.clearSince >= 120) { // clear for 2 minutes before resolving
            st.alert.status = 'RESOLVED'; st.alert.resolvedAt = this.t;
            this.events.push({ t: this.t, kind: 'alert', text: `${st.alert.id} ${st.alert.name} resolved` });
            st.alert = null;
          }
        }
      }
    });
  };
  Simulator.prototype.addExternalAlert = function (a) { // e.g. unrelated noise in a drill
    const al = { id: 'ALRT-' + (++this.alertSeq), firedAt: this.t, resolvedAt: null, status: 'FIRING', severity: 'P4', metric: 'external', value: '', threshold: '', ...a };
    this.alerts.unshift(al); return al;
  };

  Simulator.prototype._sample = function () {
    this.history.t.push(this.t);
    Object.values(this.c).forEach(s => {
      Object.keys(TYPES[s.type].metrics).forEach(m => {
        const h = s.hist[m] || (s.hist[m] = []);
        h.push(this.metric(s.def.id, m));
      });
    });
    const k = this.cutoffKpi();
    (this.history.cut || (this.history.cut = [])).push(k ? k.notional : 0);
    if (this.history.t.length > 240) {
      this.history.t.shift(); this.history.cut.shift();
      Object.values(this.c).forEach(s => Object.values(s.hist).forEach(h => h.shift()));
    }
  };

  Simulator.prototype.warmup = function (secs) { const step = 5; for (let x = 0; x < secs; x += step) this.step(step); };

  Simulator.prototype.health = function (id) {
    const s = this.c[id], m = k => this.metric(id, k);
    const rate = this.bp.components.filter(c => c.type === 'source').reduce((a, c) => a + c.rate_per_min, 0) || 1;
    switch (s.type) {
      case 'source': return 'ok';
      case 'kafka_topic': { const L = m('lag'), P = m('max_partition_lag'); return L > rate * 8 || P > rate * 2 ? 'bad' : L > rate * 2 || P > rate * 0.8 ? 'warn' : 'ok'; }
      case 'service': {
        if (s.instances < s.configured || m('error_rate') > 2 || m('reject_rate') > 5) return m('reject_rate') > 5 || this.serviceFactor(s) < 0.3 ? 'bad' : 'warn';
        if (m('reject_rate') > 1 || s.rejected > 5 || m('backlog') > rate * 2) return 'warn';
        return 'ok';
      }
      case 'external_party': return m('error_rate') > 50 ? 'bad' : m('backlog') > rate * 2 ? 'warn' : 'ok';
      case 'ref_data': { const st = m('staleness_min'); return st > s.def.stale_after_min * 1.5 ? 'bad' : st > s.def.stale_after_min ? 'warn' : 'ok'; }
      case 'database': { const p = m('pool_pct'); return p > 95 ? 'bad' : p > 85 ? 'warn' : 'ok'; }
    }
    return 'ok';
  };

  // ---------------------------------------------------------------- faults and actions
  Simulator.prototype.injectFault = function (id, type, params) {
    const s = this.c[id];
    if (!s) throw new Error(`No component "${id}"`);
    const F = TYPES[s.type].faults[type];
    if (!F) throw new Error(`${s.type} "${id}" has no fault "${type}"`);
    const p = { ...F.params, ...(params || {}) };
    s.fault = { type, params: p, since: this.t };
    if (type === 'poison_message') { s.blocked = Math.min(s.parts.length - 1, Math.max(0, p.partition | 0)); s.stuckOffset = s.offsets[s.blocked] - s.parts[s.blocked]; }
    if (type === 'instances_lost') s.instances = Math.max(1, Math.min(s.configured - 1, p.remaining | 0));
    if (type === 'feed_failed') s.lastRefresh = Math.min(s.lastRefresh, this.t - p.last_refresh_minutes_ago * 60);
    if (type === 'pool_exhausted') this.log(id, 'WARN', `Long-running query started: session 482 (month_end_recon_report), full table scan on ALLOCATION_HIST`);
    this.events.push({ t: this.t, kind: 'fault', hidden: true, text: `Fault injected: ${F.label} on ${s.def.name}` });
    return s.fault;
  };
  Simulator.prototype.clearFault = function (id, why) {
    const s = this.c[id]; if (!s.fault) return;
    this.events.push({ t: this.t, kind: 'fixed', text: `${s.def.name}: ${why}` });
    if (s.type === 'kafka_topic') s.blocked = -1;
    s.fault = null;
  };
  Simulator.prototype.actionsFor = function (id) {
    const s = this.c[id]; return s ? TYPES[s.type].actions : {};
  };
  Simulator.prototype.applyAction = function (id, action) {
    const s = this.c[id];
    if (!s) return { ok: false, message: `No component "${id}"` };
    const A = TYPES[s.type].actions[action];
    if (!A) return { ok: false, message: `${s.def.name} has no action "${action}"` };
    const f = s.fault && s.fault.type, name = s.def.name;
    let message, effect = 'none';
    switch (action) {
      case 'skip_poison_message':
        if (f === 'poison_message') { s.dlq++; message = `Parked ${name}-${s.blocked}@${Math.floor(s.stuckOffset)} to ${name}.DLQ; partition ${s.blocked} consuming again. 1 trade needs manual repair.`; this.log(id, 'INFO', `Offset ${Math.floor(s.stuckOffset)} on partition ${s.blocked} skipped and parked to DLQ`); this.clearFault(id, 'stuck message parked to DLQ'); effect = 'fixed'; }
        else message = 'No stuck offset found on any partition. Nothing parked.';
        break;

 * OpsPilot Drill Simulator — drill session.
