# An equity exchange: members (brokers and market makers) trade through the exchange's
# order entry gateway, order validation and matching engine. Listed companies (issuers) keep the instrument
# master current through corporate actions. Trades go to the clearing corporation over
# an internal Kafka bus; market data and drop copies go out to subscribers and members.

id: exchange
system: Equity exchange trading platform
description: >
  Three brokers and two market makers connect over FIX. Orders pass session and throttle
  checks at the order entry gateway (OEGW), validation against the instrument master, and price-time
  matching. Trades reach the clearing corporation before the clearing cut-off.

clock:
  start: "14:30"
  cutoff: "15:30"
  cutoff_label: Clearing cut-off

business:
  currency: "₹"
  unit: "Cr"
  unit_name: orders
  avg_notional: 0.04          # about ₹4 lakh per order
  kpis:
    - {label: "Orders waiting to match", at: matching}
    - {label: "Trades not with clearing", at: clearing, cutoff: true}

# Kinds: define each kind of member once. A new broker or market maker is then one line under
# components; it is connected to the gateway and drawn in the Members box automatically.
kinds:
  broker:       {type: source, role: Broker, connects_to: fix_gateway, group: Members, defaults: {rate_per_min: 300}}
  market_maker: {type: source, role: Market maker, connects_to: fix_gateway, group: Members, defaults: {rate_per_min: 450}}

components:
  # members (FIX over TCP to our order entry gateway)
  - {id: broker_a, kind: broker, name: Kestrel Securities, session: KEST01, rate_per_min: 420}
  - {id: broker_b, kind: broker, name: Narmada Capital, session: NRMD02}
  - {id: broker_c, kind: broker, name: Bluewater Broking, session: BLUW03, rate_per_min: 230}
  - {id: mm_1, kind: market_maker, name: Arcline Markets, session: ARCL11, rate_per_min: 600}
  - {id: mm_2, kind: market_maker, name: Delta Quotes, session: DLTQ12}

  # exchange trading system
  - {id: fix_gateway, type: service, role: Exchange, name: Order Entry Gateway (OEGW), capacity_per_min: 2700, instances: 3}
  - {id: risk, type: service, role: Exchange, name: Order Validation, capacity_per_min: 2800, instances: 4, uses: [instrument_master], rejects: return}
  - {id: matching, type: service, role: Exchange, name: Matching Engine, capacity_per_min: 3000, instances: 2, uses: [orderbook_db]}
  - {id: instrument_master, type: ref_data, name: Instrument Master, refresh_every_min: 10, stale_after_min: 30}
  - {id: orderbook_db, type: database, name: Order Book Store, pool_size: 80, big_table: ORDER_HIST}

  # listed companies
  - {id: issuer_1, type: issuer, role: Issuer, name: Mahanadi Power Ltd, symbol: MAHPWR, feeds: instrument_master}
  - {id: issuer_2, type: issuer, role: Issuer, name: Konark Steel Ltd, symbol: KONSTL, feeds: instrument_master}
  - {id: issuer_3, type: issuer, role: Issuer, name: Chilika Foods Ltd, symbol: CHLKFD, feeds: instrument_master}

  # post-trade
  - {id: trade_bus, type: kafka_topic, name: trades.matched, partitions: 8, consumer_group: clearing-feed}
  - {id: clearing_feed, type: service, role: Exchange, name: Clearing Feed Adapter, capacity_per_min: 2600, instances: 2}
  - {id: clearing, type: external_party, role: Clearing corporation, name: Clearing Corporation, capacity_per_min: 3600}

  # market surveillance: every order event and trade from matching, on its own Kafka topic
  - {id: surv_bus, type: kafka_topic, name: matching.events, partitions: 8, consumer_group: surveillance}
  - {id: surveillance, type: service, role: Surveillance, name: Market Surveillance, capacity_per_min: 3000, instances: 2}

  # market data and drop copy
  - {id: md_publisher, type: service, role: Exchange, name: Market Data Adaptor, capacity_per_min: 3000, instances: 2}
  - {id: md_vendors, type: external_party, role: Subscribers, name: Market Data Vendors, capacity_per_min: 3200}
  - {id: drop_copy, type: service, role: Exchange, name: Drop Copy Service, capacity_per_min: 3000, instances: 2}

flow:
  # members connect through their kind (connects_to: fix_gateway)
  - fix_gateway -> risk -> matching -> trade_bus -> clearing_feed -> clearing
  - matching -> md_publisher -> md_vendors
  - matching -> drop_copy
  - matching -> surv_bus -> surveillance

# ---------------------------------------------------------------- follow an order
# Tables written by orders as they move, and the journeys a learner can follow hop by hop.
# Placeholders in {braces} are filled from the order (order_id, clordid, trade_id, exec_id, seq, sending_time,
# partition, offset ...). FIX messages are shown with | in place of the SOH separator.
tables:
  orders: {db: orderbook_db, columns: [order_id, clordid, member, symbol, side, qty, price, filled_qty, status, reject_reason, created_at, updated_at]}
  trades: {db: orderbook_db, columns: [trade_id, order_id, symbol, side, qty, price, counterparty, clearing_status, traded_at]}

journeys:
  - id: filled
    name: Buy order fully filled against a market maker's quote
    # role: picks a real member each time, so brokers and market makers added later appear here too
    order: {symbol: KONSTL, side: BUY, qty: 100, price: 1203.40, counterparty: "role:Market maker"}
    steps:
      - at: "role:Broker"
        does: "{participant}'s own pre-trade risk system (RMS) has already checked the client's margin, credit limit and order size. Its FIX engine, connected to our OEGW over TCP session {session}, then sends a NewOrderSingle (35=D): buy (54=1) 100 (38) KONSTL (55) limit (40=2) at 1203.40 (44), good for the day (59=0)."
        message: "8=FIX.4.4|35=D|49={session}|56=OEGW|34={seq}|52={sending_time}|11={clordid}|55=KONSTL|54=1|38=100|40=2|44=1203.40|59=0|10=128|"
      - at: fix_gateway
        does: "OEGW checks the TCP session is logged on (35=A at start of day), MsgSeqNum 34={seq} is the next expected number, and {participant} is within its message throttle. Assigns exchange order id {order_id} and acknowledges with an ExecutionReport (35=8) pending new."
        message: "8=FIX.4.4|35=8|49=OEGW|56={session}|11={clordid}|37={order_id}|17={exec_id}|150=A|39=A|55=KONSTL|54=1|38=100|44=1203.40|"
        writes: ["orders: insert status=PENDING_NEW filled_qty=0"]
      - at: risk
        does: "Order validation checks KONSTL is tradable, the price is inside today's band from the instrument master (1083.06 to 1323.74), and tick and lot size are valid. Client risk was the broker's job, before sending."
        message: "8=FIX.4.4|35=8|49=OEGW|56={session}|11={clordid}|37={order_id}|150=0|39=0|  (new: order accepted onto the book)"
        writes: ["orders: update status=NEW"]
      - at: matching
        does: "The validated order reaches the matching engine. {counterparty_name} (market maker) is quoting KONSTL 1203.10 bid / 1203.40 offer for 250. The matching rules (price, then time priority) match {participant}'s buy at 1203.40 against that quote: 100 trade at 1203.40 with trade id {trade_id}. The fill, with the trade id in tag 880 (TrdMatchID), goes back to {participant} as an ExecutionReport."
        message: "8=FIX.4.4|35=8|49=OEGW|56={session}|11={clordid}|37={order_id}|150=F|39=2|32=100|31=1203.40|14=100|151=0|880={trade_id}|  (sent back over its TCP session via OEGW; {counterparty_name} gets its own 35=8 for its side)"
        writes: ["orders: update status=FILLED filled_qty=100", "trades: insert counterparty={counterparty} clearing_status=PENDING"]
      - at: trade_bus
        does: "Matching publishes the trade to Kafka, keyed by symbol so every KONSTL trade stays in order on one partition."
        message: "Kafka trades.matched | partition {partition} offset {offset} key=KONSTL value={trade_id}"
      - at: clearing_feed
        does: "Consumes the trade and converts it to the clearing corporation's trade report format."
        message: "Trade report {trade_id}: BUY 100 KONSTL @ 1203.40, {session} vs {counterparty}"
      - at: clearing
        does: "The clearing corporation accepts the trade and becomes the counterparty to both sides for settlement."
        writes: ["trades: update clearing_status=ACCEPTED"]
      - at: surv_bus
        from: matching
        does: "Matching publishes the order's events and the trade to matching.events for surveillance: the order arriving, then its fill."
        message: "Kafka matching.events | partition {partition} offset {offset} key=KONSTL | ORDER_NEW {order_id} BUY 100 @ 1203.40 · TRADE {trade_id} 100 @ 1203.40 · ORDER_FILLED {order_id}"
      - at: surveillance
        does: "Market surveillance consumes the order events and the trade, and runs its alert rules (for example wash trades, spoofing, layering, unusual price moves)."
        message: "Surveillance: order {order_id} {session} and trade {trade_id} {session} vs {counterparty}, KONSTL 100 @ 1203.40, checked"
      - at: md_publisher
        from: matching
        does: "The market data adaptor receives the book change and the trade from matching."
        message: "Book update KONSTL: offer 1203.40 x 150 (was 250) · last trade 100 @ 1203.40"
      - at: md_vendors
        does: "Vendors and brokers' screens show the new best offer and the last traded price."

  - id: rejected
    name: Order rejected by the venue's price band
    order: {member: NRMD02, symbol: MAHPWR, side: BUY, qty: 500, price: 470.00}
    steps:
      - at: broker_b
        does: "Narmada Capital's RMS passes the order (the client has enough limit), and it is sent as a NewOrderSingle (35=D) over TCP session NRMD02: buy 500 MAHPWR at 470.00, well above the market."
        message: "8=FIX.4.4|35=D|49=NRMD02|56=OEGW|34={seq}|52={sending_time}|11={clordid}|55=MAHPWR|54=1|38=500|40=2|44=470.00|59=0|10=211|"
      - at: fix_gateway
        does: "OEGW session, sequence and throttle checks pass. Assigns exchange order id {order_id}."
        message: "8=FIX.4.4|35=8|49=OEGW|56=NRMD02|11={clordid}|37={order_id}|150=A|39=A|"
        writes: ["orders: insert status=PENDING_NEW filled_qty=0"]
      - at: risk
        does: "Order validation checks the price against today's MAHPWR band from the instrument master."
        reject: "Price 470.00 is outside today's band for MAHPWR (371.25 to 453.75)"
        reject_message: "8=FIX.4.4|35=8|49=OEGW|56=NRMD02|11={clordid}|37={order_id}|150=8|39=8|58=Price outside band|  (rejected; 58 carries the reason)"

  - id: broker_blocked
    name: Order stopped by the broker's risk checks
    order: {member: KEST01, symbol: KONSTL, side: BUY, qty: 50000, price: 1203.40}
    steps:
      - at: broker_a
        does: "A Kestrel client keys 50,000 KONSTL instead of 500 (a fat finger): about ₹6 crore."
        reject: "Kestrel's RMS blocks it: order value ₹6.02 Cr is above the client's ₹50 lakh limit. The order is never sent, so the venue has no record of it."
        on_reject: {writes: []}
      - at: fix_gateway
        does: "Never reached: nothing arrives at the OEGW."

  - id: partial
    name: Sell order partly filled, rest stays on the book
    order: {member: BLUW03, symbol: CHLKFD, side: SELL, qty: 1000, price: 286.10}
    steps:
      - at: broker_c
        does: "Bluewater Broking sends a NewOrderSingle (35=D) over its TCP session BLUW03: sell (54=2) 1,000 CHLKFD at 286.10."
        message: "8=FIX.4.4|35=D|49=BLUW03|56=OEGW|34={seq}|52={sending_time}|11={clordid}|55=CHLKFD|54=2|38=1000|40=2|44=286.10|59=0|10=045|"
      - at: fix_gateway
        does: "OEGW session, sequence and throttle checks pass. Assigns exchange order id {order_id}."
        message: "8=FIX.4.4|35=8|49=OEGW|56=BLUW03|11={clordid}|37={order_id}|150=A|39=A|"
        writes: ["orders: insert status=PENDING_NEW filled_qty=0"]
      - at: risk
        does: "Price within the CHLKFD band; member limit fine."
        message: "8=FIX.4.4|35=8|49=OEGW|56=BLUW03|11={clordid}|37={order_id}|150=0|39=0|"
        writes: ["orders: update status=NEW"]
      - at: matching
        does: "Delta Quotes (market maker) is quoting CHLKFD 286.10 bid for 600. The matching rules match 600 of Bluewater's sell against that quote; the remaining 400 rests on the book at 286.10 until it trades, is cancelled or the day ends."
        message: "8=FIX.4.4|35=8|49=OEGW|56=BLUW03|11={clordid}|37={order_id}|150=F|39=1|32=600|31=286.10|14=600|151=400|880={trade_id}|  (partially filled: 400 still open)"
        writes: ["orders: update status=PARTIALLY_FILLED filled_qty=600", "trades: insert qty=600 counterparty=DLTQ12 clearing_status=PENDING"]
      - at: trade_bus
        does: "The trade for the 600 filled is published to Kafka, keyed by symbol."
        message: "Kafka trades.matched | partition {partition} offset {offset} key=CHLKFD value={trade_id}"
      - at: clearing_feed
        does: "Converts the trade to the clearing format."
        message: "Trade report {trade_id}: SELL 600 CHLKFD @ 286.10, BLUW03 vs DLTQ12"
      - at: clearing
        does: "Clearing accepts the 600. The resting 400 is not a trade yet, so clearing never sees it."
        writes: ["trades: update clearing_status=ACCEPTED"]
      - at: surv_bus
        from: matching
        does: "Matching publishes the order's events and the trade to matching.events for surveillance."
        message: "Kafka matching.events | partition {partition} offset {offset} key=CHLKFD | ORDER_NEW {order_id} SELL 1000 @ 286.10 · TRADE {trade_id} 600 @ 286.10 · ORDER_PARTIALLY_FILLED {order_id} leaves 400"
      - at: surveillance
        does: "Surveillance runs its alert rules on the order and the trade; the resting 400 stays under watch as an open order (orders that never trade matter for spoofing and layering)."
        message: "Surveillance: order {order_id} BLUW03 (400 open) and trade {trade_id} BLUW03 vs DLTQ12, CHLKFD 600 @ 286.10"
      - at: md_publisher
        from: matching
        does: "The market data adaptor receives the book change and the trade."
        message: "Book update CHLKFD: bid 286.10 removed · offer 286.10 x 400 (Bluewater's rest) · last trade 600 @ 286.10"
      - at: md_vendors
        does: "Screens show the new best offer and the last traded price."


alerts:
  - {name: "Member session disconnected", on: fix_gateway, metric: sessions_down, above: 0, severity: P2}
  - {name: "Gateway inbound rate high", on: fix_gateway, metric: in_rate, above: 2600, severity: P3}
  - {name: "Gateway queue building", on: fix_gateway, metric: backlog, above: 1500, severity: P2}
  - {name: "Risk reject rate high", on: risk, metric: reject_rate, above: 2, severity: P2}
  - {name: "Matching throughput low", on: matching, metric: out_rate, below: 1400, severity: P2}
  - {name: "Order book store pool saturated", on: orderbook_db, metric: pool_pct, above: 90, severity: P2}
  - {name: "Trade bus partition lag", on: trade_bus, metric: max_partition_lag, above: 400, severity: P2}
  - {name: "Clearing submissions backing up", on: clearing, metric: backlog, above: 2500, severity: P2}
  - {name: "Surveillance consumer lag", on: surv_bus, metric: lag, above: 3000, severity: P3}

diagram:
  notes: >
    Members cannot see inside the exchange, and the exchange cannot see inside members or issuers.
    Support works from the exchange's own gateway, risk, matching and post-trade signals.
    The matching engine sends its output to every downstream: trades to clearing, book updates to the market
    data adaptor, fills to drop copy, and every order event and trade to surveillance.
  groups:
    - {label: "Exchange trading system", ids: [fix_gateway, risk, matching, instrument_master, orderbook_db]}
    - {label: "Listed companies (issuers)", ids: [issuer_1, issuer_2, issuer_3]}
    - {label: "Post-trade", ids: [trade_bus, clearing_feed, clearing]}
    - {label: "Market data and drop copy", ids: [md_publisher, md_vendors, drop_copy]}
    - {label: "Market surveillance", ids: [surv_bus, surveillance]}
  place:
    broker_a: [0, 0]
    broker_b: [0, 1]
    broker_c: [0, 2]
    mm_1: [0, 3]
    mm_2: [0, 4]
    fix_gateway: [1, 2]
    risk: [2, 2]
    matching: [3, 2]
    instrument_master: [2, 3.45]
    orderbook_db: [3, 3.45]
    issuer_1: [1.2, 4.9]
    issuer_2: [2.2, 4.9]
    issuer_3: [3.2, 4.9]
    trade_bus: [4.3, 0.6]
    clearing_feed: [5.3, 0.6]
    clearing: [6.3, 0.6]
    md_publisher: [4.3, 2.2]
    md_vendors: [5.3, 2.2]
    drop_copy: [4.3, 3.45]
    surv_bus: [4.3, 4.75]
    surveillance: [5.3, 4.75]
  steps:
    - {from: broker_a, to: fix_gateway, text: "Brokers send client orders over FIX sessions, one session per member."}
    - {from: mm_1, to: fix_gateway, text: "Market makers stream two-sided quotes to meet their quoting obligations."}
    - {from: fix_gateway, to: risk, text: "The gateway checks the session (logon, sequence numbers) and each member's message throttle."}
    - {from: risk, to: instrument_master, text: "Order validation checks the instrument is tradable, the price band, tick size and lot size from the instrument master. Failed orders are rejected back to the member."}
    - {from: issuer_2, to: instrument_master, text: "Issuers announce corporate actions (splits, dividends, symbol changes) that change prices and bands."}
    - {from: risk, to: matching, text: "Accepted orders enter the order book; matching runs price-time priority."}
    - {from: matching, to: orderbook_db, text: "Order book state is persisted for recovery and audit."}
    - {from: matching, to: trade_bus, text: "Every matched trade is published on the internal Kafka trade bus."}
    - {from: clearing_feed, to: clearing, text: "Trades are submitted to the clearing corporation before the 15:30 clearing cut-off."}
    - {from: matching, to: md_publisher, text: "Prices and depth are broadcast to market data vendors."}
    - {from: matching, to: drop_copy, text: "Drop copies of every fill go back to members' risk systems."}
    - {from: matching, to: surv_bus, text: "Every order event (new, filled, partly filled, resting) and every trade goes to surveillance on its own Kafka topic, so surveillance lag never slows clearing."}
